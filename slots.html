<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>本週空檔時段釋出</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FAF6F0', 100: '#EFE6DC', 200: '#DFD1C0', 300: '#CBB8A1',
              400: '#A68A68', 500: '#8C7355', 600: '#755F46', 700: '#5E4C38',
              800: '#4A3B2C', 900: '#33271C',
            }
          },
          fontFamily: {
            sans: ['Noto Sans TC', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #F4EFEA; }
    /* 9:16 極致手機比例容器 */
    .story-container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      margin: 0 auto;
      background: #FAF6F0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.75rem 1.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="antialiased text-brand-900 selection:bg-brand-400 selection:text-white flex items-center justify-center min-h-screen">

  <div class="story-container">
    <!-- 頂部品牌標題 -->
    <header class="text-center space-y-2 pt-2">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-[#8C7355] text-white rounded-full text-[10.5px] font-bold tracking-widest shadow-xs">
        <i class="fa-solid fa-wand-magic-sparkles text-[9px]"></i>
        <span>LIMITED SLOTS AVAILABLE</span>
      </div>
      <h1 class="font-serif text-2xl font-black text-brand-900 tracking-wider" id="store-title">本週釋出空檔</h1>
      <p class="text-xs text-brand-600 font-medium" id="store-subtitle">點選下方時段直接預約</p>
    </header>

    <!-- 中間時段緊湊宮格區塊 (絕不超長，多時段自動宮格化) -->
    <main class="my-auto py-4 space-y-3" id="slots-main-area">
      <div class="text-center text-xs text-brand-400 py-8">正在讀取釋出時段...</div>
    </main>

    <!-- 底部行動導引 -->
    <footer class="text-center space-y-3 pt-2 border-t border-brand-200/80">
      <div class="flex gap-2">
        <a id="btn-quick-book" href="#" class="flex-1 py-3 bg-[#8C7355] hover:bg-brand-600 text-white rounded-2xl text-xs font-bold shadow-md transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-calendar-check text-[11px]"></i>
          <span>進入線上預約前台</span>
        </a>
      </div>
      <div class="text-[10px] text-brand-400 font-medium tracking-wide">
        📸 手機直接全螢幕截圖即可當 IG 限動美圖發布
      </div>
    </footer>
  </div>

  <script>
    const SUPABASE_URL = "https://kwbxskvnfejfguuwzqfr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_JnpaLZVnGkW9Jr967LeYuQ_d8bXwfnz";
    const urlParams = new URLSearchParams(window.location.search);
    const CURRENT_STORE_ID = (urlParams.get('store_id') || '2deb066f-98f2-4283-945b-6ae0d6a89acb').trim();

    async function loadSlotsPage() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/store_settings?store_id=eq.${CURRENT_STORE_ID}&select=display_title,display_subtitle,published_slots`, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const data = await res.json();
        const settings = (Array.isArray(data) && data.length > 0) ? data[0] : {};

        document.getElementById('store-title').innerText = settings.display_title || "美業沙龍限定空檔";
        if (settings.display_subtitle) document.getElementById('store-subtitle').innerText = settings.display_subtitle;
        document.getElementById('btn-quick-book').href = `index.html?store_id=${CURRENT_STORE_ID}`;

        const rawSlots = settings.published_slots || [];
        const mainArea = document.getElementById('slots-main-area');

        if (!Array.isArray(rawSlots) || rawSlots.length === 0) {
          mainArea.innerHTML = `
            <div class="p-6 bg-white rounded-3xl border border-brand-200 text-center space-y-2">
              <div class="text-3xl">✨</div>
              <div class="text-xs font-bold text-brand-900">目前本週時段已全數約滿</div>
              <p class="text-[11px] text-brand-500">歡迎點擊下方按鈕查看下週最新排程</p>
            </div>
          `;
          return;
        }

        // 依日期分組
        const grouped = {};
        rawSlots.forEach(s => {
          if (!grouped[s.date]) grouped[s.date] = [];
          grouped[s.date].push(s.time);
        });

        let html = '';
        Object.keys(grouped).forEach(d => {
          const times = grouped[d];
          html += `
            <div class="bg-white/95 p-3.5 rounded-3xl border border-brand-200 shadow-xs space-y-2">
              <div class="flex items-center gap-1.5 font-bold text-xs text-brand-900 border-b border-brand-100 pb-1.5">
                <i class="fa-solid fa-calendar-day text-[#8C7355]"></i>
                <span>${d}</span>
              </div>
              <div class="grid grid-cols-3 gap-1.5">
                ${times.map(t => `
                  <a href="index.html?store_id=${CURRENT_STORE_ID}&date=${encodeURIComponent(d)}&time=${t}" class="py-2.5 px-1 bg-brand-50 hover:bg-[#8C7355] hover:text-white text-brand-900 border border-brand-200 rounded-xl text-center font-mono font-bold text-xs transition shadow-xs">
                    ${t}
                  </a>
                `).join('')}
              </div>
            </div>
          `;
        });

        mainArea.innerHTML = html;
      } catch(e) {
        document.getElementById('slots-main-area').innerHTML = '<div class="text-center text-xs text-brand-400 py-8">讀取時段失敗，請重新整理</div>';
      }
    }

    window.onload = loadSlotsPage;
  </script>
</body>
</html>

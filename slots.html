<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>門市預約時間表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FAF7F2', 100: '#F3ECE3', 200: '#E4D7C8',
              500: '#8C7355', 600: '#7A6246', 800: '#4A3B2C', 900: '#2B2118',
            }
          },
          fontFamily: {
            sans: ['Noto Sans TC', 'sans-serif'],
            serif: ['Playfair Display', 'Noto Serif TC', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #F4EFEA; }
    .story-card {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      margin: 0 auto;
      background: #FAF7F2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: max(env(safe-area-inset-top), 1.75rem);
      padding-bottom: max(env(safe-area-inset-bottom), 1.25rem);
      padding-left: 1.1rem;
      padding-right: 1.1rem;
      box-shadow: 0 10px 30px -5px rgba(60, 45, 30, 0.08);
    }
    .custom-scroll::-webkit-scrollbar { display: none; }
    .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="antialiased text-brand-900 flex items-center justify-center min-h-screen">

  <div class="story-card transition-all">
    <!-- 頂部店名與大標題 -->
    <header class="text-center space-y-2.5">
      <div class="inline-block px-3 py-1 bg-white/80 rounded-full border border-brand-200/80 shadow-2xs">
        <div class="text-[10px] font-black text-brand-600 tracking-[0.2em] uppercase font-mono" id="store-title">
          SALON & SPA
        </div>
      </div>
      
      <h1 class="font-serif text-2xl sm:text-3xl font-black text-brand-900 tracking-wider" id="calendar-main-title">
        11 月 預 約 時 間 表
      </h1>

      <!-- 專員代表色圖例對照表 -->
      <div id="staff-legend-box" class="pt-1 flex flex-wrap justify-center items-center gap-2 text-xs font-sans min-h-[26px]">
        <!-- 動態依專員產生代表色標記 -->
      </div>

      <!-- 切換月份與視圖切換按鈕組 -->
      <div class="flex justify-between items-center pt-2 px-0.5">
        <div class="flex items-center gap-1.5 bg-white px-2.5 py-1 rounded-2xl border border-brand-200 shadow-2xs">
          <button type="button" onclick="changeMonth(-1)" class="w-6 h-6 rounded-xl bg-brand-50 hover:bg-brand-100 flex items-center justify-center text-xs text-brand-800 transition active:scale-95">
            <i class="fa-solid fa-chevron-left text-[10px]"></i>
          </button>
          <span class="font-mono text-xs font-black text-brand-900 px-1" id="current-month-display">2026 年 11 月</span>
          <button type="button" onclick="changeMonth(1)" class="w-6 h-6 rounded-xl bg-brand-50 hover:bg-brand-100 flex items-center justify-center text-xs text-brand-800 transition active:scale-95">
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
          </button>
        </div>

        <div class="inline-flex p-1 bg-white rounded-2xl border border-brand-200 shadow-2xs">
          <button type="button" id="tab-cal" onclick="setViewMode('calendar')" class="px-3 py-1 rounded-xl text-xs font-bold bg-[#8C7355] text-white shadow-xs transition active:scale-95">
            <i class="fa-solid fa-calendar-days text-[10px] mr-1"></i>日曆
          </button>
          <button type="button" id="tab-list" onclick="setViewMode('list')" class="px-3 py-1 rounded-xl text-xs font-bold text-brand-700 hover:text-brand-900 transition active:scale-95">
            <i class="fa-solid fa-list-ul text-[10px] mr-1"></i>清單
          </button>
        </div>
      </div>
    </header>

    <!-- 中間月曆畫布容器 -->
    <main class="my-auto py-2.5" id="slots-canvas-container">
      <div class="text-center text-xs text-brand-500 py-16 font-mono flex flex-col items-center justify-center gap-2">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-brand-400"></i>
        <span>正在載入最新時間表...</span>
      </div>
    </main>

    <!-- 底部行動紐 -->
    <footer class="pt-2.5 border-t border-brand-200/80">
      <a id="btn-to-main-booking" href="#" class="w-full py-3.5 bg-gradient-to-r from-[#8C7355] to-[#7A6246] hover:from-[#7A6246] hover:to-[#68523A] text-white rounded-2xl text-xs font-bold shadow-md hover:shadow-lg transition-all duration-300 transform active:scale-98 flex items-center justify-center gap-2 tracking-wider">
        <i class="fa-solid fa-calendar-check text-xs"></i>
        <span>前往預約門市時段</span>
        <i class="fa-solid fa-arrow-right text-[10px] ml-1"></i>
      </a>
    </footer>
  </div>

  <script>
    const SUPABASE_URL = "https://kwbxskvnfejfguuwzqfr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_JnpaLZVnGkW9Jr967LeYuQ_d8bXwfnz";
    const urlParams = new URLSearchParams(window.location.search);
    const CURRENT_STORE_ID = (urlParams.get('store_id') || localStorage.getItem('zy_current_store_id') || '2deb066f-98f2-4283-945b-6ae0d6a89acb').trim();

    let allSlots = [];
    let storeInfo = {};
    let activeView = 'calendar';
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth() + 1;

    // 專員四色盤配置
    // 專員 5 大高質感且對比鮮明的莫蘭迪色盤（粉、黃、紫、藍、綠，互不相近）
    const STAFF_COLORS = [
      { bg: '#FDE8E8', text: '#9B1C1C', dot: '#E02424', border: '#FCA5A5', name: '專員 1' }, // 0. 暮粉 (紅)
      { bg: '#FEF3C7', text: '#92400E', dot: '#D97706', border: '#FCD34D', name: '專員 2' }, // 1. 暖杏 (黃橙)
      { bg: '#F3E8FF', text: '#6B21A8', dot: '#9333EA', border: '#D8B4FE', name: '專員 3' }, // 2. 薰衣 (紫)
      { bg: '#E0F2FE', text: '#075985', dot: '#0284C7', border: '#7DD3FC', name: '專員 4' }, // 3. 冰川 (藍)
      { bg: '#DCFCE7', text: '#166534', dot: '#16A34A', border: '#86EFAC', name: '專員 5' }  // 4. 鼠尾草 (綠)
    ];

    async function initSlots() {
      try {
        // 1. 抓取 store_settings 設定主檔
        const res = await fetch(`${SUPABASE_URL}/rest/v1/store_settings?store_id=eq.${CURRENT_STORE_ID}&select=*`, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const data = await res.json();
        storeInfo = (Array.isArray(data) && data.length > 0) ? data[0] : {};

        let storeName = storeInfo.display_title || storeInfo.settings?.storeName;
        
        // 2. 嘗試讀取店名（附帶容錯保護）
        if (!storeName) {
          try {
            const sRes = await fetch(`${SUPABASE_URL}/rest/v1/stores?id=eq.${CURRENT_STORE_ID}&select=store_name`, {
              headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
            });
            const sData = await sRes.json();
            if (Array.isArray(sData) && sData.length > 0) storeName = sData[0].store_name;
          } catch(e) {}
        }

        document.getElementById('store-title').innerText = storeName || "沙龍預約時間表";
        document.getElementById('btn-to-main-booking').href = `index.html?store_id=${CURRENT_STORE_ID}`;

        // 3. 讀取發布之時段清單
        const rawSlots = storeInfo.published_slots || storeInfo.settings?.published_slots || [];
        allSlots = Array.isArray(rawSlots) ? rawSlots : [];

        // 依發布清單第一筆自動對齊年月
        if (allSlots.length > 0 && allSlots[0].date) {
          const parts = allSlots[0].date.replace(/\//g, '-').split('-');
          if (parts.length >= 2) {
            calYear = parseInt(parts[0], 10);
            calMonth = parseInt(parts[1], 10);
          }
        }

        renderStaffLegend();
        renderMainView();
      } catch (err) {
        console.error("載入異常:", err);
        // 容錯渲染
        renderMainView();
      }
    }

    // 取得專員顏色映射
    function getStaffColorMapping() {
      const rawStaffList = (storeInfo.settings?.staffList || []).filter(s => s.id !== 'all');
      const staffMap = {};

      if (rawStaffList.length > 0) {
        rawStaffList.forEach((st, idx) => {
          const color = STAFF_COLORS[idx % STAFF_COLORS.length];
          staffMap[st.id] = { ...color, name: st.name };
          staffMap[st.name] = { ...color, name: st.name };
        });
      } else {
        const uniqueStaff = [...new Set(allSlots.map(s => s.staffName || s.staffId).filter(Boolean))];
        uniqueStaff.forEach((stName, idx) => {
          const color = STAFF_COLORS[idx % STAFF_COLORS.length];
          staffMap[stName] = { ...color, name: stName };
        });
      }
      return staffMap;
    }

    // 渲染專員圖例對照
    function renderStaffLegend() {
      const staffMap = getStaffColorMapping();
      const box = document.getElementById('staff-legend-box');
      if (!box) return;

      const uniqueStaffNames = [...new Set(Object.values(staffMap).map(s => s.name))];
      if (uniqueStaffNames.length <= 1) {
        box.innerHTML = '';
        return;
      }

      box.innerHTML = uniqueStaffNames.map(name => {
        const item = staffMap[name] || STAFF_COLORS[0];
        return `
          <div class="flex items-center gap-1.5 bg-white px-3 py-1 rounded-full border border-brand-200/90 shadow-2xs">
            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${item.dot};"></span>
            <span class="font-bold text-brand-900 text-[11px]">${name}</span>
          </div>
        `;
      }).join('');
    }

    function setViewMode(mode) {
      activeView = mode;
      document.getElementById('tab-cal').className = mode === 'calendar' 
        ? "px-3 py-1 rounded-xl text-xs font-bold bg-[#8C7355] text-white shadow-xs transition active:scale-95" 
        : "px-3 py-1 rounded-xl text-xs font-bold text-brand-700 hover:text-brand-900 transition active:scale-95";
      document.getElementById('tab-list').className = mode === 'list' 
        ? "px-3 py-1 rounded-xl text-xs font-bold bg-[#8C7355] text-white shadow-xs transition active:scale-95" 
        : "px-3 py-1 rounded-xl text-xs font-bold text-brand-700 hover:text-brand-900 transition active:scale-95";
      renderMainView();
    }

    function changeMonth(offset) {
      calMonth += offset;
      if (calMonth > 12) { calMonth = 1; calYear++; }
      else if (calMonth < 1) { calMonth = 12; calYear--; }
      renderMainView();
    }

    function renderMainView() {
      document.getElementById('calendar-main-title').innerText = `${calMonth} 月 預 約 時 間 表`;
      document.getElementById('current-month-display').innerText = `${calYear} 年 ${calMonth} 月`;

      const container = document.getElementById('slots-canvas-container');
      if (!container) return;

      if (activeView === 'calendar') {
        renderMultiStaffCalendar(container);
      } else {
        renderListView(container);
      }
    }

    // 🌟 核心月曆：嚴格依 published_slots 渲染，有勾選才印、特殊備註白底紅字醒目呈現
    // 🌟 極致俐落排版：顏色代表專員（免印名字）、移除多重內框、文字滿格呈現絕不截斷
    function renderMultiStaffCalendar(container) {
      const daysInMonth = new Date(calYear, calMonth, 0).getDate();
      const firstDayWeek = new Date(calYear, calMonth - 1, 1).getDay();
      const staffMap = getStaffColorMapping();

      let cellsHtml = '';

      for (let i = 0; i < firstDayWeek; i++) {
        cellsHtml += `<div class="bg-[#F8F5F2]/50 min-h-[96px] border-b border-r border-[#EFECE8] p-0.5"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const mm = String(calMonth).padStart(2, '0');
        const dd = String(d).padStart(2, '0');
        const daySlash = `${calYear}/${mm}/${dd}`;

        // 精準比對當日發布之時段
        const daySlots = allSlots.filter(s => {
          if (!s || !s.date) return false;
          const cleanD = String(s.date).replace(/-/g, '/').trim();
          const parts = cleanD.split('/');
          if (parts.length < 3) return false;
          const stdSlash = `${parts[0]}/${String(parts[1]).padStart(2, '0')}/${String(parts[2]).padStart(2, '0')}`;
          return stdSlash === daySlash;
        }).sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));

        const isFull = daySlots.some(s => s.isFull || (s.note && s.note.includes('滿')));

        cellsHtml += `
          <div class="bg-white min-h-[96px] border-b border-r border-[#EFECE8] p-1 flex flex-col justify-start relative select-none">
            <div class="flex justify-between items-center mb-1 px-0.5">
              <span class="text-[11px] font-mono font-black ${isFull ? 'text-gray-400' : 'text-brand-900'}">${d}</span>
              ${isFull ? `<span class="bg-amber-100 text-amber-900 text-[8px] font-black px-1 rounded">滿</span>` : ''}
            </div>

            <!-- 時段列表：單純靠底色代表專員，文字一行完整呈現 -->
            <div class="flex flex-col gap-1 w-full">
              ${daySlots.map(s => {
                const note = (s.note || '').trim();
                const stKey = s.staffId || s.staffName || '';
                const staffColor = staffMap[stKey] || STAFF_COLORS[0];
                const hasSpecialNote = Boolean(note && !note.includes('常態'));

                let bgStyle = staffColor.bg;
                let textStyle = staffColor.text;
                let borderStyle = `border: 1px solid ${staffColor.border};`;

                if (s.isFull) {
                  bgStyle = '#FEF3C7';
                  textStyle = '#92400E';
                  borderStyle = 'border: 1px solid #FCD34D;';
                }

                const targetUrl = `index.html?store_id=${CURRENT_STORE_ID}&date=${encodeURIComponent(daySlash)}&time=${encodeURIComponent(s.time)}` + (s.staffId ? `&staff=${encodeURIComponent(s.staffId)}` : '');

                return `
                  <a href="${targetUrl}" 
                     style="background-color: ${bgStyle}; color: ${textStyle}; ${borderStyle}" 
                     class="w-full text-[9px] font-bold py-1 px-1 rounded-md leading-tight text-center transition hover:opacity-90 active:scale-95 block shadow-2xs">
                    <div class="font-mono tracking-tight font-black">${s.time}</div>
                    ${hasSpecialNote ? `<div class="text-[8px] font-black truncate text-rose-700 mt-0.5">★ ${note}</div>` : ''}
                  </a>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="bg-white rounded-3xl border border-[#E8DFD5] shadow-xs overflow-hidden font-sans">
          <div class="grid grid-cols-7 text-center py-2 border-b border-[#EFECE8] bg-[#FAF8F5] text-[11px] font-bold text-brand-800">
            <span class="text-[#E02424]">週日</span>
            <span>週一</span><span>週二</span><span>週三</span><span>週四</span><span>週五</span>
            <span class="text-[#E02424]">週六</span>
          </div>
          <div class="grid grid-cols-7 border-l border-t border-[#EFECE8] bg-[#EFECE8]">
            ${cellsHtml}
          </div>
        </div>
      `;
    }

    // 清單視圖
    function renderListView(container) {
      const grouped = {};
      const staffMap = getStaffColorMapping();

      allSlots.forEach(s => {
        const cleanD = (s.date || '').replace(/-/g, '/');
        if (!grouped[cleanD]) grouped[cleanD] = [];
        grouped[cleanD].push(s);
      });

      const days = Object.keys(grouped).sort();
      if (days.length === 0) {
        container.innerHTML = '<div class="p-8 bg-white rounded-3xl border border-brand-200 text-center text-xs text-brand-500 font-mono shadow-xs">目前尚無開放時段</div>';
        return;
      }

      container.innerHTML = days.map(d => {
        const items = grouped[d].sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));
        return `
          <div class="bg-white p-3.5 rounded-3xl border border-[#E8DFD5] shadow-xs space-y-2.5 mb-2.5 font-sans">
            <div class="flex justify-between items-center border-b border-brand-100 pb-1.5 text-xs font-bold text-brand-900">
              <span class="font-mono text-sm">${d}</span>
              <span class="text-[10px] bg-brand-100 px-2 py-0.5 rounded-full font-mono text-brand-800 font-bold">剩 ${items.length} 席</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
              ${items.map(s => {
                const stKey = s.staffId || s.staffName || '';
                const staffColor = staffMap[stKey] || STAFF_COLORS[0];
                const note = (s.note || '').trim();
                const url = `index.html?store_id=${CURRENT_STORE_ID}&date=${encodeURIComponent(d)}&time=${encodeURIComponent(s.time)}` + (s.staffId ? `&staff=${encodeURIComponent(s.staffId)}` : '');

                return `
                  <a href="${url}" style="background-color: ${staffColor.bg}; color: ${staffColor.text}; border-color: ${staffColor.border};" class="p-2 border rounded-2xl text-center font-mono transition flex flex-col justify-center items-center shadow-2xs hover:shadow-xs active:scale-95">
                    <span class="font-bold text-xs">${s.time}</span>
                    <span class="text-[9px] font-black mt-0.5 truncate max-w-full">${note ? `★ ${note}` : staffColor.name}</span>
                  </a>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    window.onload = initSlots;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>預約時間表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FAF7F2', 100: '#F3ECE3', 200: '#E4D7C8',
              500: '#8C7355', 800: '#4A3B2C', 900: '#2B2118',
            }
          },
          fontFamily: {
            sans: ['Noto Sans TC', 'sans-serif'],
            serif: ['Noto Serif TC', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #F7F4F0; }
    /* 🌟 預留手機瀏覽器頂部安全高度，徹底防範網址列與瀏海遮蔽 */
    .story-card {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      margin: 0 auto;
      background: #FAF7F2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: max(env(safe-area-inset-top), 2.5rem);
      padding-bottom: max(env(safe-area-inset-bottom), 1.25rem);
      padding-left: 1rem;
      padding-right: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
  </style>
</head>
<body class="antialiased text-brand-900 flex items-center justify-center min-h-screen">

  <div class="story-card">
    <!-- 頂部店名與大標題 (不被瀏覽器遮擋) -->
    <header class="text-center space-y-2">
      <div class="text-xs font-bold text-brand-500 tracking-widest uppercase font-mono" id="store-title">
        SALON & SPA
      </div>
      
      <h1 class="font-serif text-3xl font-black text-brand-900 tracking-wider" id="calendar-main-title">
        11 月 預 約 時 間 表
      </h1>

      <!-- 🌟 專員代表色圖例對照表 (圖三同款) -->
      <div id="staff-legend-box" class="pt-2 flex flex-wrap justify-center items-center gap-3 text-xs font-sans">
        <!-- 動態依專員產生代表色標記 -->
      </div>

      <!-- 預約說明卡 -->
      <div class="bg-[#FFF5F5] border border-[#FED7D7] rounded-xl p-2.5 text-left flex items-start gap-2.5 mt-2">
        <span class="bg-[#FEB2B2] text-[#9B1C1C] text-[10px] font-black px-1.5 py-0.5 rounded shrink-0 mt-0.5">預約須知</span>
        <div class="text-[10.5px] text-[#742A2A] leading-relaxed space-y-0.5 font-medium">
          <div>標示「限定項目」：僅供該項特定技術預約。</div>
          <div>無特殊項目標示：全常態項目皆可自由排入。</div>
        </div>
      </div>

      <!-- 切換月份與視圖 -->
      <div class="flex justify-between items-center pt-2 px-1">
        <div class="flex items-center gap-1">
          <button type="button" onclick="changeMonth(-1)" class="w-6 h-6 rounded bg-white border border-brand-200 flex items-center justify-center text-xs text-brand-800 shadow-2xs"><i class="fa-solid fa-chevron-left"></i></button>
          <span class="font-mono text-xs font-bold text-brand-800" id="current-month-display">2026 年 11 月</span>
          <button type="button" onclick="changeMonth(1)" class="w-6 h-6 rounded bg-white border border-brand-200 flex items-center justify-center text-xs text-brand-800 shadow-2xs"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="inline-flex p-0.5 bg-brand-100 rounded-lg border border-brand-200">
          <button type="button" id="tab-cal" onclick="setViewMode('calendar')" class="px-2.5 py-0.5 rounded text-[11px] font-bold bg-[#8C7355] text-white">日曆圖</button>
          <button type="button" id="tab-list" onclick="setViewMode('list')" class="px-2.5 py-0.5 rounded text-[11px] font-bold text-brand-800">清單</button>
        </div>
      </div>
    </header>

    <!-- 中間月曆網格 -->
    <main class="my-auto py-2" id="slots-canvas-container">
      <div class="text-center text-xs text-brand-500 py-16 font-mono">載入中...</div>
    </main>

    <!-- 底部行動鈕 -->
    <footer class="pt-2 border-t border-brand-200/80">
      <a id="btn-to-main-booking" href="#" class="w-full py-3 bg-[#8C7355] hover:bg-brand-600 text-white rounded-2xl text-xs font-bold shadow-md transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-calendar-check text-[11px]"></i>
        <span>進入線上預約系統</span>
      </a>
    </footer>
  </div>

  <script>
    const SUPABASE_URL = "https://kwbxskvnfejfguuwzqfr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_JnpaLZVnGkW9Jr967LeYuQ_d8bXwfnz";
    const urlParams = new URLSearchParams(window.location.search);
    const CURRENT_STORE_ID = (urlParams.get('store_id') || '2deb066f-98f2-4283-945b-6ae0d6a89acb').trim();

    let allSlots = [];
    let storeInfo = {};
    let activeView = 'calendar';
    let calYear = 2026;
    let calMonth = 11;

    // 專員四色盤配置
    const STAFF_COLORS = [
      { bg: '#FDE8E8', text: '#9B1C1C', dot: '#E02424', border: '#FED7D7', name: '專員 1' }, // 柔粉紅
      { bg: '#FFEDD5', text: '#9A3412', dot: '#EA580C', border: '#FED7AA', name: '專員 2' }, // 杏暖橘
      { bg: '#F3E8FF', text: '#6B21A8', dot: '#9333EA', border: '#E9D5FF', name: '專員 3' }, // 薰衣紫
      { bg: '#E0F2FE', text: '#075985', dot: '#0284C7', border: '#BAE6FD', name: '專員 4' }  // 霧天藍
    ];

    async function initSlots() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/store_settings?store_id=eq.${CURRENT_STORE_ID}&select=*`, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const data = await res.json();
        storeInfo = (Array.isArray(data) && data.length > 0) ? data[0] : {};

        let storeName = storeInfo.display_title || storeInfo.settings?.storeName;
        if (!storeName) {
          const sRes = await fetch(`${SUPABASE_URL}/rest/v1/stores?id=eq.${CURRENT_STORE_ID}&select=name`, {
            headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
          });
          const sData = await sRes.json();
          if (Array.isArray(sData) && sData.length > 0) storeName = sData[0].name;
        }

        document.getElementById('store-title').innerText = storeName || "沙龍預約時間表";
        document.getElementById('btn-to-main-booking').href = `index.html?store_id=${CURRENT_STORE_ID}`;

        const rawSlots = storeInfo.published_slots || storeInfo.settings?.published_slots || [];
        allSlots = Array.isArray(rawSlots) ? rawSlots : [];

        if (allSlots.length > 0 && allSlots[0].date) {
          const parts = allSlots[0].date.replace(/\//g, '-').split('-');
          if (parts.length >= 2) {
            calYear = parseInt(parts[0], 10);
            calMonth = parseInt(parts[1], 10);
          }
        }

        renderStaffLegend();
        renderMainView();
      } catch (err) {
        document.getElementById('slots-canvas-container').innerHTML = '<div class="text-center text-xs text-brand-500 py-10">資料讀取中，請稍候重新整理</div>';
      }
    }

    // 取得專員清單與配置色系
    function getStaffColorMapping() {
      const rawStaffList = (storeInfo.settings?.staffList || []).filter(s => s.id !== 'all');
      const staffMap = {};

      if (rawStaffList.length > 0) {
        rawStaffList.forEach((st, idx) => {
          const color = STAFF_COLORS[idx % STAFF_COLORS.length];
          staffMap[st.id] = { ...color, name: st.name };
          staffMap[st.name] = { ...color, name: st.name };
        });
      } else {
        const uniqueStaff = [...new Set(allSlots.map(s => s.staffName || s.staffId).filter(Boolean))];
        uniqueStaff.forEach((stName, idx) => {
          const color = STAFF_COLORS[idx % STAFF_COLORS.length];
          staffMap[stName] = { ...color, name: stName };
        });
      }

      return staffMap;
    }

    // 渲染圖例對照
    function renderStaffLegend() {
      const staffMap = getStaffColorMapping();
      const box = document.getElementById('staff-legend-box');
      if (!box) return;

      const uniqueStaffNames = [...new Set(Object.values(staffMap).map(s => s.name))];
      if (uniqueStaffNames.length <= 1) {
        box.innerHTML = '';
        return;
      }

      box.innerHTML = uniqueStaffNames.map(name => {
        const item = staffMap[name];
        return `
          <div class="flex items-center gap-1.5 bg-white px-2.5 py-1 rounded-full border border-brand-200 shadow-2xs">
            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${item.dot};"></span>
            <span class="font-bold text-brand-900 text-[11px]">${name}</span>
          </div>
        `;
      }).join('');
    }

    function setViewMode(mode) {
      activeView = mode;
      document.getElementById('tab-cal').className = mode === 'calendar' 
        ? "px-2.5 py-0.5 rounded text-[11px] font-bold bg-[#8C7355] text-white" 
        : "px-2.5 py-0.5 rounded text-[11px] font-bold text-brand-800";
      document.getElementById('tab-list').className = mode === 'list' 
        ? "px-2.5 py-0.5 rounded text-[11px] font-bold bg-[#8C7355] text-white" 
        : "px-2.5 py-0.5 rounded text-[11px] font-bold text-brand-800";
      renderMainView();
    }

    function changeMonth(offset) {
      calMonth += offset;
      if (calMonth > 12) { calMonth = 1; calYear++; }
      else if (calMonth < 1) { calMonth = 12; calYear--; }
      renderMainView();
    }

    function renderMainView() {
      document.getElementById('calendar-main-title').innerText = `${calMonth} 月 預 約 時 間 表`;
      document.getElementById('current-month-display').innerText = `${calYear} 年 ${calMonth} 月`;

      const container = document.getElementById('slots-canvas-container');
      if (!container) return;

      if (activeView === 'calendar') {
        renderMultiStaffCalendar(container);
      } else {
        renderListView(container);
      }
    }

    // 🌟 多位專員同月曆同格呈現
    function renderMultiStaffCalendar(container) {
      const daysInMonth = new Date(calYear, calMonth, 0).getDate();
      const firstDayWeek = new Date(calYear, calMonth - 1, 1).getDay();
      const staffMap = getStaffColorMapping();

      let cellsHtml = '';

      for (let i = 0; i < firstDayWeek; i++) {
        cellsHtml += `<div class="bg-[#F2ECE4]/40 min-h-[82px] border-b border-r border-[#EFECE8] p-0.5"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const mm = String(calMonth).padStart(2, '0');
        const dd = String(d).padStart(2, '0');
        const daySlash = `${calYear}/${mm}/${dd}`;
        const dayHyphen = `${calYear}-${mm}-${dd}`;

        const daySlots = allSlots.filter(s => {
          const cDate = (s.date || '').replace(/\//g, '-');
          return cDate === dayHyphen;
        });

        const isFull = daySlots.some(s => s.isFull || (s.note && s.note.includes('滿')));

        cellsHtml += `
          <div class="bg-white min-h-[82px] border-b border-r border-[#EFECE8] p-0.5 flex flex-col justify-start relative select-none">
            <div class="flex justify-between items-center mb-0.5 px-0.5">
              <span class="text-[10px] font-mono font-black ${isFull ? 'text-gray-400' : 'text-brand-900'}">${d}</span>
              ${isFull ? `<span class="bg-[#FEF3C7] text-[#92400E] text-[7.5px] font-bold px-1 rounded">滿</span>` : ''}
            </div>

            <!-- 時段條列表：多專員各自色塊展示 -->
            <div class="flex flex-col gap-0.5 overflow-hidden">
              ${daySlots.map(s => {
                const note = (s.note || '').trim();
                const stKey = s.staffId || s.staffName || '';
                const staffColor = staffMap[stKey] || STAFF_COLORS[0];

                let bgStyle = staffColor.bg;
                let textStyle = staffColor.text;

                if (s.isFull) {
                  bgStyle = '#FEF3C7';
                  textStyle = '#92400E';
                }

                const targetUrl = `index.html?store_id=${CURRENT_STORE_ID}&date=${encodeURIComponent(daySlash)}&time=${encodeURIComponent(s.time)}` + (s.staffId ? `&staff=${encodeURIComponent(s.staffId)}` : '');

                return `
                  <a href="${targetUrl}" style="background-color: ${bgStyle}; color: ${textStyle};" class="text-[7.5px] font-bold px-1 py-0.5 rounded leading-tight truncate flex items-center justify-between transition block">
                    <span class="font-mono">${s.time}</span>
                    ${note ? `<span class="font-black scale-90 truncate ml-0.5">${note}</span>` : ''}
                  </a>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="bg-white rounded-2xl border border-[#E8DFD5] shadow-xs overflow-hidden font-sans">
          <div class="grid grid-cols-7 text-center py-1.5 border-b border-[#EFECE8] bg-white text-[10.5px] font-bold text-brand-800">
            <span class="text-[#E02424]">週日</span>
            <span>週一</span><span>週二</span><span>週三</span><span>週四</span><span>週五</span>
            <span class="text-[#E02424]">週六</span>
          </div>
          <div class="grid grid-cols-7 border-l border-t border-[#EFECE8] bg-[#EFECE8]">
            ${cellsHtml}
          </div>
        </div>
      `;
    }

    function renderListView(container) {
      const grouped = {};
      const staffMap = getStaffColorMapping();

      allSlots.forEach(s => {
        const d = (s.date || '').replace(/-/g, '/');
        if (!grouped[d]) grouped[d] = [];
        grouped[d].push(s);
      });

      const days = Object.keys(grouped);
      if (days.length === 0) {
        container.innerHTML = '<div class="p-8 bg-white rounded-2xl border border-brand-200 text-center text-xs text-brand-500 font-mono">目前尚無開放時段</div>';
        return;
      }

      container.innerHTML = days.map(d => {
        const items = grouped[d];
        return `
          <div class="bg-white p-3 rounded-2xl border border-[#E8DFD5] shadow-xs space-y-2 mb-2 font-sans">
            <div class="flex justify-between items-center border-b border-brand-100 pb-1 text-xs font-bold text-brand-900">
              <span class="font-mono">${d}</span>
              <span class="text-[10px] bg-brand-100 px-2 py-0.5 rounded-full font-mono text-brand-800">剩 ${items.length} 席</span>
            </div>
            <div class="grid grid-cols-3 gap-1.5">
              ${items.map(s => {
                const stKey = s.staffId || s.staffName || '';
                const staffColor = staffMap[stKey] || STAFF_COLORS[0];
                const note = (s.note || '').trim();
                const url = `index.html?store_id=${CURRENT_STORE_ID}&date=${encodeURIComponent(d)}&time=${encodeURIComponent(s.time)}`;

                return `
                  <a href="${url}" style="background-color: ${staffColor.bg}; color: ${staffColor.text}; border-color: ${staffColor.border};" class="p-2 border rounded-xl text-center font-mono transition flex flex-col justify-center items-center">
                    <span class="font-bold text-xs">${s.time}</span>
                    <span class="text-[8px] font-black mt-0.5 truncate">${note || staffColor.name}</span>
                  </a>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    window.onload = initSlots;
  </script>
</body>
</html>

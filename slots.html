<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>本週釋出空檔 - 限動即時預約</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --theme-primary: #8C7355;
      --theme-bg: #FDFBF7;
      --theme-badge: #F5ECE3;
      --theme-text: #3A3026;
      --theme-border: #EBE5DF;
    }
    body {
      background-color: #F4EFEA;
      font-family: 'Noto Sans TC', sans-serif;
    }
    .story-container {
      width: 100%;
      max-width: 420px;
      min-height: 94vh;
      margin: 1.25rem auto;
      background: var(--theme-bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.75rem 1.25rem;
      border-radius: 2rem;
      border: 1px solid var(--theme-border);
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body class="antialiased flex items-center justify-center min-h-screen p-2 sm:p-4 text-[#33271C]">

  <div class="story-container">
    <!-- 頂部品牌標題 -->
    <header class="text-center space-y-2 pt-2">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10.5px] font-bold tracking-widest shadow-2xs text-white" style="background-color: var(--theme-primary);" id="top-badge">
        <i class="fa-solid fa-wand-magic-sparkles text-[9px]"></i>
        <span>LIMITED SLOTS AVAILABLE</span>
      </div>
      <h1 class="font-serif text-2xl font-black tracking-wider" id="store-title">本週釋出空檔</h1>
      <p class="text-xs font-medium opacity-80" id="store-subtitle">點選下方時段直接預約</p>
    </header>

    <!-- 中間時段緊湊宮格區塊 (支援智慧比對與莫蘭迪狀態) -->
    <main class="my-auto py-3 space-y-3" id="slots-main-area">
      <div class="text-center text-xs text-gray-400 py-12">
        <i class="fa-solid fa-spinner animate-spin mr-1"></i> 正在智慧計算空檔時段...
      </div>
    </main>

    <!-- 底部行動導引 -->
    <footer class="text-center space-y-2.5 pt-3 border-t" style="border-color: var(--theme-border);">
      <a id="btn-quick-book" href="#" class="w-full py-3.5 text-white rounded-2xl text-xs font-bold shadow-md transition flex items-center justify-center gap-1.5" style="background-color: var(--theme-primary);">
        <i class="fa-solid fa-calendar-check text-[11px]"></i>
        <span>進入線上完整預約前台</span>
      </a>
      <div class="text-[10px] text-gray-400 font-medium tracking-wide flex items-center justify-center gap-1">
        <i class="fa-solid fa-camera"></i>
        <span>手機全螢幕截圖即可發布為 IG 限動宣傳圖</span>
      </div>
    </footer>
  </div>

  <script>
    const SUPABASE_URL = "https://kwbxskvnfejfguuwzqfr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_JnpaLZVnGkW9Jr967LeYuQ_d8bXwfnz";
    const urlParams = new URLSearchParams(window.location.search);
    const CURRENT_STORE_ID = (urlParams.get('store_id') || '2deb066f-98f2-4283-945b-6ae0d6a89acb').trim();

    // 8 款莫蘭迪與經典風格色票
    const THEME_PALETTES = {
      latte:  { primary: '#8C7355', bg: '#FDFBF7', badge: '#F5ECE3', text: '#3A3026', border: '#EBE5DF' },
      matcha: { primary: '#637361', bg: '#F7F8F5', badge: '#E5EADF', text: '#2D352C', border: '#DFE5D9' },
      noir:   { primary: '#1A1A1A', bg: '#FBFBFB', badge: '#EFEFEF', text: '#000000', border: '#E5E5E5' },
      navy:   { primary: '#4A5F73', bg: '#F6F8FA', badge: '#E1E8EE', text: '#212B35', border: '#DCE3E8' },
      rose:   { primary: '#996C74', bg: '#FCF8F8', badge: '#F1E2E4', text: '#42282C', border: '#EBDADF' },
      sage:   { primary: '#557169', bg: '#F5F7F6', badge: '#E0E8E5', text: '#25332F', border: '#D8E2DF' },
      amber:  { primary: '#D97706', bg: '#FDFBF7', badge: '#FEF3C7', text: '#3D2808', border: '#FDE68A' },
      pekoe:  { primary: '#6E6259', bg: '#F8F6F4', badge: '#E8E3DF', text: '#332B25', border: '#E1DAD4' }
    };

    function applyThemePalette(themeKey) {
      const theme = THEME_PALETTES[themeKey] || THEME_PALETTES['latte'];
      const root = document.documentElement;
      root.style.setProperty('--theme-primary', theme.primary);
      root.style.setProperty('--theme-bg', theme.bg);
      root.style.setProperty('--theme-badge', theme.badge);
      root.style.setProperty('--theme-text', theme.text);
      root.style.setProperty('--theme-border', theme.border);
      document.body.style.backgroundColor = theme.badge;
    }

    async function loadSlotsPage() {
      const mainArea = document.getElementById('slots-main-area');
      try {
        // 並行撈取：門市基本資料、後台發布清單、以及現有已確認預約（進行撞期智慧比對）
        const [settingsRes, storeRes, bookingsRes] = await Promise.all([
          fetch(`${SUPABASE_URL}/rest/v1/store_settings?store_id=eq.${CURRENT_STORE_ID}&select=display_title,display_subtitle,published_slots,theme_color`, {
            headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
          }).then(r => r.json()),
          fetch(`${SUPABASE_URL}/rest/v1/stores?id=eq.${CURRENT_STORE_ID}&select=store_name,theme_color`, {
            headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
          }).then(r => r.json()),
          fetch(`${SUPABASE_URL}/rest/v1/bookings?store_id=eq.${CURRENT_STORE_ID}&status=neq.已取消&status=neq.婉拒&select=appointment_time`, {
            headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
          }).then(r => r.json())
        ]);

        const settings = (Array.isArray(settingsRes) && settingsRes.length > 0) ? settingsRes[0] : {};
        const store = (Array.isArray(storeRes) && storeRes.length > 0) ? storeRes[0] : {};

        // 1. 套用色彩主題
        const currentTheme = settings.theme_color || store.theme_color || 'latte';
        applyThemePalette(currentTheme);

        // 2. 品牌抬頭
        const storeName = settings.display_title || store.store_name || "美業沙龍限定空檔";
        document.getElementById('store-title').innerText = storeName;
        if (settings.display_subtitle) {
          document.getElementById('store-subtitle').innerText = settings.display_subtitle;
        }
        document.getElementById('btn-quick-book').href = `index.html?store_id=${CURRENT_STORE_ID}`;

        const rawSlots = settings.published_slots || [];

        if (!Array.isArray(rawSlots) || rawSlots.length === 0) {
          mainArea.innerHTML = `
            <div class="p-8 bg-white/90 rounded-3xl border border-dashed border-gray-300 text-center space-y-2.5">
              <div class="text-3xl text-gray-300"><i class="fa-solid fa-calendar-xmark"></i></div>
              <div class="text-xs font-bold text-gray-800">目前本週時段已全數約滿</div>
              <p class="text-[11px] text-gray-500">歡迎點擊下方按鈕預約常態時段</p>
            </div>
          `;
          return;
        }

        // 3. 智慧排查：比對當前時間與現有預約名冊
        const nowMs = Date.now();
        const bookedTimeSet = new Set(
          (bookingsRes || []).map(b => {
            if (!b.appointment_time) return '';
            const d = new Date(b.appointment_time);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
          })
        );

        // 依日期分組
        const grouped = {};
        rawSlots.forEach(s => {
          if (!s.date || !s.time) return;
          const slotDateTimeMs = new Date(`${s.date.replace(/\//g, '-')}T${s.time}:00+08:00`).getTime();
          // 過濾掉過去的時間
          if (slotDateTimeMs < nowMs) return;

          if (!grouped[s.date]) grouped[s.date] = [];
          
          // 判定是否已被搶約
          const fullKey = `${s.date} ${s.time}`;
          const isOccupied = bookedTimeSet.has(fullKey);

          grouped[s.date].push({
            time: s.time,
            isOccupied: isOccupied
          });
        });

        const weekMap = ['日', '一', '二', '三', '四', '五', '六'];
        let html = '';
        const dates = Object.keys(grouped).sort();

        if (dates.length === 0) {
          mainArea.innerHTML = `
            <div class="p-8 bg-white/90 rounded-3xl border border-dashed border-gray-300 text-center space-y-2">
              <div class="text-2xl text-emerald-600"><i class="fa-solid fa-circle-check"></i></div>
              <div class="text-xs font-bold">釋出時段已全數完售！</div>
              <p class="text-[11px] text-gray-400">請隨時關注官方限動最新公告</p>
            </div>
          `;
          return;
        }

        dates.forEach(d => {
          const slotItems = grouped[d];
          const dObj = new Date(d.replace(/\//g, '-'));
          const weekStr = isNaN(dObj.getDay()) ? '' : ` (週${weekMap[dObj.getDay()]})`;

          html += `
            <div class="bg-white/95 p-3.5 rounded-3xl border shadow-2xs space-y-2" style="border-color: var(--theme-border);">
              <div class="flex items-center justify-between border-b pb-1.5" style="border-color: var(--theme-border);">
                <span class="font-bold text-xs flex items-center gap-1.5" style="color: var(--theme-text);">
                  <i class="fa-solid fa-calendar-day" style="color: var(--theme-primary);"></i>
                  <span>${d}</span>
                  <span class="text-[11px] opacity-75 font-medium">${weekStr}</span>
                </span>
                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold font-mono" style="background-color: var(--theme-badge); color: var(--theme-primary);">
                  剩餘 ${slotItems.filter(i => !i.isOccupied).length} 席
                </span>
              </div>

              <div class="grid grid-cols-3 gap-1.5">
                ${slotItems.map(item => {
                  if (item.isOccupied) {
                    return `
                      <div class="py-2.5 px-1 bg-gray-100/80 border border-gray-200 rounded-xl text-center font-mono font-bold text-xs text-gray-400 opacity-60 line-through select-none cursor-not-allowed">
                        ${item.time} <span class="text-[9px] block no-underline font-sans font-normal">已約滿</span>
                      </div>
                    `;
                  }
                  return `
                    <a href="index.html?store_id=${CURRENT_STORE_ID}&date=${encodeURIComponent(d)}&time=${encodeURIComponent(item.time)}" 
                       class="py-2.5 px-1 border rounded-xl text-center font-mono font-black text-xs transition shadow-2xs flex flex-col items-center justify-center hover:scale-105 active:scale-95" 
                       style="background-color: var(--theme-badge); border-color: var(--theme-border); color: var(--theme-primary);">
                      <span>${item.time}</span>
                      <span class="text-[9px] font-sans font-bold opacity-80">可預約</span>
                    </a>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        });

        mainArea.innerHTML = html;
      } catch(e) {
        mainArea.innerHTML = '<div class="text-center text-xs text-rose-500 py-8">讀取時段失敗，請重新整理</div>';
      }
    }

    window.onload = loadSlotsPage;
  </script>
</body>
</html>

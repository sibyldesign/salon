<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>沙龍管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FDFBF7', 100: '#F7EDE8', 200: '#EBE5DF', 300: '#D5C7BC',
              400: '#BCA38F', 500: '#A08875', 800: '#5C4B3C', 900: '#3D3126',
            }
          },
          fontFamily: { sans: ['Noto Sans TC', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-50 text-brand-900 antialiased pb-28">

<!-- 解鎖登入畫面 -->
<div id="lock-screen" class="fixed inset-0 bg-brand-50 z-50 flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-3xl shadow-sm border border-brand-200 text-center w-full max-w-xs">
    <div class="w-12 h-12 mx-auto mb-3 bg-brand-100 rounded-full flex items-center justify-center text-brand-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    </div>
    <div class="text-base font-bold text-brand-900 mb-4" id="lock-title">沙龍管理後台</div>
    <div id="lock-error" class="text-xs text-red-500 mb-2 h-4"></div>
    <input type="password" id="pin-input" class="w-full text-center text-2xl tracking-[0.3em] py-3 rounded-xl border border-brand-200 mb-4 focus:ring-2 focus:ring-brand-400 focus:outline-none" placeholder="請輸入密碼" maxlength="6">
    <button class="w-full py-3 bg-brand-400 hover:bg-brand-500 text-white font-bold rounded-xl shadow-md transition" onclick="checkPin()">解鎖登入</button>
  </div>
</div>

<!-- 頂部導航列 -->
<header class="bg-white border-b border-brand-200 px-4 py-3 sticky top-0 z-30 shadow-sm flex justify-between items-center">
  <div class="font-bold text-sm text-brand-900 tracking-wide" id="top-bar-title">沙龍管理系統</div>
  <div class="flex gap-2">
    <button class="p-2 text-brand-500 hover:bg-brand-50 rounded-xl transition" onclick="fetchDataAndRender()" title="重新整理">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    </button>
    <button class="p-2 text-brand-400 hover:bg-brand-50 rounded-xl transition" onclick="location.reload()" title="登出">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    </button>
  </div>
</header>

<main class="max-w-md mx-auto p-4" id="main-content" style="display: none;">

  <!-- 分頁 1. 日曆總覽 -->
  <div id="page-calendar" class="page space-y-4">
    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm">
      <div class="flex justify-between items-center mb-3">
        <button class="p-2 border border-brand-300 rounded-full text-brand-800 hover:bg-brand-50" onclick="changeCalMonth(-1)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div id="cal-month-title" class="font-bold text-sm text-brand-900"></div>
        <button class="p-2 border border-brand-300 rounded-full text-brand-800 hover:bg-brand-50" onclick="changeCalMonth(1)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center text-xs" id="cal-grid"></div>
    </div>
    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm" id="selected-date-appts">
      <div class="text-center text-xs text-brand-400 py-4">點擊上方日期查看預約</div>
    </div>
  </div>

  <!-- 分頁 2. 名單管理 -->
  <div id="page-customer" class="page space-y-3" style="display: none;">
    <div class="flex justify-between items-center bg-white p-3.5 rounded-2xl border border-brand-200 shadow-sm">
      <span class="text-xs font-bold text-brand-900">預約名單清單</span>
      <select id="filter-status" class="text-xs border border-brand-200 rounded-lg px-2 py-1 bg-brand-50" onchange="renderCustomer()">
        <option value="ALL">全部狀態</option>
        <option value="待確認">待確認</option>
        <option value="已確認">已確認</option>
        <option value="已結單">已結單</option>
        <option value="已取消">已取消</option>
      </select>
    </div>
    <div id="cust-content-area" class="space-y-3"></div>
  </div>

  <!-- 分頁 3. 排班管理 -->
  <div id="page-shift" class="page space-y-4" style="display: none;">
    <div class="bg-white p-3.5 rounded-2xl border border-brand-200 shadow-sm" id="staff-shift-selector-box" style="display: none;">
      <div class="text-[11px] font-bold text-brand-500 mb-2">美容師班表切換</div>
      <div class="flex gap-2 overflow-x-auto pb-1" id="staff-shift-buttons"></div>
    </div>
    <div class="flex gap-2 overflow-x-auto pb-2 border-b border-dashed border-brand-300" id="shift-scroll-area"></div>
    <div id="shift-content-area"></div>
  </div>

  <!-- 分頁 4. 業績統計 -->
  <div id="page-revenue" class="page space-y-4" style="display: none;">
    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">營業額分析</div>
      <select id="rev-service-select" class="w-full text-xs border border-brand-200 rounded-xl p-2.5 bg-brand-50" onchange="renderRevenue()">
        <option value="ALL">全部服務項目總覽</option>
      </select>
      <div class="p-4 bg-brand-50 rounded-2xl text-center border border-brand-100">
        <div class="text-[11px] text-brand-500">實收業績總計</div>
        <div class="text-2xl font-bold text-brand-900 mt-1" id="rev-total-amount">0元</div>
      </div>
      <div id="rev-list-area" class="divide-y divide-brand-100 text-xs"></div>
    </div>
  </div>

  <!-- 分頁 5. 回訪關懷 -->
  <div id="page-care" class="page space-y-4" style="display: none;">
    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">定期回訪建議名單</div>
      <div id="care-list" class="space-y-2"></div>
    </div>
    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">自訂 5 組關懷週期與文案</div>
      <div id="care-rules-container" class="space-y-2"></div>
      <button class="w-full py-2.5 bg-brand-400 text-white text-xs font-bold rounded-xl shadow-md" onclick="saveCareRules()">儲存關懷規則</button>
    </div>
  </div>

  <!-- 分頁 6. 服務項目與作品 -->
  <div id="page-services" class="page space-y-4" style="display: none;">
    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900" id="svc-form-title">新增服務項目</div>
      <input type="hidden" id="edit-svc-id">
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="svc-name" class="p-2.5 rounded-xl border border-brand-200 text-xs bg-brand-50/50" placeholder="服務名稱 (如: 洗剪設計)">
        <input type="number" id="svc-price" class="p-2.5 rounded-xl border border-brand-200 text-xs bg-brand-50/50" placeholder="金額 (如: 800)">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <input type="number" id="svc-duration" class="p-2.5 rounded-xl border border-brand-200 text-xs bg-brand-50/50" placeholder="所需時間 (分鐘)">
        <select id="svc-type" class="p-2.5 rounded-xl border border-brand-200 text-xs bg-brand-50/50">
          <option value="Group_A">Group A (等待期技術類)</option>
          <option value="Group_B">Group B (全程專屬類)</option>
        </select>
      </div>
      <div class="flex items-center gap-2 px-1">
        <input type="checkbox" id="svc-is-addon" class="accent-brand-400 rounded">
        <label class="text-xs font-medium text-brand-800">設為「加購項目」（前台需選主項目後才可選）</label>
      </div>
      <div class="flex gap-2">
        <button class="flex-1 py-2.5 bg-brand-400 text-white text-xs font-bold rounded-xl shadow-md" onclick="saveServiceItem()">儲存服務項目</button>
        <button class="px-3 py-2.5 bg-gray-200 text-gray-700 text-xs font-bold rounded-xl hidden" id="svc-cancel-btn" onclick="resetServiceForm()">取消</button>
      </div>
    </div>
    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-2">
      <div class="text-xs font-bold text-brand-900 mb-2">服務項目列表</div>
      <div id="service-list-container" class="space-y-2"></div>
    </div>
    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">新增作品集</div>
      <input type="text" id="work-cat" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs bg-brand-50/50" placeholder="分類 (例如：染髮設計 / 美甲光療)">
      <input type="text" id="work-title" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs bg-brand-50/50" placeholder="作品標題">
      <input type="text" id="work-link" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs bg-brand-50/50" placeholder="IG 連結 (選填)">
      <input type="file" id="work-file" class="w-full p-2 text-xs border border-brand-200 rounded-xl bg-brand-50/50" accept="image/*">
      <button class="w-full py-2.5 bg-brand-400 text-white text-xs font-bold rounded-xl shadow-md" onclick="uploadAndSavePortfolio()">發布作品</button>
    </div>
    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-2">
      <div class="text-xs font-bold text-brand-900 mb-2">作品展示列表</div>
      <div id="portfolio-list-container" class="grid grid-cols-2 gap-2"></div>
    </div>
  </div>

  <!-- 分頁 7. 方案管理 -->
  <div id="page-subscription" class="page space-y-4" style="display: none;">
    <div class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">系統訂閱方案</div>
      <div class="p-4 bg-brand-50 rounded-2xl space-y-2 text-xs border border-brand-100">
        <div class="flex justify-between"><span class="text-brand-500">系統版本</span><span class="font-bold text-brand-900" id="sub-plan-name">標準版</span></div>
        <div class="flex justify-between"><span class="text-brand-500">終止訂閱日</span><span class="font-bold text-brand-900" id="sub-expire-date">載入中...</span></div>
        <div class="flex justify-between"><span class="text-brand-500">帳號狀態</span><span class="font-bold text-green-600" id="sub-status-badge">正常運行中</span></div>
      </div>
    </div>
    <div class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">線上續費</div>
      <div class="space-y-2" id="plan-options-container"></div>
    </div>
    <div class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">功能許願留言區</div>
      <textarea id="wish-content" rows="3" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs" placeholder="描述您希望系統新增的功能..."></textarea>
      <button class="w-full py-2.5 bg-brand-800 text-white text-xs font-bold rounded-xl shadow-md" onclick="submitWish()">送出許願</button>
    </div>
  </div>

  <!-- 分頁 8. 店休與設定 -->
  <div id="page-settings" class="page space-y-4" style="display: none;">
    <!-- 店家公休控制台 -->
    <div class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-4">
      <div class="flex items-center gap-2 text-sm font-bold text-red-500">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        店家公休控制台
      </div>
      <div class="p-3.5 bg-brand-50/70 rounded-2xl border border-brand-200/60 space-y-2.5">
        <div class="text-xs font-bold text-brand-900">1. 勾選每週固定公休日</div>
        <div class="grid grid-cols-4 gap-2 text-xs" id="weekly-off-grid">
          <label class="flex items-center gap-1.5 p-2 bg-white rounded-xl border border-brand-200"><input type="checkbox" value="0" class="accent-brand-400"> 日</label>
          <label class="flex items-center gap-1.5 p-2 bg-white rounded-xl border border-brand-200"><input type="checkbox" value="1" class="accent-brand-400"> 一</label>
          <label class="flex items-center gap-1.5 p-2 bg-white rounded-xl border border-brand-200"><input type="checkbox" value="2" class="accent-brand-400"> 二</label>
          <label class="flex items-center gap-1.5 p-2 bg-white rounded-xl border border-brand-200"><input type="checkbox" value="3" class="accent-brand-400"> 三</label>
          <label class="flex items-center gap-1.5 p-2 bg-white rounded-xl border border-brand-200"><input type="checkbox" value="4" class="accent-brand-400"> 四</label>
          <label class="flex items-center gap-1.5 p-2 bg-white rounded-xl border border-brand-200"><input type="checkbox" value="5" class="accent-brand-400"> 五</label>
          <label class="flex items-center gap-1.5 p-2 bg-white rounded-xl border border-brand-200"><input type="checkbox" value="6" class="accent-brand-400"> 六</label>
        </div>
      </div>
      <div class="p-3.5 bg-brand-50/70 rounded-2xl border border-brand-200/60 space-y-2.5">
        <div class="text-xs font-bold text-brand-900">2. 指定特殊公休日</div>
        <div class="flex gap-2">
          <input type="date" id="new-custom-off-date" class="flex-1 p-2 rounded-xl border border-brand-200 text-xs bg-white">
          <button class="px-3.5 py-2 bg-brand-400 text-white rounded-xl text-xs font-bold" onclick="addCustomOffDate()">+ 新增</button>
        </div>
        <div class="flex flex-wrap gap-1.5 mt-2" id="custom-off-dates-tags"></div>
      </div>
      <button class="w-full py-3 bg-red-500 hover:bg-red-600 text-white text-xs font-bold rounded-2xl shadow-md transition" onclick="saveOffDaysSetting()">儲存公休設定</button>
    </div>

    <!-- 專員管理 -->
    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">服務專員列表</div>
      <div class="space-y-2" id="staff-list-container"></div>
      <div class="flex gap-2 pt-2">
        <input type="text" id="new-staff-id" class="w-1/3 p-2 rounded-xl border border-brand-200 text-xs" placeholder="代號 (如 staff_a)">
        <input type="text" id="new-staff-name" class="w-1/2 p-2 rounded-xl border border-brand-200 text-xs" placeholder="姓名 (如 專員A)">
        <button class="flex-1 py-2 bg-brand-400 text-white text-xs font-bold rounded-xl" onclick="addStaffMember()">新增</button>
      </div>
    </div>

    <!-- 密碼與基本資料 -->
    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">後台密碼管理</div>
      <div class="flex gap-2">
        <input type="password" id="cfg-new-pin" class="flex-1 p-2.5 rounded-xl border border-brand-200 text-xs" placeholder="輸入 4-6 碼新密碼">
        <button class="px-4 py-2.5 bg-brand-800 text-white rounded-xl text-xs font-bold" onclick="updateAdminPin()">修改密碼</button>
      </div>
    </div>
    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">品牌資料</div>
      <input type="text" id="cfg-title" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs" placeholder="店家名稱">
      <input type="text" id="cfg-subtitle" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs" placeholder="副標題">
      <input type="text" id="cfg-address" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs" placeholder="店面地址 (留空則不顯示)">
      <input type="text" id="cfg-hours" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs" placeholder="營業時間文字">
      <div>
        <label class="text-xs font-bold text-brand-800">預約緩衝禁約時間 (小時)</label>
        <input type="number" id="cfg-buffer" class="w-full p-2.5 mt-1 rounded-xl border border-brand-200 text-xs" placeholder="例：1">
      </div>
    </div>

    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">營業排班時段與間隔</div>
      <div class="grid grid-cols-2 gap-2">
        <input type="time" id="cfg-shift-start" class="p-2.5 rounded-xl border border-brand-200 text-xs" value="09:00">
        <input type="time" id="cfg-shift-end" class="p-2.5 rounded-xl border border-brand-200 text-xs" value="19:00">
      </div>
      <select id="cfg-shift-interval" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs">
        <option value="30">每 30 分鐘一格</option>
        <option value="60">每 60 分鐘一格</option>
      </select>
    </div>

    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">功能模組開關</div>
      <div class="space-y-2 text-xs">
        <label class="flex items-center justify-between p-2 rounded-xl bg-brand-50/50"><span>啟用 指定專員選取</span><input type="checkbox" id="cfg-toggle-staff-select" class="accent-brand-400"></label>
        <label class="flex items-center justify-between p-2 rounded-xl bg-brand-50/50"><span>啟用 多位專員獨立排班</span><input type="checkbox" id="cfg-toggle-multi-staff-schedule" class="accent-brand-400"></label>
        <label class="flex items-center justify-between p-2 rounded-xl bg-brand-50/50"><span>啟用 說明圖輪播</span><input type="checkbox" id="cfg-toggle-carousel" class="accent-brand-400"></label>
        <label class="flex items-center justify-between p-2 rounded-xl bg-brand-50/50"><span>啟用 新舊客身份選取</span><input type="checkbox" id="cfg-toggle-custtype" class="accent-brand-400"></label>
        <label class="flex items-center justify-between p-2 rounded-xl bg-brand-50/50"><span>啟用 作品集專區</span><input type="checkbox" id="cfg-toggle-portfolio" class="accent-brand-400"></label>
        <label class="flex items-center justify-between p-2 rounded-xl bg-brand-50/50"><span>啟用 居家保養叮嚀</span><input type="checkbox" id="cfg-toggle-care" class="accent-brand-400"></label>
      </div>
    </div>

    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">說明圖管理 (4:5 比例)</div>
      <input type="text" id="cfg-promo" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs" placeholder="跑馬燈公告文字">
      <div class="grid grid-cols-4 gap-2" id="promo-upload-grid"></div>
    </div>

    <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3">
      <div class="text-xs font-bold text-brand-900">通知與連結</div>
      <textarea id="cfg-booking-msg-tpl" rows="3" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs" placeholder="預約確認通知範本"></textarea>
      <input type="text" id="cfg-line" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs" placeholder="官方 LINE 網址">
      <input type="text" id="cfg-ig" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs" placeholder="Instagram 網址">
      <input type="text" id="cfg-map" class="w-full p-2.5 rounded-xl border border-brand-200 text-xs" placeholder="Google 地圖網址">
      <button class="w-full py-3 bg-brand-400 text-white text-xs font-bold rounded-2xl shadow-md" onclick="saveStoreSettings()">儲存全部設定</button>
    </div>
  </div>

</main>

<div id="fab-btn" class="fixed bottom-24 right-5 w-14 h-14 bg-brand-500 text-white rounded-full flex items-center justify-center text-3xl shadow-lg cursor-pointer z-30" onclick="openManualBooking()" style="display: none;">

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxJlhG1eDEwuyjiJedTtvND-iwIzGXA3sfc_iN_Pq-15LIKWwlHGDX5tFRVdlOzfanONA/exec";
  const IMGBB_API_KEY = "56cc9473cd6512942296b1fbeb5149de";
  const urlParams = new URLSearchParams(window.location.search);
  const CURRENT_STORE_ID = urlParams.get('store_id') || '2deb066f-98f2-4283-945b-6ae0d6a89acb';
  const CURRENT_STAFF_PARAM = urlParams.get('staff') || null;

  let backendData = {};
  let currentShiftDate = 'ALL';
  let activeShiftStaffId = 'all';
  let shiftSlotStates = {};
  let customOffDatesArray = [];
  let calYear = new Date().getFullYear();
  let calMonth = new Date().getMonth();
  let promoImgsArray = new Array(7).fill("");

  async function checkPin() {
    const input = document.getElementById('pin-input').value;
    const res = await fetch(`${API_URL}?action=verifyPin&store_id=${CURRENT_STORE_ID}&pin=${input}`);
    const data = await res.json();
    if (data.valid) {
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      document.getElementById('fab-btn').style.display = 'flex';
      document.getElementById('bottom-nav').style.display = 'flex';
      
      if (CURRENT_STAFF_PARAM) {
        document.querySelectorAll('.full-admin-only').forEach(el => el.style.display = 'none');
        document.getElementById('lock-title').innerText = `專員後台 (${CURRENT_STAFF_PARAM})`;
        activeShiftStaffId = CURRENT_STAFF_PARAM;
      }

      renderUploadSlots();
      fetchDataAndRender(true);
    } else {
      document.getElementById('lock-error').innerText = '密碼錯誤，請重新輸入';
      document.getElementById('pin-input').value = '';
    }
  }

  async function fetchDataAndRender(isFirstLoad = false) {
    try {
      const res = await fetch(`${API_URL}?action=getTeacherData&store_id=${CURRENT_STORE_ID}&staff_id=${CURRENT_STAFF_PARAM || 'all'}`);
      backendData = await res.json();

      renderCalendar();
      renderCustomer();
      renderShift();
      renderRevenueSelect();
      renderRevenue();
      renderCare(backendData.reminders || []);
      renderServiceList();
      renderPortfolioList();
      renderSubscriptionUI();
      populateSettings();
    } catch (err) {
      Swal.fire('連線異常', err.message, 'error');
    }
  }

  function switchPage(pageId, el) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.nav-item').forEach(n => {
      n.className = "nav-item flex flex-col items-center justify-center px-3 py-1.5 rounded-2xl transition text-brand-400 font-medium";
    });
    document.getElementById('page-' + pageId).style.display = 'block';
    el.className = "nav-item flex flex-col items-center justify-center px-3 py-1.5 rounded-2xl transition bg-brand-50 text-brand-500 font-bold";
  }

  function renderCalendar() {
    const grid = document.getElementById('cal-grid');
    document.getElementById('cal-month-title').innerText = `${calYear} 年 ${calMonth + 1} 月`;
    const headers = ['日', '一', '二', '三', '四', '五', '六'];
    let html = headers.map(h => `<div class="py-1 font-bold text-brand-400 text-[11px]">${h}</div>`).join('');
    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    for (let i = 0; i < firstDay; i++) html += `<div class="py-2.5"></div>`;
    
    for (let i = 1; i <= daysInMonth; i++) {
      let dStr = `${calYear}/${String(calMonth+1).padStart(2,'0')}/${String(i).padStart(2,'0')}`;
      let apptsToday = (backendData.appointments || []).filter(a => a.date === dStr && a.status !== '已取消');
      let dotsHtml = apptsToday.map(() => `<span class="w-1.5 h-1.5 bg-red-500 rounded-full inline-block"></span>`).join('');
      html += `
        <div class="py-2 rounded-xl hover:bg-brand-100 cursor-pointer flex flex-col items-center transition border border-transparent hover:border-brand-200" onclick="showApptsInCalendar('${dStr}')">
          <span class="font-bold">${i}</span>
          <div class="flex gap-0.5 mt-0.5 h-1.5">${dotsHtml}</div>
        </div>`;
    }
    grid.innerHTML = html;
  }

  function changeCalMonth(dir) {
    calMonth += dir;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  }

  function showApptsInCalendar(dateStr) {
    const container = document.getElementById('selected-date-appts');
    const appts = (backendData.appointments || []).filter(a => a.date === dateStr && a.status !== '已取消');
    if (appts.length === 0) {
      container.innerHTML = `<div class="text-center text-xs text-brand-400 py-3">${dateStr}<br>當日無有效預約</div>`;
      return;
    }
    appts.sort((a,b) => a.time.localeCompare(b.time));
    container.innerHTML = `
      <div class="text-xs font-bold text-brand-900 mb-2 border-b border-brand-100 pb-1.5">${dateStr} 預約明細</div>
      <div class="space-y-2">${appts.map(a => `
        <div class="p-2.5 bg-brand-50 rounded-xl border border-brand-200 text-xs">
          <div class="flex justify-between font-bold"><span class="text-brand-500">${a.time}</span><span>${a.name} (${a.phone})</span></div>
          <div class="text-brand-800 text-[11px] mt-0.5">項目：${a.service}</div>
        </div>
      `).join('')}</div>`;
  }

  function renderCustomer() {
    const statusFilter = document.getElementById('filter-status').value;
    const content = document.getElementById('cust-content-area');
    let appts = backendData.appointments || [];
    if (statusFilter !== 'ALL') appts = appts.filter(a => a.status === statusFilter);

    if (appts.length === 0) { content.innerHTML = '<div class="text-center text-xs text-brand-400 py-6">查無預約紀錄</div>'; return; }
    appts.sort((a,b) => (b.date + b.time).localeCompare(a.date + a.time));

    content.innerHTML = appts.map(a => `
      <div class="bg-white p-4 rounded-2xl border-l-4 border-l-brand-400 border border-brand-200 shadow-sm space-y-1.5">
        <div class="flex justify-between items-center text-xs font-bold">
          <span class="text-brand-500 text-sm">${a.date} ${a.time}</span>
          <span class="px-2 py-0.5 rounded-full text-[10px] ${a.status === '待確認' ? 'bg-amber-100 text-amber-800' : (a.status === '已結單' ? 'bg-gray-100 text-gray-700' : 'bg-green-100 text-green-800')}">${a.status}</span>
        </div>
        <div class="text-xs font-bold text-brand-900">${a.name} <span class="text-brand-400 font-normal">(${a.phone})</span></div>
        <div class="text-[11px] text-brand-500">專員：<b>${a.staffName || '不指定'}</b> | LINE：<b>${a.lineName || '無'}</b> | 金額：<b>${a.price}元</b> ${a.status === '已結單' ? `(實收：<b class="text-red-500">${a.finalPrice}元</b>)` : ''}</div>
        <div class="text-xs text-brand-800">項目：<b>${a.service}</b> ${a.notes ? `<br><span class="text-brand-500">備註：${a.notes}</span>` : ''}</div>
        <div class="flex gap-1.5 pt-2 flex-wrap text-[11px]">
          <button class="px-2.5 py-1 bg-amber-500 text-white rounded-lg font-bold" onclick="copyBookingNotice('${a.name}', '${a.date} ${a.time}', '${a.service}', ${a.price})">複製通知</button>
          <button class="px-2.5 py-1 bg-blue-500 text-white rounded-lg font-bold" onclick="openEditDetailsModal('${a.id}', '${a.service}', '${a.notes || ''}')">改項目/備註</button>
          <button class="px-2.5 py-1 bg-brand-500 text-white rounded-lg font-bold" onclick="openRescheduleModal('${a.id}', '${a.name}', '${a.date}', '${a.time}')">改期</button>
          <button class="px-2.5 py-1 bg-green-600 text-white rounded-lg font-bold" onclick="openCompleteModal('${a.id}', '${a.name}', ${a.price})">結單改金額</button>
          <button class="px-2.5 py-1 bg-red-500 text-white rounded-lg font-bold" onclick="cancelAppt('${a.id}', '${a.name}')">取消</button>
        </div>
      </div>
    `).join('');
  }

  function copyBookingNotice(name, timeStr, svcStr, priceNum) {
    const tpl = backendData.settings.bookingMsgTpl || "您好！已為您確認預約 🎉\n姓名：{姓名}\n時間：{時間}\n項目：{項目}\n預估金額：{金額}元\n期待您的光臨！";
    const finalMsg = tpl.replace('{姓名}', name).replace('{時間}', timeStr).replace('{項目}', svcStr).replace('{金額}', priceNum);
    navigator.clipboard.writeText(finalMsg).then(() => {
      Swal.fire({ title: '已複製預約通知！', text: '請直接至 LINE 貼上傳送給客人', icon: 'success', timer: 1800, showConfirmButton: false });
    });
  }

  function openEditDetailsModal(id, currentSvc, currentNotes) {
    Swal.fire({
      title: '修改項目與備註',
      html: `
        <input id="swal-edit-svc" class="swal2-input text-xs" style="width:85%;" value="${currentSvc}">
        <input id="swal-edit-notes" class="swal2-input text-xs" style="width:85%;" value="${currentNotes}" placeholder="備註內容">
      `,
      showCancelButton: true, confirmButtonText: '更新儲存',
      preConfirm: () => ({ services: document.getElementById('swal-edit-svc').value, notes: document.getElementById('swal-edit-notes').value })
    }).then(async r => {
      if (r.isConfirmed) {
        await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "updateBookingDetails", id, services: r.value.services, notes: r.value.notes }) });
        fetchDataAndRender();
      }
    });
  }

  function openRescheduleModal(id, name, oldDate, oldTime) {
    Swal.fire({
      title: `幫 ${name} 改期`,
      html: `
        <input id="resched-date" type="date" class="swal2-input text-xs" style="width:85%;" value="${oldDate.replace(/\//g, '-')}">
        <input id="resched-time" type="time" class="swal2-input text-xs" style="width:85%;" value="${oldTime}">
      `,
      showCancelButton: true, confirmButtonText: '確定改期',
      preConfirm: () => ({ date: document.getElementById('resched-date').value.replace(/-/g, '/'), time: document.getElementById('resched-time').value })
    }).then(async r => {
      if (r.isConfirmed) {
        await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "rescheduleBooking", id, date: r.value.date, time: r.value.time }) });
        fetchDataAndRender();
      }
    });
  }

  function openCompleteModal(id, name, originalPrice) {
    Swal.fire({
      title: `預約結單 - ${name}`,
      html: `
        <div class="text-xs text-brand-400 mb-2">原預估金額：${originalPrice}元</div>
        <input type="number" id="swal-final-price" class="swal2-input text-center text-sm" style="width:80%;" value="${originalPrice}">
      `,
      showCancelButton: true, confirmButtonText: '確認結單', confirmButtonColor: '#2e7d32',
      preConfirm: () => document.getElementById('swal-final-price').value
    }).then(async r => {
      if (r.isConfirmed) {
        await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "completeBooking", id, finalPrice: r.value }) });
        fetchDataAndRender();
      }
    });
  }

  function cancelAppt(id, name) {
    Swal.fire({ title: `取消 ${name} 的預約?`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#f44336', confirmButtonText: '確定取消' }).then(async r => {
      if (r.isConfirmed) {
        await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "cancelBooking", id }) });
        fetchDataAndRender();
      }
    });
  }

  // ⏰ 排班
  function renderShift() {
    if (backendData.settings.enableMultiStaffSchedule && !CURRENT_STAFF_PARAM) {
      const staffList = backendData.settings.staffList || [];
      document.getElementById('staff-shift-buttons').innerHTML = staffList.map(s => `
        <button class="px-3 py-1 rounded-xl text-xs font-bold whitespace-nowrap border transition ${activeShiftStaffId === s.id ? 'bg-brand-400 text-white border-brand-400' : 'bg-brand-50 border-brand-200 text-brand-800'}" onclick="switchShiftStaff('${s.id}')">
          ${s.name}
        </button>
      `).join('');
      document.getElementById('staff-shift-selector-box').style.display = 'block';
    }

    const dates = backendData.scheduleDates || [];
    let html = `<div class="date-box shrink-0 px-4 py-2 rounded-xl text-center cursor-pointer border text-xs ${currentShiftDate === 'ALL' ? 'bg-brand-400 text-white border-brand-400 font-bold' : 'bg-white border-brand-200'}" onclick="selectShiftDate('ALL')">全部</div>`;
    dates.forEach(d => {
      let dParts = d.date.split('/');
      html += `
        <div class="date-box shrink-0 px-3 py-2 rounded-xl text-center cursor-pointer border text-xs ${currentShiftDate === d.date ? 'bg-brand-400 text-white border-brand-400 font-bold' : 'bg-white border-brand-200'}" onclick="selectShiftDate('${d.date}')">
          <div class="text-[10px] opacity-70">${dParts[1]}月</div>
          <div class="font-bold text-sm">${dParts[2]}</div>
        </div>`;
    });
    document.getElementById('shift-scroll-area').innerHTML = html;

    const content = document.getElementById('shift-content-area');
    if (currentShiftDate === 'ALL') {
      content.innerHTML = dates.map(d => `
        <div class="p-3.5 bg-white rounded-2xl border border-brand-200 flex justify-between items-center shadow-sm">
          <div><div class="font-bold text-xs">${d.date}</div><div class="text-[11px] text-brand-400">時段預設：全休/關閉</div></div>
          <button class="px-3 py-1.5 bg-brand-400 text-white text-xs font-bold rounded-xl" onclick="selectShiftDate('${d.date}')">設定時段</button>
        </div>
      `).join('');
      return;
    }

    const start = backendData.settings.shiftStartTime || '09:00';
    const end = backendData.settings.shiftEndTime || '19:00';
    const interval = Number(backendData.settings.shiftInterval || 30);
    const [sH, sM] = start.split(':').map(Number);
    const [eH, eM] = end.split(':').map(Number);
    const slots = [];
    for (let m = sH * 60 + sM; m <= eH * 60 + eM; m += interval) {
      let hh = Math.floor(m / 60); let mm = m % 60;
      slots.push((hh < 10 ? '0' + hh : hh) + ':' + (mm === 0 ? '00' : mm));
    }

    const staffKey = `${activeShiftStaffId}_${currentShiftDate}`;
    if (!shiftSlotStates[staffKey]) {
      shiftSlotStates[staffKey] = {};
      slots.forEach(t => { shiftSlotStates[staffKey][t] = false; });
    }

    content.innerHTML = `
      <div class="bg-white rounded-3xl border border-brand-200 overflow-hidden shadow-sm">
        <div class="p-4 bg-brand-50 border-b border-brand-200 flex justify-between items-center">
          <div class="font-bold text-xs text-brand-900">${currentShiftDate} 排班</div>
          <div class="flex gap-1.5">
            <button class="px-2.5 py-1 border border-brand-300 rounded-lg text-xs font-bold" onclick="toggleAllShift('${staffKey}', false)">全休</button>
            <button class="px-2.5 py-1 border border-brand-300 rounded-lg text-xs font-bold bg-brand-400 text-white" onclick="toggleAllShift('${staffKey}', true)">全開</button>
          </div>
        </div>
        <div class="divide-y divide-brand-100">${slots.map(t => {
          const isOpen = shiftSlotStates[staffKey][t] === true;
          return `
            <div class="p-3 flex justify-between items-center text-xs">
              <span class="font-bold text-brand-800">${t}</span>
              <button class="px-4 py-1 rounded-full text-xs font-bold transition ${isOpen ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}" onclick="toggleSlotState('${staffKey}', '${t}', this)">
                ${isOpen ? '上班中' : '已關閉'}
              </button>
            </div>`;
        }).join('')}</div>
      </div>`;
  }

  function switchShiftStaff(id) { activeShiftStaffId = id; renderShift(); }
  function selectShiftDate(dStr) { currentShiftDate = dStr; renderShift(); }

  function toggleSlotState(staffKey, timeStr, btn) {
    const newState = !(shiftSlotStates[staffKey][timeStr] === true);
    shiftSlotStates[staffKey][timeStr] = newState;
    btn.className = `px-4 py-1 rounded-full text-xs font-bold transition ${newState ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
    btn.innerText = newState ? '上班中' : '已關閉';

  async function moveServiceOrder(idx, dir) {
    const svcs = backendData.services || [];
    const targetIdx = idx + dir;

    const temp = svcs[idx];
    svcs[idx] = svcs[targetIdx];
    svcs[targetIdx] = temp;
    for (let i = 0; i < svcs.length; i++) {
      svcs[i].sortOrder = i;
      await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "saveService", store_id: CURRENT_STORE_ID, data: svcs[i] }) });

  async function handleImgUpload(idx, input) {
    const file = input.files[0];
    if (!file) return;
    Swal.fire({ title: `正在上傳說明圖 ${idx + 1}...`, allowOutsideClick: false }); Swal.showLoading();

    try {
      const formData = new FormData();
      formData.append("image", file);
      const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
      const data = await res.json();
      if (data.success) {
        promoImgsArray[idx] = data.data.url;
        document.getElementById(`slot-${idx}`).style.backgroundImage = `url('${data.data.url}')`;
        document.getElementById(`slot-${idx}`).innerHTML = '';
        Swal.fire('上傳成功', '', 'success');
      }
    } catch (e) {
      Swal.fire('上傳失敗', e.message, 'error');
    }
  }

        <input id="swal-time" type="time" class="swal2-input text-xs" style="width:85%;">
      `,
      showCancelButton: true, confirmButtonText: '確定安插',
      preConfirm: () => {
        const name = document.getElementById('swal-name').value;
        const staffSel = document.getElementById('swal-staff');
        const staffId = staffSel.value;
        const staffName = staffSel.options[staffSel.selectedIndex]?.getAttribute('data-name') || '不指定';
        const svcSel = document.getElementById('swal-service');
        const service = svcSel.value;
        const price = svcSel.options[svcSel.selectedIndex]?.getAttribute('data-price') || 0;
        const date = document.getElementById('swal-date').value;
        const time = document.getElementById('swal-time').value;
        if (!name || !service || !date || !time) { Swal.showValidationMessage('請填寫完整資料'); return false; }
        return { name, staffId, staffName, service, price, date: date.replace(/-/g, '/'), time };
      }
    }).then(async r => {
      if (r.isConfirmed) {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "forceAddBooking", store_id: CURRENT_STORE_ID, data: r.value })
        });
        fetchDataAndRender();
        Swal.fire('預約已安插！', '', 'success');
      }
    });
  }
</script>
</body>
</html>

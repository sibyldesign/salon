<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sibyl 官方通知綁定</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FDFBF7] flex items-center justify-center min-h-screen p-4 text-center">
  <div class="bg-white p-6 rounded-3xl shadow-sm border border-[#EBE5DF] max-w-xs w-full space-y-3">
    <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-2xl">🛡️</div>
    <h2 class="font-bold text-base text-gray-800">Sibyl 官方安全防護綁定</h2>
    <p class="text-xs text-gray-500" id="status-text">正在為您自動綁定官方通知...</p>
  </div>

  <script>
    const LIFF_ID = "2011183690-A3PkQLO3";
    const API_URL = "https://script.google.com/macros/s/AKfycbxJlhG1eDEwuyjiJedTtvND-iwIzGXA3sfc_iN_Pq-15LIKWwlHGDX5tFRVdlOzfanONA/exec";
    const urlParams = new URLSearchParams(window.location.search);
    const storeId = urlParams.get('store_id') || '2deb066f-98f2-4283-945b-6ae0d6a89acb';

    window.onload = async function() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          
          await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "bindLineUser",
              store_id: storeId,
              userId: profile.userId,
              displayName: profile.displayName
            })
          });

          document.getElementById('status-text').innerHTML = `✅ 綁定成功！<br>店長：<b>${profile.displayName}</b><br>已開通防停權與密碼救援防護！`;
          setTimeout(() => liff.closeWindow(), 2000);
        }
      } catch (err) {
        document.getElementById('status-text').innerText = "綁定失敗，請直接聯繫客服";
      }
    };
  </script>
</body>
</html>

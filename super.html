<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sibyl SaaS 總管控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen p-4 md:p-8">

<div id="super-lock" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-3xl max-w-xs w-full text-center space-y-4 shadow-2xl">
    <div class="text-4xl">👑</div>
    <h2 class="text-base font-bold text-gray-900">Sibyl 總管身分驗證</h2>
    <input type="password" id="sa-secret-input" class="w-full text-center p-3 rounded-xl border border-gray-300 font-mono text-lg" placeholder="請輸入管理密碼">
    <button onclick="authSuperAdmin()" class="w-full py-3 bg-gray-900 hover:bg-black text-white font-bold rounded-xl text-xs shadow-md">驗證進入</button>
  </div>
</div>

<div class="max-w-3xl mx-auto space-y-6" id="super-panel" style="display: none;">
  <div class="bg-gray-900 text-white p-6 rounded-3xl shadow-lg flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold">👑 Sibyl SaaS 全客戶營運監控</h1>
      <p class="text-xs text-gray-400 mt-1">直接監控 Supabase stores 資料表</p>
    </div>
    <button onclick="loadAllStores()" class="px-4 py-2 bg-gray-800 text-xs font-bold rounded-xl border border-gray-700">重新整理</button>
  </div>

  <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200 space-y-4">
    <div id="stores-list-container" class="space-y-3"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://kwbxskvnfejfguuwzqfr.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_JnpaLZVnGkW9Jr967LeYuQ_d8bXwfnz";
  const SUPER_ADMIN_SECRET = "888";

  function authSuperAdmin() {
    const val = document.getElementById('sa-secret-input').value.trim();
    if (val === SUPER_ADMIN_SECRET) {
      document.getElementById('super-lock').style.display = 'none';
      document.getElementById('super-panel').style.display = 'block';
      loadAllStores();
    } else {
      Swal.fire('密碼錯誤', '', 'error');
    }
  }

  async function loadAllStores() {
    const container = document.getElementById('stores-list-container');
    container.innerHTML = '<div class="text-center text-xs text-gray-400 py-6">載入中...</div>';
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/stores?select=*&order=created_at.desc`, {
        headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
      });
      const stores = await res.json();
      container.innerHTML = stores.map(st => `
        <div class="p-4 bg-gray-50 rounded-2xl border border-gray-200 text-xs space-y-2">
          <div class="flex justify-between items-center font-bold text-sm">
            <span>${st.store_name} (${st.industry_type || 'beauty'})</span>
            <span class="px-2 py-0.5 rounded text-[10px] ${st.plan_status==='active'?'bg-green-100 text-green-800':'bg-red-100 text-red-800'}">${st.plan_status}</span>
          </div>
          <div class="text-gray-500">密碼: <code>${st.admin_pin || '8888'}</code> | 到期: ${st.expires_at ? st.expires_at.split('T')[0] : '無'}</div>
          <div class="text-gray-400 font-mono text-[10px]">ID: ${st.id}</div>
          <div class="flex gap-2 pt-1">
            <button class="px-3 py-1 bg-green-600 text-white rounded-lg font-bold" onclick="saRenew('${st.id}', 30)">+30天</button>
            <button class="px-3 py-1 bg-blue-600 text-white rounded-lg font-bold" onclick="saRenew('${st.id}', 365)">+1年</button>
            <button class="px-3 py-1 bg-gray-800 text-white rounded-lg font-bold" onclick="window.open('admin.html?store_id=${st.id}', '_blank')">開啟後台</button>
          </div>
        </div>
      `).join('');
    } catch(e) {
      container.innerHTML = `<div class="text-red-500 text-xs">讀取失敗: ${e.message}</div>`;
    }
  }

  async function saRenew(storeId, days) {
    const baseDate = new Date();
    baseDate.setDate(baseDate.getDate() + Number(days));
    await fetch(`${SUPABASE_URL}/rest/v1/stores?id=eq.${storeId}`, {
      method: "PATCH",
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify({ plan_status: "active", expires_at: baseDate.toISOString() })
    });
    Swal.fire('已延長！', '', 'success');
    loadAllStores();
  }
</script>
</body>
</html>

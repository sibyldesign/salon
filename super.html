<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sibyl SaaS 總管控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen p-4 md:p-8">

<div id="super-lock" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-3xl max-w-xs w-full text-center space-y-4 shadow-2xl">
    <div class="text-4xl">👑</div>
    <h2 class="text-base font-bold text-gray-900">Sibyl 總管身分驗證</h2>
    <input type="password" id="sa-secret-input" class="w-full text-center p-3 rounded-xl border border-gray-300 font-mono text-lg" placeholder="請輸入管理密碼">
    <button onclick="authSuperAdmin()" class="w-full py-3 bg-gray-900 hover:bg-black text-white font-bold rounded-xl text-xs shadow-md">驗證進入</button>
  </div>
</div>

<div class="max-w-5xl mx-auto space-y-6" id="super-panel" style="display: none;">
  <div class="bg-gray-900 text-white p-6 rounded-3xl shadow-lg flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold">Sibyl SaaS 營運總管中心</h1>
      <p class="text-xs text-gray-400 mt-1">監控全體訂單、即時金流狀態、接收功能許願與發布全域廣播</p>
    </div>
    <button onclick="loadSuperData()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-bold rounded-xl border border-gray-700">重新整理</button>
  </div>

  <!-- 1. 全域廣播發布區 -->
  <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200 space-y-3">
    <h2 class="text-sm font-bold text-gray-900">📢 發布全體店家後台廣播公告</h2>
    <div class="flex gap-2">
      <input type="text" id="broadcast-input" class="flex-1 p-2.5 text-xs rounded-xl border border-gray-200" placeholder="例如：【系統維護】週二凌晨進行雲端主機效能優化升級...">
      <button onclick="sendBroadcast()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-md">發布公告</button>
    </div>
    <div id="current-broadcast" class="text-xs text-gray-500">目前運作中的公告：載入中...</div>
  </div>

  <!-- 2. 線上訂單與客戶開通清單 (含未付款/已開通區分) -->
  <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200 space-y-4">
    <div class="flex justify-between items-center">
      <h2 class="text-sm font-bold text-gray-900">🏪 全客戶訂閱與開通監控</h2>
      <div class="flex gap-2">
        <span class="px-2.5 py-1 bg-green-100 text-green-800 text-[11px] font-bold rounded-lg" id="stat-active-count">已開通: 0</span>
        <span class="px-2.5 py-1 bg-amber-100 text-amber-800 text-[11px] font-bold rounded-lg" id="stat-pending-count">未付款/飄走: 0</span>
      </div>
    </div>
    <div id="stores-list-container" class="space-y-3"></div>
  </div>

  <!-- 3. 店家功能許願池 -->
  <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200 space-y-3">
    <h2 class="text-sm font-bold text-gray-900">🎁 店家功能許願清單</h2>
    <div id="wishes-container" class="space-y-2 text-xs"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://kwbxskvnfejfguuwzqfr.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_JnpaLZVnGkW9Jr967LeYuQ_d8bXwfnz";
  const SUPER_ADMIN_SECRET = "888";

  function authSuperAdmin() {
    if (document.getElementById('sa-secret-input').value.trim() === SUPER_ADMIN_SECRET) {
      document.getElementById('super-lock').style.display = 'none';
      document.getElementById('super-panel').style.display = 'block';
      loadSuperData();
    } else {
      Swal.fire('密碼錯誤', '', 'error');
    }
  }

  async function loadSuperData() {
    loadBroadcast();
    loadWishes();
    loadAllStores();
  }

  async function loadBroadcast() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/system_announcements?is_active=eq.true&order=created_at.desc&limit=1`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const data = await res.json();
    if (data && data.length > 0) {
      document.getElementById('current-broadcast').innerHTML = `目前公告：<b class="text-gray-800">${data[0].content}</b> (${data[0].created_at.split('T')[0]})`;
    } else {
      document.getElementById('current-broadcast').innerText = '目前無任何生效中公告。';
    }
  }

  async function sendBroadcast() {
    const text = document.getElementById('broadcast-input').value.trim();
    if (!text) return Swal.fire('請填寫公告內容', '', 'warning');
    await fetch(`${SUPABASE_URL}/rest/v1/system_announcements`, {
      method: "POST",
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify({ content: text, is_active: true })
    });
    document.getElementById('broadcast-input').value = '';
    Swal.fire('廣播公告已送出！', '所有店家登入後台即可即時看見。', 'success');
    loadBroadcast();
  }

  async function loadWishes() {
    const container = document.getElementById('wishes-container');
    const res = await fetch(`${SUPABASE_URL}/rest/v1/feature_wishes?order=created_at.desc&select=*`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const wishes = await res.json();
    if (!wishes || wishes.length === 0) {
      container.innerHTML = '<div class="text-gray-400 py-2">目前尚無店家許願。</div>';
      return;
    }
    container.innerHTML = wishes.map(w => `
      <div class="p-3 bg-gray-50 rounded-xl border border-gray-200 flex justify-between items-start">
        <div class="space-y-1">
          <div class="font-bold text-gray-900">${w.content}</div>
          <div class="text-[11px] text-gray-500">店家：<b>${w.store_name || '未命名'}</b> | <code>Store ID: ${w.store_id || '無'}</code> | 時間：${w.created_at ? w.created_at.split('T')[0] : ''}</div>
        </div>
        <span class="px-2 py-0.5 rounded text-[10px] bg-blue-100 text-blue-800 font-bold">${w.status || '評估中'}</span>
      </div>
    `).join('');
  }

  async function loadAllStores() {
    const container = document.getElementById('stores-list-container');
    const res = await fetch(`${SUPABASE_URL}/rest/v1/stores?select=*&order=created_at.desc`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const stores = await res.json();
    
    let activeCount = 0;
    let pendingCount = 0;

    container.innerHTML = stores.map(st => {
      const isAct = st.plan_status === 'active';
      if (isAct) activeCount++; else pendingCount++;

      return `
        <div class="p-4 bg-gray-50 rounded-2xl border border-gray-200 text-xs space-y-2">
          <div class="flex justify-between items-center font-bold text-sm">
            <span>${st.store_name} (${st.plan_name || '標準方案'})</span>
            <span class="px-2.5 py-0.5 rounded-full text-[10px] ${isAct ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800 font-bold'}">
              ${isAct ? '已付款開通' : '下單未付款 (未結案)'}
            </span>
          </div>
          <div class="text-gray-600 space-y-0.5 text-[11px]">
            <div>負責人信箱：<b>${st.owner_email || '未填寫'}</b> | 電話：<b>${st.owner_phone || '未填寫'}</b></div>
            <div>到期日：${st.expires_at ? st.expires_at.split('T')[0] : '無期限'} | 後台密碼：<code>${st.admin_pin || '8888'}</code></div>
            <div class="text-gray-400 font-mono">Store ID: ${st.id}</div>
          </div>
          <div class="flex gap-2 pt-1 flex-wrap">
            <button class="px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold" onclick="saUpdateStatus('${st.id}', 'active', 365)">手動開通 (+1年)</button>
            <button class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold" onclick="saUpdateStatus('${st.id}', 'active', 30)">手動開通 (+30天)</button>
            <button class="px-3 py-1.5 bg-gray-800 hover:bg-black text-white rounded-lg font-bold" onclick="window.open('admin.html?store_id=${st.id}', '_blank')">直通後台</button>
            <button class="px-3 py-1.5 bg-brand-500 border border-gray-300 text-gray-800 rounded-lg font-bold" onclick="window.open('index.html?store_id=${st.id}', '_blank')">預覽前台</button>
          </div>
        </div>`;
    }).join('');

    document.getElementById('stat-active-count').innerText = `已開通: ${activeCount}`;
    document.getElementById('stat-pending-count').innerText = `未付款/飄走: ${pendingCount}`;
  }

  async function saUpdateStatus(storeId, status, addDays) {
    const baseDate = new Date();
    baseDate.setDate(baseDate.getDate() + Number(addDays));
    await fetch(`${SUPABASE_URL}/rest/v1/stores?id=eq.${storeId}`, {
      method: "PATCH",
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify({ plan_status: status, expires_at: baseDate.toISOString() })
    });
    Swal.fire('已更新開通狀態！', `已將方案設定為 ${status}，到期日已順延。`, 'success');
    loadAllStores();
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sibyl SaaS 總管中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FAF6F0', 100: '#EFE6DC', 200: '#DFD1C0', 300: '#CBB8A1',
              400: '#A68A68', 500: '#8C7355', 600: '#755F46', 700: '#5E4C38',
              800: '#4A3B2C', 900: '#33271C',
            }
          },
          fontFamily: { sans: ['Noto Sans TC', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-50 text-brand-900 antialiased pb-20">

  <!-- 登入鎖定層 (管理密碼 888) -->
  <div id="super-lock" class="fixed inset-0 bg-brand-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-3xl shadow-sm border border-brand-200 text-center w-full max-w-xs space-y-4">
      <div class="w-12 h-12 mx-auto bg-brand-100 rounded-2xl flex items-center justify-center text-brand-600 text-xl">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-brand-900">Sibyl SaaS 總管系統</h1>
        <p class="text-xs text-brand-400 mt-0.5">請輸入管理金鑰</p>
      </div>
      <input type="password" id="super-key-input" onkeydown="if(event.key==='Enter') checkSuperKey()" class="w-full text-center text-xl tracking-[0.2em] py-2.5 rounded-xl border border-brand-200 focus:ring-2 focus:ring-brand-400 outline-none" placeholder="管理密碼" maxlength="10">
      <button onclick="checkSuperKey()" class="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-xl shadow-md transition text-xs">驗證進入</button>
    </div>
  </div>

  <header class="bg-white border-b border-brand-200 px-4 py-3 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="w-7 h-7 bg-brand-500 text-white rounded-lg flex items-center justify-center text-xs shadow-sm">
          <i class="fa-solid fa-crown"></i>
        </span>
        <span class="font-bold text-sm text-brand-900">Sibyl 數位管家 | 租戶營運總控台</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="loadInitialData()" class="p-2 text-brand-500 hover:bg-brand-50 rounded-xl transition" title="重新整理">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <button onclick="location.reload()" class="p-2 text-brand-400 hover:bg-brand-50 rounded-xl transition" title="登出">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 頂部切換標籤 -->
  <div class="max-w-4xl mx-auto px-4 pt-4">
    <div class="flex gap-2 border-b border-brand-200 pb-2">
      <button id="tab-btn-stores" onclick="switchSuperTab('stores')" class="px-4 py-2 rounded-2xl text-xs font-bold transition bg-brand-500 text-white shadow-xs">
        <i class="fa-solid fa-store mr-1"></i> 全租戶店家名冊與開通狀態
      </button>
      <button id="tab-btn-announcement" onclick="switchSuperTab('announcement')" class="px-4 py-2 rounded-2xl text-xs font-bold transition bg-white text-brand-700 border border-brand-200">
        <i class="fa-solid fa-bullhorn mr-1"></i> 全平台即時公告、維護鎖定與許願池
      </button>
    </div>
  </div>

  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- 分頁 1：店家名冊與開通狀態 -->
    <div id="super-page-stores" class="space-y-4">
      
      <!-- 即將到期 / 欠費通知警示專區 -->
      <div id="expiring-alert-container"></div>

      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold text-brand-900 flex items-center gap-1.5">
          <i class="fa-solid fa-users-rectangle text-brand-500"></i>
          <span>全租戶店家名冊</span>
        </h2>
        <span id="store-count-badge" class="text-xs px-2.5 py-0.5 bg-brand-100 text-brand-800 rounded-full font-bold">載入中...</span>
      </div>

      <!-- 狀態篩選與即時搜尋 -->
      <div class="flex flex-col sm:flex-row gap-2 justify-between">
        <div class="flex gap-2 overflow-x-auto pb-1">
          <button onclick="filterStores('ALL', this)" class="store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-brand-500 text-white shadow-xs whitespace-nowrap">全部店家</button>
          <button onclick="filterStores('pending', this)" class="store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-brand-800 border border-brand-200 whitespace-nowrap">待開通 (未付款)</button>
          <button onclick="filterStores('active', this)" class="store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-brand-800 border border-brand-200 whitespace-nowrap">運行中 (已開通)</button>
          <button onclick="filterStores('locked', this)" class="store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-brand-800 border border-brand-200 whitespace-nowrap">已鎖定</button>
          <button onclick="filterStores('expired', this)" class="store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-brand-800 border border-brand-200 whitespace-nowrap">已過期</button>
        </div>
        <div class="relative w-full sm:w-64">
          <input type="text" id="store-search-kw" oninput="currentPage = 1; renderStores();" placeholder="🔍 搜尋店名/電話/LINE/Email..." class="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl border border-brand-200 bg-white outline-none focus:ring-1 focus:ring-brand-400">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-brand-400 text-xs"></i>
        </div>
      </div>
      
      <!-- 店家卡片清單 -->
      <div id="stores-container" class="space-y-3"></div>

      <!-- 10 筆分頁控制器 (上一頁、數字頁碼、下一頁) -->
      <div id="pagination-controls" class="flex items-center justify-between bg-white p-3.5 rounded-2xl border border-brand-200 text-xs shadow-xs">
        <div class="text-brand-500 text-[11px]" id="page-info-text">載入中...</div>
        <div class="flex gap-1 items-center" id="page-buttons-container"></div>
      </div>
    </div>

    <!-- 分頁 2：全域公告、維護鎖定按鈕控制台與許願池 -->
    <div id="super-page-announcement" class="space-y-6" style="display: none;">
      
      <!-- 平台維護狀態指示燈卡片 -->
      <div id="platform-status-indicator" class="p-4 rounded-3xl border flex items-center justify-between bg-emerald-50 border-emerald-200 text-emerald-900">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="font-bold text-xs">目前平台狀態：<span id="platform-status-text">正常開放服務中</span></span>
        </div>
        <div id="platform-action-btn-box"></div>
      </div>

      <!-- 全域系統公告廣播控制區 -->
      <section class="bg-white p-6 rounded-3xl border border-brand-200 shadow-sm space-y-4">
        <div class="flex items-center justify-between border-b border-brand-100 pb-3">
          <h2 class="text-sm font-bold text-brand-900 flex items-center gap-1.5">
            <i class="fa-solid fa-bullhorn text-brand-500"></i>
            <span>全域跑馬燈系統公告發布</span>
          </h2>
          <span id="current-announcement-status" class="text-xs px-2.5 py-1 rounded-lg bg-gray-100 text-gray-600 font-bold">載入中...</span>
        </div>
        
        <div class="space-y-2">
          <label class="block text-xs font-bold text-brand-800">公告展示文字 (所有店家前台與後台頂部 15 秒內同步廣播)：</label>
          <textarea id="announcement-input" rows="3" class="w-full p-3 text-xs rounded-xl border border-brand-200 bg-brand-50/50 outline-none leading-relaxed focus:ring-2 focus:ring-brand-400" placeholder="輸入公告內容...（例如：系統將於今晚 02:00 進行資料庫優化維護）"></textarea>
        </div>

        <div class="flex gap-2 justify-end pt-1">
          <button onclick="clearAnnouncement()" class="px-4 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold rounded-xl transition">
            下架 / 清除公告
          </button>
          <button onclick="publishAnnouncement()" class="px-5 py-2.5 bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold rounded-xl shadow-sm transition flex items-center gap-1">
            <i class="fa-solid fa-paper-plane text-[10px]"></i> 發布公告
          </button>
        </div>

        <div class="text-[11px] text-brand-600 leading-relaxed bg-brand-50 p-3 rounded-2xl border border-brand-100 space-y-1">
          <div>💡 <b>營運控管說明：</b></div>
          <div>• <b>維護鎖定</b>：改由上方按鈕直接「一鍵啟動 / 一鍵解除」，避免勾選框造成反悔困難。啟動後全平台前台將立即彈出全螢幕施工遮罩，封鎖新預約建立。</div>
          <div>• <b>純跑馬公告</b>：填寫上方文字後點擊發布，前後台將出現淡黃色提醒條，不影響預約流程。</div>
        </div>
      </section>

      <!-- 店家許願池回報區 -->
      <section class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3">
        <div class="flex justify-between items-center border-b border-brand-100 pb-2">
          <h2 class="text-xs font-bold text-brand-900 flex items-center gap-1.5">
            <i class="fa-solid fa-lightbulb text-amber-500"></i>
            <span>店家功能許願池清單</span>
          </h2>
          <button onclick="loadWishes()" class="text-[11px] text-brand-500 hover:underline">重新整理</button>
        </div>
        <div id="wishes-container" class="space-y-2 text-xs">
          <div class="text-center py-4 text-brand-400">目前尚無許願紀錄</div>
        </div>
      </section>
    </div>

  </main>

  <script>
    const SUPABASE_URL = "https://kwbxskvnfejfguuwzqfr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_JnpaLZVnGkW9Jr967LeYuQ_d8bXwfnz";
    const API_URL = "https://script.google.com/macros/s/AKfycbxJlhG1eDEwuyjiJedTtvND-iwIzGXA3sfc_iN_Pq-15LIKWwlHGDX5tFRVdlOzfanONA/exec";
    const SUPER_KEY = "888";

    let allStores = [];
    let allStoresList = []; // 👈 補上宣告
    let currentFilter = 'ALL';
    let currentPage = 1;
    let storeCurrentPage = 1; // 👈 補上宣告
    const PAGE_SIZE = 10;
    const STORES_PER_PAGE = 10; // 👈 補上宣告
    let isPlatformMaintenanceActive = false;

    function checkSuperKey() {
      const inputEl = document.getElementById('super-key-input');
      const lockEl = document.getElementById('super-lock');
      if (!inputEl || !lockEl) return;

      const val = inputEl.value.trim();
      if (val === SUPER_KEY) {
        lockEl.style.display = 'none';
        loadInitialData();
      } else {
        // ✅ 修正：移除密碼明文，改為標準安全提示
        Swal.fire({
          title: '驗證失敗',
          text: '管理金鑰錯誤，請重新輸入',
          icon: 'error',
          confirmButtonColor: '#8C7355'
        });
        inputEl.value = '';
      }
    }

    function loadInitialData() {
      try {
        if (typeof loadStores === 'function') loadStores();
        if (typeof loadAnnouncement === 'function') loadAnnouncement();
        if (typeof loadWishes === 'function') loadWishes();
        if (typeof loadAllStores === 'function') loadAllStores();
      } catch (err) {
        console.warn("載入初始資料時發生非致命異常:", err);
      }
    }

    function switchSuperTab(tabId) {
      document.getElementById('super-page-stores').style.display = (tabId === 'stores') ? 'block' : 'none';
      document.getElementById('super-page-announcement').style.display = (tabId === 'announcement') ? 'block' : 'none';

      document.getElementById('tab-btn-stores').className = (tabId === 'stores')
        ? "px-4 py-2 rounded-2xl text-xs font-bold transition bg-brand-500 text-white shadow-xs"
        : "px-4 py-2 rounded-2xl text-xs font-bold transition bg-white text-brand-700 border border-brand-200";

      document.getElementById('tab-btn-announcement').className = (tabId === 'announcement')
        ? "px-4 py-2 rounded-2xl text-xs font-bold transition bg-brand-500 text-white shadow-xs"
        : "px-4 py-2 rounded-2xl text-xs font-bold transition bg-white text-brand-700 border border-brand-200";
    }

    async function loadStores() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/stores?order=created_at.desc`, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        allStores = await res.json();
        document.getElementById('store-count-badge').innerText = `共 ${allStores.length} 間店家`;
        
        renderExpiringAlertZone();
        currentPage = 1;
        renderStores();
      } catch(e) {
        console.error("載入店家失敗:", e);
      }
    }

    async function loadAllStores() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/stores?order=created_at.desc`, {
        headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
      });
      allStoresList = await res.json();
      document.getElementById('stores-total-count').innerText = `共 ${allStoresList.length} 家店`;
      renderExpiringAlertZone();
      renderStoresPagedTable();
    } catch(e) {}
  }
    
    // 7 天內到期或已過期警示專區
    function renderExpiringAlertZone() {
      const alertBox = document.getElementById('expiring-alert-container');
      if (!alertBox) return;

      const now = new Date();
      const sevenDaysLater = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);

      const expiringList = allStores.filter(s => {
        if (!s.expires_at) return false;
        const exp = new Date(s.expires_at);
        return exp <= sevenDaysLater;
      });

      if (expiringList.length === 0) {
        alertBox.innerHTML = '';
        return;
      }

      alertBox.innerHTML = `
        <div class="bg-rose-50 border border-rose-200 p-4 rounded-3xl space-y-2 mb-4 text-xs">
          <div class="flex justify-between items-center font-bold text-rose-950">
            <span class="flex items-center gap-1.5"><i class="fa-solid fa-triangle-exclamation text-rose-600"></i> 即將到期 / 欠費通知名單 (7 天內到期或已過期)</span>
            <span class="px-2.5 py-0.5 bg-rose-200 text-rose-900 rounded-full text-[10px] font-black">${expiringList.length} 家需關注</span>
          </div>
          <div class="divide-y divide-rose-200/60">
            ${expiringList.map(s => `
              <div class="py-2.5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                <div>
                  <span class="font-bold text-rose-950 text-sm">${s.store_name}</span>
                  <span class="text-[11px] text-rose-700 ml-2">到期日：${s.expires_at ? s.expires_at.split('T')[0] : '未知'}</span>
                  <span class="text-[11px] text-gray-500 ml-2">(${s.owner_email || '無 Email'})</span>
                </div>
                <button onclick="sendZeroCostEmailNotice('${s.id}', '${s.store_name}', '${s.owner_email}')" class="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold text-[11px] transition shadow-xs flex items-center gap-1">
                  <i class="fa-solid fa-envelope text-[10px]"></i> 零費用發信催繳 (不扣 LINE 額度)
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function filterStores(status, btn) {
      currentFilter = status;
      currentPage = 1;
      document.querySelectorAll('.store-filter-btn').forEach(b => {
        b.className = "store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-brand-800 border border-brand-200 whitespace-nowrap";
      });
      btn.className = "store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-brand-500 text-white shadow-xs whitespace-nowrap";
      renderStores();
    }

    function renderStores() {
      const kw = (document.getElementById('store-search-kw')?.value || '').trim().toLowerCase();
      const container = document.getElementById('stores-container');
      
      let filtered = (currentFilter === 'ALL') ? allStores : allStores.filter(s => s.plan_status === currentFilter);

      if (kw) {
        filtered = filtered.filter(s => 
          (s.store_name || '').toLowerCase().includes(kw) ||
          (s.owner_phone || '').includes(kw) ||
          (s.owner_email || '').toLowerCase().includes(kw) ||
          (s.owner_line_name || '').toLowerCase().includes(kw) ||
          (s.owner_line_uid || '').includes(kw) ||
          (s.id || '').includes(kw)
        );
      }

      const totalItems = filtered.length;
      const totalPages = Math.ceil(totalItems / PAGE_SIZE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const endIndex = Math.min(startIndex + PAGE_SIZE, totalItems);
      const pageStores = filtered.slice(startIndex, endIndex);

      document.getElementById('page-info-text').innerText = totalItems > 0 
        ? `顯示第 ${startIndex + 1} - ${endIndex} 家（共 ${totalItems} 家）` 
        : `查無店家資料`;

      renderPagination(totalPages);

      if (pageStores.length === 0) {
        container.innerHTML = '<div class="text-center text-xs text-brand-400 py-8 bg-white rounded-3xl border border-brand-200">查無相符的店家紀錄</div>';
        return;
      }

      container.innerHTML = pageStores.map(s => {
        const isActive = (s.plan_status === 'active');
        const isLocked = (s.plan_status === 'locked');
        const isExpired = (s.plan_status === 'expired');

        let statusBadge = '<span class="px-2.5 py-0.5 bg-amber-100 text-amber-800 rounded-full text-[10px] font-bold">下單未付款</span>';
        if (isActive) statusBadge = '<span class="px-2.5 py-0.5 bg-green-100 text-green-800 rounded-full text-[10px] font-bold">已開通 (運行中)</span>';
        if (isLocked) statusBadge = '<span class="px-2.5 py-0.5 bg-gray-200 text-gray-800 rounded-full text-[10px] font-bold">🔒 已鎖定 (前後台封鎖)</span>';
        if (isExpired) statusBadge = '<span class="px-2.5 py-0.5 bg-red-100 text-red-800 rounded-full text-[10px] font-bold">已過期停權</span>';

        const adminToken = s.admin_token || s.id;
        const adminUrl = `https://salon.heysibyl.com/admin.html?token=${adminToken}`;
        const storeSlug = s.slug || '';
        // ✅ 保證任何靜態伺服器皆能開啟的標準前台網址
        const bookingUrl = `https://salon.heysibyl.com/?store_id=${s.id}`;
        const prettyUrl = storeSlug ? `https://salon.heysibyl.com/?s=${encodeURIComponent(storeSlug)}` : bookingUrl;
        // 專屬店家 LINE UID 快速綁定連結 (傳給業主，一鍵綁定)
        const lineBindUrl = `https://salon.heysibyl.com/admin.html?token=${adminToken}&bind_line=true`;

        const hasLineUid = Boolean(s.owner_line_uid && s.owner_line_uid.startsWith('U'));
        const lineUidBadge = hasLineUid 
          ? `<span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded text-[10px] font-bold">✓ 已綁定</span> <code class="text-[10px] text-gray-500">${s.owner_line_uid.substring(0, 8)}...</code>` 
          : `<span class="px-2 py-0.5 bg-rose-100 text-rose-700 rounded text-[10px] font-bold">未綁定</span>`;

        const lockBtnHtml = isLocked
          ? `<button onclick="toggleStoreLock('${s.id}', 'locked', '${s.store_name}')" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold transition text-xs flex items-center gap-1 shadow-xs">
               <i class="fa-solid fa-lock-open text-[10px]"></i> 解除鎖定
             </button>`
          : `<button onclick="toggleStoreLock('${s.id}', 'active', '${s.store_name}')" class="px-2.5 py-1.5 bg-slate-600 hover:bg-slate-700 text-white rounded-xl font-bold transition text-xs flex items-center gap-1 shadow-xs">
               <i class="fa-solid fa-lock text-[10px]"></i> 暫時鎖定 (含後台)
             </button>`;

        return `
          <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3 text-xs">
            <div class="flex justify-between items-start">
              <div>
                <div class="font-bold text-sm text-brand-900 flex items-center gap-2">
                  <span>${s.store_name}</span>
                  ${statusBadge}
                </div>
                <div class="text-[11px] text-brand-400 mt-0.5 font-mono flex items-center gap-2">
                  <span>ID: ${s.id}</span>
                  <button onclick="navigator.clipboard.writeText('${adminUrl}'); Swal.fire('已複製後台連結！', '', 'success')" class="text-blue-600 hover:underline">複製後台連結</button>
                </div>
              </div>
              <div class="text-right">
                <span class="font-bold text-brand-500">${s.plan_name || '標準版'}</span>
                <div class="text-[10px] text-gray-400">到期日：${s.expires_at ? s.expires_at.split('T')[0] : '無期限'}</div>
              </div>
            </div>

            <div class="p-3 bg-brand-50 rounded-2xl border border-brand-100 grid grid-cols-1 md:grid-cols-2 gap-2 text-[11px]">
              <div class="flex items-center gap-1">

    async function manualActivateStore(storeId, days) {
  Swal.fire({ title: '正在開通帳號...', allowOutsideClick: false });
  Swal.showLoading();

  const baseDate = new Date();
  baseDate.setDate(baseDate.getDate() + Number(days));

  try {
    // 1. 直寫 Supabase (確保狀態立刻生效)
    const patchRes = await fetch(`${SUPABASE_URL}/rest/v1/stores?id=eq.${storeId}`, {
      method: "PATCH",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        plan_status: "active",
        expires_at: baseDate.toISOString()
      })
    });

    if (!patchRes.ok) throw new Error("資料庫更新失敗");

    // 2. 呼叫 GAS 寄發開通信 (使用 no-cors 杜絕 fetch 報錯)
    fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action: "saRenewStore", targetStoreId: storeId, days: days, secret: SUPER_KEY })
    }).catch(() => {});

    Swal.fire({ 
      title: '店家已成功開通！', 
      text: `已開通為 active，到期日展延至 ${baseDate.toISOString().split('T')[0]}`, 
      icon: 'success' 
    });
    loadStores();
  } catch(e) {
    Swal.fire('開通失敗', e.message, 'error');
  }
}

    // 載入全域公告與當前維護鎖定狀態
    async function loadAnnouncement() {
      const statusEl = document.getElementById('current-announcement-status');
      const indText = document.getElementById('platform-status-text');
      const indBox = document.getElementById('platform-status-indicator');
      const indBtn = document.getElementById('platform-action-btn-box');

          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const data = await res.json();
        
        if (Array.isArray(data) && data.length > 0 && data[0].is_active) {
          isPlatformMaintenanceActive = Boolean(data[0].is_maintenance);
          
          if (isPlatformMaintenanceActive) {
            indBox.className = "p-4 rounded-3xl border flex items-center justify-between bg-rose-50 border-rose-200 text-rose-950";
            indText.innerHTML = `<span class="font-black text-rose-700">🔒 全平台例行維護鎖定中 (禁止顧客下單)</span>`;
            indBtn.innerHTML = `
              <button onclick="togglePlatformMaintenance(false)" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs shadow-xs transition flex items-center gap-1">
                <i class="fa-solid fa-lock-open text-[11px]"></i> 解除全平台鎖定
              </button>
            `;
            statusEl.innerHTML = `<span class="text-rose-600 font-bold"><i class="fa-solid fa-lock"></i> [維護鎖定中]</span>`;
          } else {
            indBox.className = "p-4 rounded-3xl border flex items-center justify-between bg-emerald-50 border-emerald-200 text-emerald-950";
            indText.innerHTML = `<span class="font-bold text-emerald-700">正常營運中 (公告廣播生效中)</span>`;
            indBtn.innerHTML = `
              <button onclick="togglePlatformMaintenance(true)" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold text-xs shadow-xs transition flex items-center gap-1">
                <i class="fa-solid fa-triangle-exclamation text-[11px]"></i> 啟動全平台維護鎖定

            `;
            statusEl.innerHTML = `<span class="text-emerald-600 font-bold"><i class="fa-solid fa-circle-check"></i> [跑馬公告展示中]</span>`;
          }
          document.getElementById('announcement-input').value = data[0].content || '';
        } else {
          isPlatformMaintenanceActive = false;
          indBox.className = "p-4 rounded-3xl border flex items-center justify-between bg-emerald-50 border-emerald-200 text-emerald-950";
          indText.innerHTML = `<span class="font-bold text-emerald-700">正常營運中 (無鎖定)</span>`;
          indBtn.innerHTML = `
            <button onclick="togglePlatformMaintenance(true)" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold text-xs shadow-xs transition flex items-center gap-1">
              <i class="fa-solid fa-triangle-exclamation text-[11px]"></i> 啟動全平台維護鎖定

    // 全平台鎖定按鈕切換（徹底擺脫勾選框反悔困難）
    async function togglePlatformMaintenance(targetLockState) {
      const actionText = targetLockState ? '啟動全平台維護鎖定' : '解除全平台鎖定';
      const confirm = await Swal.fire({
        title: `確定${actionText}？`,
        text: targetLockState 
          ? '所有店家前台將於 15 秒內強制彈出全螢幕「升級維護中」施工遮罩，封鎖預約下單！' 
          : '全平台店家前台將於 15 秒內解除遮罩，恢復正常預約填單。',
        icon: targetLockState ? 'warning' : 'info',
        showCancelButton: true,
        confirmButtonText: `確定${actionText}`,
        confirmButtonColor: targetLockState ? '#d33' : '#8C7355',
        cancelButtonText: '取消'
      });

      if (!confirm.isConfirmed) return;
      Swal.showLoading();

      try {
        // 先將所有舊公告設為失效
        await fetch(`${SUPABASE_URL}/rest/v1/system_announcements?is_active=eq.true`, {
          method: "PATCH",
          headers: { 
            "apikey": SUPABASE_ANON_KEY, 
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, 
            "Content-Type": "application/json" 
          },
          body: JSON.stringify({ is_active: false })
        });

        if (targetLockState) {
          // 寫入維護鎖定紀錄
          await fetch(`${SUPABASE_URL}/rest/v1/system_announcements`, {
            method: "POST",
            headers: { 
              "apikey": SUPABASE_ANON_KEY, 
              "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, 
              "Content-Type": "application/json",
              "Prefer": "return=representation"
            },
            body: JSON.stringify({
              title: "全平台維護升級中",
              content: "系統目前正進行例行伺服器升級與維護施工，施工期間暫停在線預約，造成不便敬請見諒。",
              is_active: true,
              is_maintenance: true
            })
          });
        }

        Swal.fire('狀態更新成功！', `已${actionText}，全系統將於 15 秒內完成即時同步。`, 'success');
        loadAnnouncement();
      } catch (err) {
        Swal.fire('操作失敗', err.message, 'error');
      }
    }

    // 發布常規跑馬公告
    async function publishAnnouncement() {
      const text = document.getElementById('announcement-input').value.trim();
      if (!text) return Swal.fire('請輸入公告文字', '若要清除公告，請點選「下架 / 清除公告」按鈕', 'warning');

      Swal.showLoading();
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/system_announcements?is_active=eq.true`, {
          method: "PATCH",
          headers: { 
            "apikey": SUPABASE_ANON_KEY, 
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, 
            "Content-Type": "application/json" 
          },
          body: JSON.stringify({ is_active: false })
        });

        const res = await fetch(`${SUPABASE_URL}/rest/v1/system_announcements`, {
          method: "POST",
          headers: { 
            "apikey": SUPABASE_ANON_KEY, 
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, 
            "Content-Type": "application/json",
            "Prefer": "return=representation"
          },
          body: JSON.stringify({ 
            title: "系統公告", 
            content: text, 
            is_active: true, 
            is_maintenance: false 
          })
        });

        if (!res.ok) throw new Error("發布失敗");

        Swal.fire('公告發布成功！', '所有店家前台與管理後台將於 15 秒內同步呈現。', 'success');
        loadAnnouncement();
      } catch (err) {
        Swal.fire('發布失敗', err.message, 'error');
      }
    }

    // 下架所有公告與維護鎖定
    async function clearAnnouncement() {
      Swal.fire({ title: '正在下架公告...', allowOutsideClick: false });
      Swal.showLoading();

      try {
        await fetch(`${SUPABASE_URL}/rest/v1/system_announcements?is_active=eq.true`, {
          method: "PATCH",
          headers: { 
            "apikey": SUPABASE_ANON_KEY, 
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, 
            "Content-Type": "application/json" 
          },
          body: JSON.stringify({ is_active: false, is_maintenance: false })
        });

        document.getElementById('announcement-input').value = '';
        Swal.fire('已成功下架！', '前後台公告橫幅已完全清除隱藏。', 'success');
        loadAnnouncement();
      } catch (err) {
        Swal.fire('下架失敗', err.message, 'error');
      }
    }

    // 許願池讀取與刪除
    async function loadWishes() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/feature_wishes?order=created_at.desc&limit=30`, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const wishes = await res.json();
        const container = document.getElementById('wishes-container');
        if (!wishes || wishes.length === 0) {
          container.innerHTML = '<div class="text-center py-4 text-brand-400">目前尚無許願回報</div>';
          return;
        }
        container.innerHTML = wishes.map(w => `
          <div class="p-3.5 bg-brand-50 rounded-2xl border border-brand-200 flex justify-between items-start gap-3">
            <div class="space-y-1 flex-1">
              <div class="flex items-center gap-2 font-bold text-brand-900">
                <span>🏪 ${w.store_name || '店家'}</span>
                <span class="text-[10px] text-brand-500 font-normal">${w.created_at ? w.created_at.split('T')[0] : ''}</span>
              </div>
              <p class="text-brand-700 leading-relaxed">${w.content}</p>
            </div>
            <button onclick="deleteWishPrompt('${w.id}')" class="px-2.5 py-1 bg-red-100 hover:bg-red-200 text-red-600 rounded-lg text-xs font-bold transition shrink-0">
              <i class="fa-solid fa-trash text-[10px]"></i> 刪除
            </button>
          </div>
        `).join('');
      } catch(e){}
    }

    function deleteWishPrompt(id) {
      Swal.fire({
        title: '確定刪除此則許願？',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        confirmButtonText: '確定刪除',
        cancelButtonText: '取消'
      }).then(async r => {
        if (r.isConfirmed) {
          await fetch(`${SUPABASE_URL}/rest/v1/feature_wishes?id=eq.${id}`, {
            method: "DELETE",
            headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
          });
          Swal.fire({ title: '已刪除！', icon: 'success', timer: 1000, showConfirmButton: false });
          loadWishes();
        }
      });
    }
  </script>
</body>
</html>

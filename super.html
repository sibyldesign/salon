<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sibyl SaaS 總管中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FAF6F0', 100: '#EFE6DC', 200: '#DFD1C0', 300: '#CBB8A1',
              400: '#A68A68', 500: '#8C7355', 600: '#755F46', 700: '#5E4C38',
              800: '#4A3B2C', 900: '#33271C',
            }
          },
          fontFamily: { sans: ['Noto Sans TC', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-50 text-brand-900 antialiased pb-20">

  <!-- 登入鎖定層 (預設空白，密碼 888) -->
  <div id="super-lock" class="fixed inset-0 bg-brand-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-3xl shadow-sm border border-brand-200 text-center w-full max-w-xs space-y-4">
      <div class="w-12 h-12 mx-auto bg-brand-100 rounded-2xl flex items-center justify-center text-brand-600 text-xl">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-brand-900">Sibyl SaaS 總管系統</h1>
        <p class="text-xs text-brand-400 mt-0.5">請輸入管理金鑰</p>
      </div>
      <input type="password" id="super-key-input" class="w-full text-center text-xl tracking-[0.2em] py-2.5 rounded-xl border border-brand-200 focus:ring-2 focus:ring-brand-400 outline-none" placeholder="管理密碼" maxlength="10">
      <button onclick="checkSuperKey()" class="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-xl shadow-md transition text-xs">驗證進入</button>
    </div>
  </div>

  <header class="bg-white border-b border-brand-200 px-4 py-3 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="w-7 h-7 bg-brand-500 text-white rounded-lg flex items-center justify-center text-xs shadow-sm">
          <i class="fa-solid fa-crown"></i>
        </span>
        <span class="font-bold text-sm text-brand-900">Sibyl 數位管家 | 租戶營運總控台</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="loadInitialData()" class="p-2 text-brand-500 hover:bg-brand-50 rounded-xl transition" title="重新整理">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <button onclick="location.reload()" class="p-2 text-brand-400 hover:bg-brand-50 rounded-xl transition" title="登出">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 總控台頂部切換導覽標籤 -->
  <div class="max-w-4xl mx-auto px-4 pt-4">
    <div class="flex gap-2 border-b border-brand-200 pb-2">
      <button id="tab-btn-stores" onclick="switchSuperTab('stores')" class="px-4 py-2 rounded-2xl text-xs font-bold transition bg-brand-500 text-white shadow-xs">
        <i class="fa-solid fa-store mr-1"></i> 全租戶店家名冊與開通狀態
      </button>
      <button id="tab-btn-announcement" onclick="switchSuperTab('announcement')" class="px-4 py-2 rounded-2xl text-xs font-bold transition bg-white text-brand-700 border border-brand-200">
        <i class="fa-solid fa-bullhorn mr-1"></i> 全平台即時公告、維護鎖定與許願池
      </button>
    </div>
  </div>

  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- 分頁 1：全租戶店家名冊 (每頁 10 間、含頁碼切換與 LINE 資訊) -->
    <div id="super-page-stores" class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold text-brand-900 flex items-center gap-1.5">
          <i class="fa-solid fa-users-rectangle text-brand-500"></i>
          <span>全租戶店家名冊</span>
        </h2>
        <span id="store-count-badge" class="text-xs px-2.5 py-0.5 bg-brand-100 text-brand-800 rounded-full font-bold">載入中...</span>
      </div>

      <!-- 快速搜尋與狀態篩選列 -->
      <div class="flex flex-col sm:flex-row gap-2 justify-between">
        <div class="flex gap-2 overflow-x-auto pb-1">
          <button onclick="filterStores('ALL', this)" class="store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-brand-500 text-white shadow-xs whitespace-nowrap">全部店家</button>
          <button onclick="filterStores('pending', this)" class="store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-brand-800 border border-brand-200 whitespace-nowrap">待開通 (未付款)</button>
          <button onclick="filterStores('active', this)" class="store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-brand-800 border border-brand-200 whitespace-nowrap">運行中 (已開通)</button>
          <button onclick="filterStores('locked', this)" class="store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-brand-800 border border-brand-200 whitespace-nowrap">已鎖定</button>
          <button onclick="filterStores('expired', this)" class="store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-brand-800 border border-brand-200 whitespace-nowrap">已過期</button>
        </div>
        <div class="relative w-full sm:w-60">
          <input type="text" id="store-search-kw" oninput="currentPage = 1; renderStores();" placeholder="🔍 搜尋店名/電話/LINE/Email..." class="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl border border-brand-200 bg-white outline-none focus:ring-1 focus:ring-brand-400">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-brand-400 text-xs"></i>
        </div>
      </div>
      
      <!-- 店家卡片渲染清單 -->
      <div id="stores-container" class="space-y-3"></div>

      <!-- 分頁頁碼控制列 (每頁 10 家) -->
      <div id="pagination-controls" class="flex items-center justify-between bg-white p-3.5 rounded-2xl border border-brand-200 text-xs">
        <div class="text-brand-500 text-[11px]" id="page-info-text">顯示第 1 - 10 家</div>
        <div class="flex gap-1.5 items-center" id="page-buttons-container"></div>
      </div>
    </div>

    <!-- 分頁 2：全平台即時公告、維護鎖定與功能許願池 (核心唯一發布區塊) -->
    <div id="super-page-announcement" class="space-y-6" style="display: none;">
      
      <!-- 全域公告與維護鎖定發布控制台 -->
      <section class="bg-white p-6 rounded-3xl border border-brand-200 shadow-sm space-y-4">
        <div class="flex items-center justify-between border-b border-brand-100 pb-3">
          <h2 class="text-sm font-bold text-brand-900 flex items-center gap-1.5">
            <i class="fa-solid fa-bullhorn text-brand-500"></i>
            <span>發布全域系統公告 / 例行維護鎖定</span>
          </h2>
          <span id="current-announcement-status" class="text-xs px-2.5 py-1 rounded-lg bg-gray-100 text-gray-600 font-bold">載入狀態中...</span>
        </div>
        
        <div class="space-y-2">
          <label class="block text-xs font-bold text-brand-800">公告展示文字 (前後台頂部跑馬燈連動)：</label>
          <textarea id="announcement-input" rows="3" class="w-full p-3 text-xs rounded-xl border border-brand-200 bg-brand-50/50 outline-none leading-relaxed focus:ring-2 focus:ring-brand-400" placeholder="輸入要廣播給全系統前台與後台的公告內容...（留空發布代表下架關閉）"></textarea>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between pt-1">
          <label class="flex items-center gap-2 text-xs font-bold text-rose-600 cursor-pointer select-none bg-rose-50 px-3 py-2 rounded-xl border border-rose-200">
            <input type="checkbox" id="announcement-is-maintenance" class="accent-rose-600 rounded">
            <span>啟動「全平台例行升級維護遮罩」（強制鎖定全前台，禁止顧客預約下單）</span>
          </label>
          <div class="flex gap-2 w-full sm:w-auto shrink-0">
            <button onclick="publishAnnouncement()" class="flex-1 sm:flex-none px-5 py-2.5 bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold rounded-xl shadow-sm transition">
              <i class="fa-solid fa-paper-plane mr-1"></i> 發布公告
            </button>
            <button onclick="clearAnnouncement()" class="px-4 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold rounded-xl transition">
              下架 / 清除
            </button>
          </div>
        </div>

        <div class="text-[11px] text-brand-600 leading-relaxed bg-brand-50 p-3 rounded-2xl border border-brand-100">
          💡 <b>運作機制說明：</b><br>
          • <b>一般公告</b>：發布後，所有店家前台及管理後台頂部會即時常駐顯示黃色公告橫幅。<br>
          • <b>維護鎖定</b>：勾選維護鎖定後發布，所有店家前台會立即彈出全螢幕「系統升級施工中」遮罩，禁止任何填單。<br>
          • <b>下架清除</b>：點選「下架/清除」後，系統公告標記為失效，前台與後台黃色公告橫幅將<b>自動完全隱藏不留白</b>。
        </div>
      </section>

      <!-- 店家功能許願池接收區 -->
      <section class="bg-white p-5 rounded-3xl border border-brand-200 shadow-sm space-y-3">
        <div class="flex justify-between items-center border-b border-brand-100 pb-2">
          <h2 class="text-xs font-bold text-brand-900 flex items-center gap-1.5">
            <i class="fa-solid fa-lightbulb text-amber-500"></i>
            <span>店家功能許願池清單</span>
          </h2>
          <button onclick="loadWishes()" class="text-[11px] text-brand-500 hover:underline">重新讀取</button>
        </div>
        <div id="wishes-container" class="space-y-2 text-xs">
          <div class="text-center py-4 text-brand-400">目前尚無許願回報</div>
        </div>
      </section>
    </div>

  </main>

  <script>
    const SUPABASE_URL = "https://kwbxskvnfejfguuwzqfr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_JnpaLZVnGkW9Jr967LeYuQ_d8bXwfnz";
    const API_URL = "https://script.google.com/macros/s/AKfycbxJlhG1eDEwuyjiJedTtvND-iwIzGXA3sfc_iN_Pq-15LIKWwlHGDX5tFRVdlOzfanONA/exec";
    const SUPER_KEY = "888";

    let allStores = [];
    let currentFilter = 'ALL';
    let currentPage = 1;
    const PAGE_SIZE = 10;

    function checkSuperKey() {
      const val = document.getElementById('super-key-input').value.trim();
      if (val === SUPER_KEY) {
        document.getElementById('super-lock').style.display = 'none';
        loadInitialData();
      } else {
        Swal.fire('金鑰錯誤', '管理密碼為 888', 'error');
        document.getElementById('super-key-input').value = '';
      }
    }

    function loadInitialData() {
      loadStores();
      loadAnnouncement();
      loadWishes();
    }

    function switchSuperTab(tabId) {
      document.getElementById('super-page-stores').style.display = (tabId === 'stores') ? 'block' : 'none';
      document.getElementById('super-page-announcement').style.display = (tabId === 'announcement') ? 'block' : 'none';

      document.getElementById('tab-btn-stores').className = (tabId === 'stores')
        ? "px-4 py-2 rounded-2xl text-xs font-bold transition bg-brand-500 text-white shadow-xs"
        : "px-4 py-2 rounded-2xl text-xs font-bold transition bg-white text-brand-700 border border-brand-200";

      document.getElementById('tab-btn-announcement').className = (tabId === 'announcement')
        ? "px-4 py-2 rounded-2xl text-xs font-bold transition bg-brand-500 text-white shadow-xs"
        : "px-4 py-2 rounded-2xl text-xs font-bold transition bg-white text-brand-700 border border-brand-200";
    }

    async function loadStores() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/stores?order=created_at.desc`, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        allStores = await res.json();
        document.getElementById('store-count-badge').innerText = `共 ${allStores.length} 間店家`;
        currentPage = 1;
        renderStores();
      } catch(e) {
        console.error("載入店家失敗:", e);
      }
    }

    function filterStores(status, btn) {
      currentFilter = status;
      currentPage = 1;
      document.querySelectorAll('.store-filter-btn').forEach(b => {
        b.className = "store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-brand-800 border border-brand-200 whitespace-nowrap";
      });
      btn.className = "store-filter-btn px-3 py-1 rounded-xl text-xs font-bold bg-brand-500 text-white shadow-xs whitespace-nowrap";
      renderStores();
    }

    function renderStores() {
      const kw = (document.getElementById('store-search-kw')?.value || '').trim().toLowerCase();
      const container = document.getElementById('stores-container');
      
      let filtered = (currentFilter === 'ALL') ? allStores : allStores.filter(s => s.plan_status === currentFilter);

      if (kw) {
        filtered = filtered.filter(s => 
          (s.store_name || '').toLowerCase().includes(kw) ||
          (s.owner_phone || '').includes(kw) ||
          (s.owner_email || '').toLowerCase().includes(kw) ||
          (s.owner_line_name || '').toLowerCase().includes(kw) ||
          (s.owner_line_uid || '').includes(kw) ||
          (s.id || '').includes(kw)
        );
      }

      const totalItems = filtered.length;
      const totalPages = Math.ceil(totalItems / PAGE_SIZE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const endIndex = Math.min(startIndex + PAGE_SIZE, totalItems);
      const pageStores = filtered.slice(startIndex, endIndex);

      document.getElementById('page-info-text').innerText = totalItems > 0 
        ? `顯示第 ${startIndex + 1} - ${endIndex} 家（共 ${totalItems} 家）` 
        : `查無店家資料`;

      renderPagination(totalPages);

      if (pageStores.length === 0) {
        container.innerHTML = '<div class="text-center text-xs text-brand-400 py-8 bg-white rounded-3xl border border-brand-200">查無相符的店家紀錄</div>';
        return;
      }

      container.innerHTML = pageStores.map(s => {
        const isPending = (s.plan_status === 'pending');
        const isActive = (s.plan_status === 'active');
        const isLocked = (s.plan_status === 'locked');
        const isExpired = (s.plan_status === 'expired');

        let statusBadge = '<span class="px-2.5 py-0.5 bg-amber-100 text-amber-800 rounded-full text-[10px] font-bold">下單未付款</span>';
        if (isActive) statusBadge = '<span class="px-2.5 py-0.5 bg-green-100 text-green-800 rounded-full text-[10px] font-bold">已開通 (運行中)</span>';
        if (isLocked) statusBadge = '<span class="px-2.5 py-0.5 bg-gray-200 text-gray-800 rounded-full text-[10px] font-bold">🔒 已手動鎖定</span>';
        if (isExpired) statusBadge = '<span class="px-2.5 py-0.5 bg-red-100 text-red-800 rounded-full text-[10px] font-bold">已過期停權</span>';

        const adminToken = s.admin_token || s.id;
        const adminUrl = `https://salon.heysibyl.com/admin.html?token=${adminToken}`;
        const bookingUrl = `https://salon.heysibyl.com/?store_id=${s.id}`;

        const lockBtnHtml = isLocked
          ? `<button onclick="toggleStoreLock('${s.id}', false, '${s.store_name}')" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold transition text-xs flex items-center gap-1 shadow-xs">
               <i class="fa-solid fa-lock-open text-[10px]"></i> 解除鎖定
             </button>`
          : `<button onclick="toggleStoreLock('${s.id}', true, '${s.store_name}')" class="px-2.5 py-1.5 bg-slate-600 hover:bg-slate-700 text-white rounded-xl font-bold transition text-xs flex items-center gap-1 shadow-xs">
               <i class="fa-solid fa-lock text-[10px]"></i> 暫時鎖定
             </button>`;

        return `
          <div class="bg-white p-4 rounded-3xl border border-brand-200 shadow-sm space-y-3 text-xs">
            <div class="flex justify-between items-start">
              <div>
                <div class="font-bold text-sm text-brand-900 flex items-center gap-2">
                  <span>${s.store_name}</span>
                  ${statusBadge}
                </div>
                <div class="text-[11px] text-brand-400 mt-0.5 font-mono flex items-center gap-2">
                  <span>ID: ${s.id}</span>
                  <button onclick="navigator.clipboard.writeText('${adminUrl}'); Swal.fire('已複製專屬後台 Token 網址！', '', 'success')" class="text-blue-600 hover:underline">複製後台連結</button>
                </div>
              </div>
              <div class="text-right">
                <span class="font-bold text-brand-500">${s.plan_name || '標準版'}</span>
                <div class="text-[10px] text-gray-400">到期日：${s.expires_at ? s.expires_at.split('T')[0] : '無期限'}</div>
              </div>
            </div>

            <div class="p-3 bg-brand-50 rounded-2xl border border-brand-100 grid grid-cols-1 md:grid-cols-2 gap-2 text-[11px]">
              <div><b>負責人手機：</b><a href="tel:${s.owner_phone}" class="text-blue-600 underline">${s.owner_phone || '無'}</a></div>
              <div><b>電子信箱：</b>${s.owner_email || '無'}</div>
              <div><b>LINE 稱呼：</b><span class="font-bold text-brand-900">${s.owner_line_name || '未填'}</span></div>
              <div><b>LINE UID：</b><code class="text-blue-600 font-bold">${s.owner_line_uid || '未綁定'}</code></div>
              <div><b>後台密碼：</b><code>${s.admin_pin || '8888'}</code></div>
              <div><b>建立時間：</b>${s.created_at ? s.created_at.replace('T', ' ').substring(0, 16) : '未知'}</div>
            </div>

            <div class="flex gap-2 flex-wrap items-center justify-between pt-1 border-t border-brand-100">
              <button onclick="copyDunText('${s.store_name}', '${s.owner_line_name || '負責人'}')" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold shadow-xs">
                📋 複製催繳帳單文案
              </button>
              <div class="flex gap-1.5 flex-wrap items-center">
                <a href="${adminUrl}" target="_blank" class="px-3 py-1.5 bg-brand-100 hover:bg-brand-200 text-brand-800 rounded-xl font-bold transition inline-flex items-center gap-1">
                  <i class="fa-solid fa-key text-[10px]"></i> 後台
                </a>
                <a href="${bookingUrl}" target="_blank" class="px-3 py-1.5 bg-brand-100 hover:bg-brand-200 text-brand-800 rounded-xl font-bold transition inline-flex items-center gap-1">
                  <i class="fa-solid fa-mobile-screen text-[10px]"></i> 前台
                </a>
                ${lockBtnHtml}
                <button onclick="manualActivateStore('${s.id}', 30)" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-xs transition">
                  +30天
                </button>
                <button onclick="manualActivateStore('${s.id}', 365)" class="px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold shadow-xs transition">
                  +1年
                </button>
                <button onclick="deleteStorePrompt('${s.id}', '${s.store_name}')" class="px-2.5 py-1.5 bg-red-100 hover:bg-red-200 text-red-600 rounded-xl font-bold transition">
                  刪除
                </button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function renderPagination(totalPages) {
      const container = document.getElementById('page-buttons-container');
      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }
      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        html += `
          <button onclick="changePage(${i})" class="w-7 h-7 rounded-lg text-xs font-bold transition ${i === currentPage ? 'bg-brand-500 text-white' : 'bg-brand-100 text-brand-800 hover:bg-brand-200'}">
            ${i}
          </button>
        `;
      }
      container.innerHTML = html;
    }

    function changePage(page) {
      currentPage = page;
      renderStores();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function copyDunText(storeName, ownerName) {
      const txt = `親愛的 ${storeName} ${ownerName} 您好：\n提醒您，您在 Sibyl 數位管家的預約排程系統方案即將到期。\n為避免前台預約與推播中斷，請點選以下安全金流連結完成續約：\nhttps://api.payuni.com.tw/api/period/U072882813/T0xg8NuIJJZ\n完成後系統將自動延長使用權限，謝謝您！`;
      navigator.clipboard.writeText(txt).then(() => {
        Swal.fire({ title: '催繳帳單文案已複製！', icon: 'success', timer: 1500, showConfirmButton: false });
      });
    }

    async function toggleStoreLock(storeId, toLock, storeName) {
      const actionText = toLock ? "暫時鎖定" : "解除鎖定";
      const newStatus = toLock ? "locked" : "active";

      Swal.fire({
        title: `確定要${actionText}【${storeName}】？`,
        text: toLock ? "鎖定後該店家的前台預約與管理後台將立即暫停運作！" : "解鎖後店家將恢復正常營運狀態。",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: toLock ? '#475569' : '#16A34A',
        confirmButtonText: `確定${actionText}`,
        cancelButtonText: '取消'
      }).then(async r => {
        if (r.isConfirmed) {
          try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/stores?id=eq.${storeId}`, {
              method: "PATCH",
              headers: {
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ plan_status: newStatus })
            });
            if (!res.ok) throw new Error("更新資料庫失敗");
            Swal.fire({ title: `已成功${actionText}！`, icon: 'success', timer: 1200, showConfirmButton: false });
            loadStores();
          } catch (e) {
            Swal.fire('操作失敗', e.message, 'error');
          }
        }
      });
    }

    async function manualActivateStore(storeId, days) {
      Swal.fire({ title: '正在開通帳號...', allowOutsideClick: false });
      Swal.showLoading();

      const baseDate = new Date();
      baseDate.setDate(baseDate.getDate() + Number(days));

      try {
        const patchRes = await fetch(`${SUPABASE_URL}/rest/v1/stores?id=eq.${storeId}`, {
          method: "PATCH",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
          },
          body: JSON.stringify({
            plan_status: "active",
            expires_at: baseDate.toISOString()
          })
        });

        if (!patchRes.ok) throw new Error("資料庫更新失敗");

        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "saRenewStore", targetStoreId: storeId, days: days, secret: SUPER_KEY })
        });

        Swal.fire({ 
          title: '店家已成功開通！', 
          text: `狀態已轉為 active，到期日延長至 ${baseDate.toISOString().split('T')[0]}`, 
          icon: 'success' 
        });
        loadStores();
      } catch(e) {
        Swal.fire('開通失敗', e.message, 'error');
      }
    }

    function deleteStorePrompt(storeId, name) {
      Swal.fire({
        title: `確定永久刪除【${name}】？`,
        text: '刪除後該店所有服務項目、作品、預約紀錄將連帶清除且無法復原！',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        confirmButtonText: '確定刪除',
        cancelButtonText: '取消'
      }).then(async r => {
        if (r.isConfirmed) {
          await fetch(`${SUPABASE_URL}/rest/v1/stores?id=eq.${storeId}`, {
            method: "DELETE",
            headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
          });
          Swal.fire('已成功刪除', '', 'success');
          loadStores();
        }
      });
    }

    // =========================================================================
    // ✨ 全域公告與例行維護鎖定發布核心 (精確寫入 system_announcements 表)
    // =========================================================================
    async function loadAnnouncement() {
      const statusEl = document.getElementById('current-announcement-status');
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/system_announcements?is_active=eq.true&order=created_at.desc&limit=1`, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0 && data[0].content) {
          const isMaint = (data[0].is_maintenance === true);
          statusEl.innerHTML = isMaint 
            ? `<span class="text-rose-600 font-bold"><i class="fa-solid fa-lock"></i> [維護鎖定中]</span>`
            : `<span class="text-emerald-600 font-bold"><i class="fa-solid fa-circle-check"></i> [公告展示中]</span>`;
          document.getElementById('announcement-input').value = data[0].content;
          document.getElementById('announcement-is-maintenance').checked = isMaint;
        } else {
          statusEl.innerHTML = `<span class="text-gray-400">目前無生效中公告</span>`;
          document.getElementById('announcement-input').value = '';
          document.getElementById('announcement-is-maintenance').checked = false;
        }
      } catch(e) {
        statusEl.innerHTML = `<span class="text-rose-500">連線異常</span>`;
      }
    }

    async function publishAnnouncement() {
      const text = document.getElementById('announcement-input').value.trim();
      const isMaint = document.getElementById('announcement-is-maintenance').checked;
      
      if (!text) {
        return Swal.fire('請輸入公告文字', '若要清除公告，請點選「下架/清除」按鈕', 'warning');
      }

      Swal.fire({ title: '正在發布全域公告...', allowOutsideClick: false });
      Swal.showLoading();

      try {
        // 1. 將所有舊公告關閉
        await fetch(`${SUPABASE_URL}/rest/v1/system_announcements?is_active=eq.true`, {
          method: "PATCH",
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json" },
          body: JSON.stringify({ is_active: false })
        });

        // 2. 新增最新活躍公告
        const res = await fetch(`${SUPABASE_URL}/rest/v1/system_announcements`, {
          method: "POST",
          headers: { 
            "apikey": SUPABASE_ANON_KEY, 
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, 
            "Content-Type": "application/json",
            "Prefer": "return=representation"
          },
          body: JSON.stringify({ 
            content: text, 
            is_active: true, 
            is_maintenance: isMaint 
          })
        });

        if (!res.ok) throw new Error(await res.text());

        const title = isMaint ? '已啟動全平台例行維護鎖定！' : '全域公告已成功發布！';
        const desc = isMaint ? '所有店家前台將即刻彈出全螢幕遮罩，禁止填單。' : '所有店家前台與後台頂部將同步顯示該公告。';
        Swal.fire(title, desc, 'success');
        loadAnnouncement();
      } catch (err) {
        Swal.fire('發布失敗', err.message, 'error');
      }
    }

    async function clearAnnouncement() {
      Swal.fire({ title: '正在下架公告...', allowOutsideClick: false });
      Swal.showLoading();

      try {
        await fetch(`${SUPABASE_URL}/rest/v1/system_announcements?is_active=eq.true`, {
          method: "PATCH",
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json" },
          body: JSON.stringify({ is_active: false, is_maintenance: false })
        });
        document.getElementById('announcement-input').value = '';
        document.getElementById('announcement-is-maintenance').checked = false;
        Swal.fire('已成功下架公告！', '前後台黃色橫幅與維護遮罩已完全解除隱藏。', 'success');
        loadAnnouncement();
      } catch (err) {
        Swal.fire('下架失敗', err.message, 'error');
      }
    }

    // 許願池讀取與刪除
    async function loadWishes() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/feature_wishes?order=created_at.desc&limit=30`, {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const wishes = await res.json();
        const container = document.getElementById('wishes-container');
        if (!wishes || wishes.length === 0) {
          container.innerHTML = '<div class="text-center py-4 text-brand-400">目前尚無許願回報</div>';
          return;
        }
        container.innerHTML = wishes.map(w => `
          <div class="p-3.5 bg-brand-50 rounded-2xl border border-brand-200 flex justify-between items-start gap-3">
            <div class="space-y-1 flex-1">
              <div class="flex items-center gap-2 font-bold text-brand-900">
                <span>🏪 ${w.store_name || '店家'}</span>
                <span class="text-[10px] text-brand-500 font-normal">${w.created_at ? w.created_at.split('T')[0] : ''}</span>
              </div>
              <p class="text-brand-700 leading-relaxed">${w.content}</p>
            </div>
            <button onclick="deleteWishPrompt('${w.id}')" class="px-2.5 py-1 bg-red-100 hover:bg-red-200 text-red-600 rounded-lg text-xs font-bold transition shrink-0">
              <i class="fa-solid fa-trash text-[10px]"></i> 刪除
            </button>
          </div>
        `).join('');
      } catch(e){}
    }

    function deleteWishPrompt(id) {
      Swal.fire({
        title: '確定刪除此則許願？',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        confirmButtonText: '確定刪除',
        cancelButtonText: '取消'
      }).then(async r => {
        if (r.isConfirmed) {
          await fetch(`${SUPABASE_URL}/rest/v1/feature_wishes?id=eq.${id}`, {
            method: "DELETE",
            headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
          });
          Swal.fire({ title: '已刪除！', icon: 'success', timer: 1000, showConfirmButton: false });
          loadWishes();
        }
      });
    }
  </script>
</body>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>沙龍線上預約</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --primary: #BCA38F;
      --primary-dark: #A08875;
      --bg: #FDFBF7;
      --text-dark: #5C4B3C;
      --border-light: #EBE5DF;
      --pill-border: #E8E2DC;
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body { margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg); color: var(--text-dark); width: 100%; position: relative; }
    
    .header { text-align: center; padding: 30px 20px 20px; background: rgba(253, 251, 247, 0.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-light); }
    #promo { background: var(--primary); color: #fff; padding: 12px; text-align: center; font-size: 14px; font-weight: bold; letter-spacing: 1px; }
    
    /* 說明圖 4:5 拍立得卡片輪播 (圖1) */
    .polaroid-wrapper {
      max-width: 420px; margin: 20px auto 0; padding: 16px; background: #F7EDE8;
      border-radius: 24px; box-shadow: 0 8px 25px rgba(0,0,0,0.04); position: relative;
    }
    .carousel-container { position: relative; width: 100%; overflow: hidden; border-radius: 16px; background: #fff; }
    .carousel-track { display: flex; transition: transform 0.35s ease-in-out; }
    .carousel-slide { min-width: 100%; aspect-ratio: 4 / 5; background-size: cover; background-position: center; }
    .carousel-btn {
      position: absolute; top: 50%; transform: translateY(-50%); background: rgba(160, 136, 117, 0.7);
      color: white; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 16px; z-index: 10;
    }
    .btn-prev { left: 10px; } .btn-next { right: 10px; }
    .carousel-dots { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
    .dot-item { width: 8px; height: 8px; background: #D9CFC7; border-radius: 50%; transition: 0.2s; }
    .dot-item.active { background: var(--primary-dark); transform: scale(1.2); }

    .container-app { max-width: 500px; margin: 20px auto; padding: 0 15px; position: relative; z-index: 2; }
    .custom-card { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 25px; box-shadow: 0 8px 25px rgba(0,0,0,0.04); margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.8); }
    label { font-weight: bold; margin-bottom: 8px; font-size: 14px; color: var(--text-dark); }
    .form-control { border: 1px solid var(--border-light); border-radius: 12px; padding: 12px; font-size: 15px; background: #fafafa; }
    
    .type-btn { flex: 1; padding: 12px; border: 1px solid var(--border-light); border-radius: 12px; text-align: center; cursor: pointer; font-size: 14px; background: #fafafa; font-weight: bold; color: #777; }
    .type-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .chk-label { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--border-light); border-radius: 12px; cursor: pointer; font-size: 14px; background: #fafafa; transition: 0.2s; }
    .chk-label.selected { background: #FDF8F5; border-color: var(--primary); font-weight: bold; color: var(--text-dark); }
    
    .cal-wrapper { border: 1px solid var(--border-light); border-radius: 16px; overflow: hidden; background: #fff; margin-bottom: 15px; }
    .cal-header-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #fafafa; border-bottom: 1px solid var(--border-light); font-weight: bold; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border-light); }
    .cal-cell { background: #fff; text-align: center; padding: 12px 0; font-size: 15px; cursor: pointer; }
    .cal-cell.header { background: #fafafa; font-size: 12px; color: #888; font-weight: bold; }
    .cal-cell.disabled { color: #ccc; cursor: not-allowed; }
    .cal-cell.available { font-weight: bold; }
    .cal-cell.active { background: var(--primary) !important; color: #fff !important; }

    /* 三欄式時段藥丸按鈕網格 (圖3) */
    .time-pill-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .time-pill {
      border: 1px solid var(--pill-border); background: #fff; padding: 12px 0; border-radius: 30px;
      text-align: center; font-weight: bold; font-size: 15px; color: var(--text-dark); cursor: pointer; transition: 0.2s;
    }
    .time-pill:hover { border-color: var(--primary); background: #FDF8F5; }
    .time-pill.selected { background: var(--primary-dark); color: #fff; border-color: var(--primary-dark); }
    .time-pill.disabled { color: #ccc; background: #fdfdfd; cursor: not-allowed; border-color: #f0f0f0; }

    /* 圓形社群圖示與店家資訊 (圖2) */
    .social-row { display: flex; justify-content: center; gap: 20px; margin: 30px 0 20px; }
    .social-circle-btn {
      width: 60px; height: 60px; border-radius: 50%; border: 2px solid #D5C7BC; display: flex;
      align-items: center; justify-content: center; background: #fff; text-decoration: none; transition: 0.3s;
    }
    .social-circle-btn img { width: 28px; height: 28px; object-fit: contain; }
    .social-circle-btn:hover { transform: translateY(-3px); border-color: var(--primary-dark); }
    .store-info-box { text-align: center; font-size: 14px; color: var(--text-dark); margin-bottom: 25px; line-height: 1.8; }
    
    .btn-submit {
      width: 100%; padding: 16px; background: #C2AB97; color: #fff; border: none;
      border-radius: 30px; font-size: 17px; font-weight: bold; cursor: pointer; letter-spacing: 2px;
    }
    .btn-submit:hover { background: var(--primary-dark); }
    .btn-check { width: 100%; padding: 14px; background: transparent; color: var(--text-dark); border: 2px solid #D5C7BC; border-radius: 30px; font-size: 15px; font-weight: bold; margin-top: 12px; }

    .care-section { background: rgba(255,255,255,0.9); border-radius: 16px; margin-bottom: 20px; overflow: hidden; border: 1px solid var(--border-light); }
    .care-header { padding: 18px; background: #fff; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; }
    .care-content { padding: 18px; font-size: 14px; line-height: 1.7; display: none; white-space: pre-wrap; color: #666; }
    
    .tab-wrap { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding-bottom: 15px; }
    .tab { padding: 8px 18px; font-size: 13px; border: 1px solid var(--border-light); border-radius: 25px; cursor: pointer; background: #fff; color: #666; font-weight: bold; }
    .tab.active { background: var(--primary); color: #fff; }
    .work-item { background: #fff; border-radius: 16px; border: 1px solid var(--border-light); overflow: hidden; cursor: pointer; }
    .work-img { width: 100%; aspect-ratio: 3/4; background-size: cover; background-position: center; }
    .work-info { padding: 12px; font-size: 14px; font-weight: bold; text-align: center; }
    
    #success-screen { display: none; text-align: center; padding: 80px 20px; background: var(--bg); height: 100vh; }
    .footer { text-align: center; padding: 20px 20px 80px; font-size: 12px; color: #999; }
  </style>
</head>
<body>

<div id="booking-ui">
  <div class="header">
    <h1 id="brand-title" style="font-family: 'Playfair Display', serif; color: var(--text-dark); margin:0; font-size: 28px;">沙龍預約</h1>
    <div id="brand-subtitle" style="font-size: 13px; color: var(--primary-dark); letter-spacing: 5px; margin-top: 6px; font-weight: bold;">專業美業服務</div>
  </div>
  <div id="promo">歡迎線上預約</div>

  <!-- 說明圖拍立得輪播區塊 (圖1) -->
  <div class="polaroid-wrapper" id="bannerWrapper" style="display: none;">
    <div class="carousel-container">
      <div class="carousel-track" id="carouselTrack"></div>
      <button class="carousel-btn btn-prev" onclick="moveSlide(-1)">❮</button>
      <button class="carousel-btn btn-next" onclick="moveSlide(1)">❯</button>
    </div>
    <div class="carousel-dots" id="carouselDots"></div>
  </div>

  <div class="container-app">
    <div class="custom-card">
      <form id="bookForm">
        <div class="mb-4">
          <label class="form-label">電話</label>
          <input type="tel" class="form-control" id="phone" required placeholder="例如：0912345678" oninput="checkPhoneLength(this)" onblur="checkCustomerByPhone()">
          <div id="welcome-msg" style="color: var(--primary-dark); font-size: 14px; font-weight: bold; margin-top: 8px; display: none;"></div>
        </div>

        <div class="mb-4">
          <label class="form-label">姓名</label>
          <input type="text" class="form-control" id="name" required placeholder="請輸入您的姓名">
        </div>

        <div class="mb-4">
          <label class="form-label">LINE 名稱 (方便確認預約)</label>
          <input type="text" class="form-control" id="lineName" placeholder="例如：Yaling">
        </div>

        <!-- 身份切換 (支援後台開關) -->
        <div class="mb-4" id="custTypeSection">
          <label class="form-label">身份</label>
          <div class="d-flex gap-2">
            <div class="type-btn active" onclick="setType('old', this)">舊朋友</div>
            <div class="type-btn" onclick="setType('new', this)">新朋友</div>
          </div>
          <input type="hidden" id="custType" value="old">
        </div>

        <div class="mb-4">
          <label class="form-label">預約項目 (可複選)</label>
          <div class="row g-2" id="service-grid"></div>
          <input type="hidden" id="service" required>
        </div>

        <div class="mb-4">
          <label class="form-label">日期</label>
          <div class="cal-wrapper">
            <div class="cal-header-row">
              <button type="button" class="btn btn-sm" onclick="changeMonth(-1)">❮</button>
              <div id="cal-month-year">讀取中...</div>
              <button type="button" class="btn btn-sm" onclick="changeMonth(1)">❯</button>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
          </div>
          <input type="hidden" id="date" required>
        </div>

        <!-- 選取進場時段 (三欄藥丸網格，圖3) -->
        <div class="mb-4">
          <label class="form-label">選取進場時段</label>
          <div class="time-pill-grid" id="timePillGrid">
            <div class="text-muted small" style="grid-column: span 3; text-align: center; padding: 15px;">請先選擇預約項目與日期</div>
          </div>
          <input type="hidden" id="time" required>
        </div>

        <!-- 圓形社群圖示與店家資訊 (圖2) -->
        <div class="social-row">
          <a id="nav-line" href="#" target="_blank" class="social-circle-btn">
            <img src="https://cdn-icons-png.flaticon.com/512/124/124027.png" alt="LINE">
          </a>
          <a id="nav-ig" href="#" target="_blank" class="social-circle-btn">
            <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="IG">
          </a>
          <a id="nav-map" href="#" target="_blank" class="social-circle-btn">
            <img src="https://cdn-icons-png.flaticon.com/512/854/854878.png" alt="Map">
          </a>
        </div>

        <div class="store-info-box">
          <div id="store-address">📍 高雄市鳳山區南京路439號</div>
          <div id="store-hours">🕒 營業時間 9:00-19:00 (最晚進場 17:00)</div>
        </div>

        <button type="submit" class="btn-submit" id="subBtn">送出預約申請</button>
        <button type="button" class="btn-check" onclick="openCheckModal()">🔍 查詢我的預約紀錄</button>
      </form>
    </div>

    <!-- 保養叮嚀 -->
    <div class="care-section" id="careSection" style="display: none;">
      <div class="care-header" onclick="toggleCare()"><span>居家保養小叮嚀</span><span>▼</span></div>
      <div class="care-content" id="care-content"></div>
    </div>

    <!-- 作品集專區 -->
    <div id="portfolioSection" style="display: none;">
      <div style="text-align: center; font-family: 'Playfair Display', serif; font-size: 22px; margin: 30px 0 15px;">PORTFOLIO</div>
      <div class="tab-wrap" id="portfolio-tabs"></div>
      <div class="row g-3" id="portfolio-grid"></div>
    </div>

    <div class="footer">Designed by <a href="https://heysibyl.com" target="_blank" style="color: var(--primary-dark); font-weight: bold;">Sibyl | 數位管家</a></div>
  </div>
</div>

<div id="success-screen">
  <div style="font-size: 70px; color: var(--primary); margin-bottom: 20px;">✔</div>
  <h2 style="font-weight: bold;">預約申請已送出！</h2>
  <p style="color:#666; margin-bottom: 30px;">請留意 LINE 訊息，店家確認後會回覆您喔❤️</p>
  <button class="btn-submit" style="width: auto; padding: 12px 40px; border-radius: 30px;" onclick="location.reload()">返回首頁</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxJlhG1eDEwuyjiJedTtvND-iwIzGXA3sfc_iN_Pq-15LIKWwlHGDX5tFRVdlOzfanONA/exec";
  const urlParams = new URLSearchParams(window.location.search);
  const CURRENT_STORE_ID = urlParams.get('store_id') || '2deb066f-98f2-4283-945b-6ae0d6a89acb';

  let db = { availableDates: [], services: [], portfolio: [], promoImgs: [] };
  let currentSlide = 0;
  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth();

  window.onload = async function() {
    try {
      const res = await fetch(`${API_URL}?action=getInitialData&store_id=${CURRENT_STORE_ID}`);
      db = await res.json();

      document.getElementById('brand-title').innerText = db.storeName || "沙龍預約";
      document.getElementById('brand-subtitle').innerText = db.subtitle || "專業美業服務";
      document.getElementById('promo').innerText = db.promoText || "歡迎光臨！";
      document.getElementById('nav-ig').href = db.ig || '#';
      document.getElementById('nav-line').href = db.line || '#';
      document.getElementById('nav-map').href = db.map || '#';
      document.getElementById('store-address').innerText = `📍 ${db.address || '店家地址'}`;
      document.getElementById('store-hours').innerText = `🕒 ${db.businessHours || '營業時間'}`;

      if (!db.enableCustType) {
        document.getElementById('custTypeSection').style.display = 'none';
      }

      // 說明圖 4:5 拍立得輪播
      if (db.enableCarousel && db.promoImgs && db.promoImgs.length > 0) {
        const track = document.getElementById('carouselTrack');
        const dots = document.getElementById('carouselDots');
        track.innerHTML = ''; dots.innerHTML = '';
        db.promoImgs.forEach((imgUrl, i) => {
          track.innerHTML += `<div class="carousel-slide" style="background-image: url('${imgUrl}')"></div>`;
          dots.innerHTML += `<div class="dot-item ${i === 0 ? 'active' : ''}"></div>`;
        });
        document.getElementById('bannerWrapper').style.display = 'block';
      }

      if (db.enableCare) {
        document.getElementById('care-content').innerText = db.careText || "暫無資訊";
        document.getElementById('careSection').style.display = 'block';
      }

      if (db.enablePortfolio && db.portfolio && db.portfolio.length > 0) {
        document.getElementById('portfolioSection').style.display = 'block';
        setupPortfolio();
      }

      // 渲染服務項目
      const svcGrid = document.getElementById('service-grid');
      svcGrid.innerHTML = '';
      (db.services || []).forEach(s => {
        svcGrid.innerHTML += `
          <div class="col-6">
            <label class="chk-label">
              <div><input type="checkbox" value="${s.name}" data-price="${s.price}" onchange="updateServiceSelection(this)"> ${s.name}</div>
              <span class="text-muted small">${s.price}元</span>
            </label>
          </div>`;
      });

      renderFrontCalendar();
    } catch (e) {
      console.error(e);
    }
  };

  function moveSlide(direction) {
    const track = document.getElementById('carouselTrack');
    const total = db.promoImgs.length;
    if (total <= 1) return;
    currentSlide = (currentSlide + direction + total) % total;
    track.style.transform = `translateX(-${currentSlide * 100}%)`;
    document.querySelectorAll('.dot-item').forEach((dot, idx) => {
      dot.classList.toggle('active', idx === currentSlide);
    });
  }

  function setupPortfolio() {
    const tabs = document.getElementById('portfolio-tabs');
    const categories = [...new Set((db.portfolio || []).map(p => p.cat))];
    if (categories.length === 0) return;
    tabs.innerHTML = categories.map((cat, idx) => `<div class="tab ${idx === 0 ? 'active' : ''}" onclick="filterWork('${cat}', this)">${cat}</div>`).join('');
    filterWork(categories[0]);
  }

  function filterWork(cat, el) {
    if (el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }
    const grid = document.getElementById('portfolio-grid');
    grid.innerHTML = '';
    const filtered = (db.portfolio || []).filter(w => w.cat === cat);
    filtered.forEach(w => {
      grid.innerHTML += `<div class="col-6"><div class="work-item" onclick="window.open('${w.link}', '_blank')"><div class="work-img" style="background-image:url('${w.img}')"></div><div class="work-info">${w.title}</div></div></div>`;
    });
  }

  function checkPhoneLength(el) { if (el.value.trim().length >= 10) checkCustomerByPhone(); }

  async function checkCustomerByPhone() {
    let phone = document.getElementById('phone').value.trim();
    if (phone.length >= 8) {
      document.getElementById('welcome-msg').style.display = 'block';
      document.getElementById('welcome-msg').innerText = '🔍 尋找紀錄中...';
      try {
        const res = await fetch(`${API_URL}?action=getCustomerName&store_id=${CURRENT_STORE_ID}&phone=${phone}`);
        const data = await res.json();
        if (data.found) {
          document.getElementById('name').value = data.name;
          document.getElementById('welcome-msg').innerHTML = `✨ 歡迎回來，<b>${data.name}</b>！`;
          setType('old', document.querySelectorAll('.type-btn')[0]);
        } else {
          document.getElementById('welcome-msg').style.display = 'none';
          setType('new', document.querySelectorAll('.type-btn')[1]);
        }
      } catch (err) {
        document.getElementById('welcome-msg').style.display = 'none';
      }
    }
  }

  function setType(t, e) {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    if (e) e.classList.add('active');
    document.getElementById('custType').value = t;
  }

  function toggleCare() {
    const c = document.getElementById('care-content');
    c.style.display = c.style.display === 'block' ? 'none' : 'block';
  }

  function updateServiceSelection(cb) {
    if (cb) cb.closest('.chk-label').classList.toggle('selected', cb.checked);
    let selectedBoxes = Array.from(document.querySelectorAll('#service-grid input:checked'));
    document.getElementById('service').value = selectedBoxes.map(el => el.value).join(', ');
    updateTimes();
  }

  function renderFrontCalendar() {
    const grid = document.getElementById('cal-grid');
    document.getElementById('cal-month-year').innerText = `${currentYear} 年 ${currentMonth + 1} 月`;
    let html = `<div class="cal-cell header">日</div><div class="cal-cell header">一</div><div class="cal-cell header">二</div><div class="cal-cell header">三</div><div class="cal-cell header">四</div><div class="cal-cell header">五</div><div class="cal-cell header">六</div>`;
    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    for (let i = 0; i < firstDay; i++) html += `<div class="cal-cell" style="background:#fafafa;"></div>`;
    const selectedDate = document.getElementById('date').value;
    for (let i = 1; i <= daysInMonth; i++) {
      let dStr = `${currentYear}/${String(currentMonth + 1).padStart(2, '0')}/${String(i).padStart(2, '0')}`;
      let isAvailable = (db.availableDates || []).includes(dStr);
      let isActive = (dStr === selectedDate);
      html += `<div class="cal-cell ${isAvailable ? 'available' : 'disabled'} ${isActive ? 'active' : ''}" ${isAvailable ? `onclick="selectDate('${dStr}')"` : ''}>${i}</div>`;
    }
    grid.innerHTML = html;
  }

  function changeMonth(dir) {
    currentMonth += dir;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderFrontCalendar();
  }

  function selectDate(dStr) {
    document.getElementById('date').value = dStr;
    renderFrontCalendar();
    updateTimes();
  }

  async function updateTimes() {
    const sStr = document.getElementById('service').value;
    const d = document.getElementById('date').value;
    const grid = document.getElementById('timePillGrid');

    if (!sStr || !d) {
      grid.innerHTML = '<div class="text-muted small" style="grid-column: span 3; text-align: center; padding: 15px;">請先選擇項目與日期</div>';
      return;
    }
    grid.innerHTML = '<div class="text-muted small" style="grid-column: span 3; text-align: center; padding: 15px;">計算可用時段中...</div>';

    try {
      const res = await fetch(`${API_URL}?action=getAvailableTimes&store_id=${CURRENT_STORE_ID}&date=${encodeURIComponent(d)}&services=${encodeURIComponent(sStr)}`);
      const times = await res.json();
      grid.innerHTML = '';
      if (times.length === 0) {
        grid.innerHTML = '<div class="text-danger small" style="grid-column: span 3; text-align: center; padding: 15px;">該日已無合適空檔或已達禁約緩衝限制</div>';
      } else {
        times.forEach(t => {
          grid.innerHTML += `<div class="time-pill" onclick="selectTimePill('${t}', this)">${t}</div>`;
        });
      }
    } catch (e) {
      grid.innerHTML = '<div class="text-danger small" style="grid-column: span 3; text-align: center;">時段載入失敗</div>';
    }
  }

  function selectTimePill(timeStr, el) {
    document.querySelectorAll('.time-pill').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('time').value = timeStr;
  }

  function openCheckModal() {
    Swal.fire({
      title: '🔍 查詢預約紀錄',
      input: 'tel',
      inputLabel: '請輸入您預約時的手機號碼',
      inputPlaceholder: '例如：0912345678',
      showCancelButton: true,
      confirmButtonText: '查詢',
      cancelButtonText: '返回',
      confirmButtonColor: 'var(--primary-dark)'
    }).then(async (result) => {
      if (result.isConfirmed && result.value) {
        Swal.fire({ title: '查詢中...', allowOutsideClick: false }); Swal.showLoading();
        const res = await fetch(`${API_URL}?action=checkBooking&store_id=${CURRENT_STORE_ID}&phone=${result.value}`);
        const data = await res.json();
        if (!data.records || data.records.length === 0) {
          Swal.fire('查無紀錄', '您目前沒有未來的預約紀錄唷！', 'info');
        } else {
          let html = '<div style="text-align:left;">';
          data.records.forEach(r => {
            html += `<div style="background:#f9f9f9; border:1px solid #eee; border-radius:12px; padding:15px; margin-bottom:10px;">
              <div style="font-weight:bold; font-size:16px;">${r.date} ${r.time}</div>
              <div style="font-size:14px; color:#555;">項目：${r.service}</div>
              <div style="color:green; font-weight:bold; font-size:13px; margin-top:4px;">狀態：${r.status}</div>
            </div>`;
          });
          html += '</div>';
          Swal.fire({ title: '您的預約紀錄', html: html, confirmButtonText: '好的', confirmButtonColor: 'var(--primary-dark)' });
        }
      }
    });
  }

  document.getElementById('bookForm').onsubmit = async function(e) {
    e.preventDefault();
    if (!document.getElementById('service').value) { alert("請至少勾選一項預約項目！"); return; }
    if (!document.getElementById('date').value) { alert("請在月曆上點選預約日期！"); return; }
    if (!document.getElementById('time').value) { alert("請選取進場時段！"); return; }

    const btn = document.getElementById('subBtn');
    btn.disabled = true; btn.innerText = "正在傳送申請...";

    let totalPrice = 0;
    document.querySelectorAll('#service-grid input:checked').forEach(cb => {
      totalPrice += Number(cb.getAttribute('data-price') || 0);
    });

    const payload = {
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      lineName: document.getElementById('lineName').value,
      type: document.getElementById('custType').value,
      service: document.getElementById('service').value,
      price: totalPrice,
      date: document.getElementById('date').value,
      time: document.getElementById('time').value
    };

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "submitBooking", store_id: CURRENT_STORE_ID, data: payload })
      });
      const status = await res.text();
      if (status.includes("SUCCESS")) {
        document.getElementById('booking-ui').style.display = 'none';
        document.getElementById('success-screen').style.display = 'block';
      } else {
        alert("預約傳送發生問題，請稍候重試");
        btn.disabled = false;
      }
    } catch (err) {
      btn.disabled = false;
    }
  };
</script>
</body>
</html>

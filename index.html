<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>線上預約系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FDFBF7', 100: '#F7EDE8', 200: '#EBE5DF', 300: '#D5C7BC',
              400: '#BCA38F', 500: '#A08875', 800: '#5C4B3C', 900: '#3D3126',
            }
          },
          fontFamily: { sans: ['Noto Sans TC', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #FDFBF7; }
    .carousel-slide { min-width: 100%; aspect-ratio: 4 / 5; background-size: cover; background-position: center; }
  </style>
</head>
<body class="text-brand-800 antialiased selection:bg-brand-400 selection:text-white pb-20">

<!-- 頂部商店名稱與 Logo 區塊 -->
<header class="text-center pt-6 pb-4 px-4 bg-brand-50">
  <!-- 高度 400px LOGO 容器 (由後台開關控制) -->
  <div id="store-logo-wrapper" class="w-full h-[400px] mb-4 overflow-hidden rounded-3xl shadow-sm border border-brand-200" style="display: none;">
    <img id="store-logo-img" class="w-full h-full object-cover" src="" alt="商店LOGO">
  </div>
  <h1 id="brand-title" class="font-serif text-2xl tracking-wider text-brand-900 font-bold">線上預約</h1>
  <div id="brand-subtitle" class="text-xs text-brand-500 tracking-[0.25em] mt-1 font-medium">專業美業沙龍</div>
</header>

<!-- 店家最新公告 (左右滿版置中) -->
<div id="promo" class="w-full bg-[#BCA38F] text-white py-3.5 px-4 text-center tracking-wide shadow-sm" style="display: none;">
  <div class="text-xs font-bold flex items-center justify-center gap-1.5 mb-0.5">
    <svg class="w-4 h-4 text-white inline-block" fill="currentColor" viewBox="0 0 20 20"><path d="M18 3a1 1 0 00-1.447-.894L8.763 6H5a3 3 0 000 6h.28l1.771 5.316A1 1 0 008 18h1a1 1 0 001-1v-4.39l6.553 3.276A1 1 0 0018 15V3z"/></svg>
    <span>店家最新公告</span>
  </div>
  <div class="text-xs text-white/95 leading-relaxed" id="promo-text"></div>
</div>

<div id="booking-ui" class="max-w-md mx-auto min-h-screen flex flex-col">

  <!-- PORTFOLIO 作品展示專區 (置於說明圖上方) -->
  <div class="px-4 mt-6" id="portfolioSection" style="display: none;">
    <div class="text-center font-serif text-xl tracking-widest text-brand-900 mb-3">PORTFOLIO</div>
    <div class="flex gap-2 justify-center flex-wrap mb-3" id="portfolio-tabs"></div>
    <div class="grid grid-cols-2 gap-3" id="portfolio-grid"></div>
  </div>

  <!-- 4:5 說明圖輪播 -->
  <div class="px-4 mt-4" id="bannerWrapper" style="display: none;">
    <div class="bg-brand-100 p-3.5 rounded-3xl shadow-sm border border-brand-200/60">
      <div class="relative overflow-hidden rounded-2xl bg-white shadow-inner">
        <div class="flex transition-transform duration-300 ease-in-out" id="carouselTrack"></div>
        <button class="absolute left-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-brand-500/80 text-white flex items-center justify-center shadow-md backdrop-blur-sm" onclick="moveSlide(-1)">❮</button>
        <button class="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-brand-500/80 text-white flex items-center justify-center shadow-md backdrop-blur-sm" onclick="moveSlide(1)">❯</button>
      </div>
      <div class="flex justify-center gap-1.5 mt-3" id="carouselDots"></div>
    </div>
  </div>

  <main class="flex-1 px-4 mt-4">
    <div class="bg-white/95 rounded-3xl p-6 shadow-sm border border-white/80 backdrop-blur-md mb-6">
      <form id="bookForm" class="space-y-5">
        
        <div>
          <label class="block text-xs font-bold text-brand-800 mb-1.5">手機號碼</label>
          <input type="tel" id="phone" required placeholder="例如：0912345678" class="w-full px-4 py-3 rounded-xl border border-brand-200 bg-brand-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:bg-white transition" oninput="checkPhoneLength(this)" onblur="checkCustomerByPhone()">
          <div id="welcome-msg" class="text-xs font-bold text-brand-500 mt-2" style="display: none;"></div>
        </div>

        <div>
          <label class="block text-xs font-bold text-brand-800 mb-1.5">您的姓名</label>
          <input type="text" id="name" required placeholder="請輸入姓名" class="w-full px-4 py-3 rounded-xl border border-brand-200 bg-brand-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:bg-white transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-brand-800 mb-1.5">LINE 顯示名稱</label>
          <input type="text" id="lineName" placeholder="例如：小美" class="w-full px-4 py-3 rounded-xl border border-brand-200 bg-brand-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:bg-white transition">
        </div>

        <div id="emailSection" style="display: none;">
          <label class="block text-xs font-bold text-brand-800 mb-1.5">電子信箱 (自動寄送預約副本)</label>
          <input type="email" id="email" placeholder="例如：user@gmail.com" class="w-full px-4 py-3 rounded-xl border border-brand-200 bg-brand-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:bg-white transition">
        </div>

        <div id="custTypeSection">
          <label class="block text-xs font-bold text-brand-800 mb-1.5">顧客身份</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" class="type-btn py-2.5 rounded-xl border border-brand-400 text-xs font-bold transition bg-brand-400 text-white shadow-sm" onclick="setType('old', this)">舊朋友</button>
            <button type="button" class="type-btn py-2.5 rounded-xl border border-brand-200 text-xs font-bold transition bg-brand-50/50 text-brand-800" onclick="setType('new', this)">新朋友</button>
          </div>
          <input type="hidden" id="custType" value="old">
        </div>

        <div id="staffSection" style="display: none;">
          <label class="block text-xs font-bold text-brand-800 mb-1.5">指定服務專員</label>
          <div class="grid grid-cols-3 gap-2" id="staffGrid"></div>
          <input type="hidden" id="staffId" value="all">
          <input type="hidden" id="staffName" value="不指定">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-xs font-bold text-brand-800">選擇項目 (可複選)</label>
            <span class="text-[11px] text-brand-400 font-medium">※ 加購項目需先選主項目</span>
          </div>
          <div class="grid grid-cols-2 gap-2" id="service-grid"></div>
          <input type="hidden" id="service" required>
        </div>

        <div>
          <label class="block text-xs font-bold text-brand-800 mb-1.5">預約日期</label>
          <div class="border border-brand-200 rounded-2xl overflow-hidden bg-white shadow-sm">
            <div class="flex justify-between items-center px-4 py-2.5 bg-brand-50 border-b border-brand-200">
              <button type="button" class="text-brand-500 font-bold p-1 hover:text-brand-800" onclick="changeMonth(-1)">❮</button>
              <div id="cal-month-year" class="text-xs font-bold text-brand-800">讀取中...</div>
              <button type="button" class="text-brand-500 font-bold p-1 hover:text-brand-800" onclick="changeMonth(1)">❯</button>
            </div>
            <div class="grid grid-cols-7 gap-px bg-brand-200 text-center" id="cal-grid"></div>
          </div>
          <input type="hidden" id="date" required>
        </div>

        <!-- 預約時段 -->
        <div>
          <label class="block text-xs font-bold text-brand-800 mb-1.5">預約時段</label>
          <div class="grid grid-cols-3 gap-2" id="timePillGrid">
            <div class="col-span-3 text-center py-4 text-xs text-brand-400 bg-brand-50/50 rounded-2xl border border-dashed border-brand-200">請先選擇服務項目與日期</div>
          </div>
          <input type="hidden" id="time" required>
        </div>

        <!-- 居家保養小叮嚀 (原生收折 details 標籤，保證顯示在預約時段正下方) -->
        <div id="careSection" class="mt-3" style="display: none;">
          <details class="group bg-brand-50/80 rounded-2xl border border-brand-200 overflow-hidden transition">
            <summary class="flex justify-between items-center p-3.5 cursor-pointer font-bold text-xs text-brand-800 select-none bg-brand-100/50 hover:bg-brand-100 transition">
              <span>🌿 居家保養小叮嚀</span>
              <span class="text-brand-400 group-open:rotate-180 transition transform">▼</span>
            </summary>
            <div class="p-3.5 text-xs text-brand-800/90 leading-relaxed bg-white/90 border-t border-brand-100 whitespace-pre-wrap" id="care-content"></div>
          </details>
        </div>

        <!-- 社群按鈕與店家資訊 -->
        <div class="pt-2 border-t border-brand-100">
          <div class="flex justify-center gap-6 my-4">
            <a id="nav-line" href="#" target="_blank" class="w-16 h-16 rounded-full border-2 border-[#D5C7BC] bg-white flex items-center justify-center shadow-sm hover:-translate-y-1 hover:border-brand-500 transition group" title="官方 LINE">
              <svg class="w-7 h-7 text-[#5C4B3C] group-hover:text-brand-500 transition" viewBox="0 0 24 24" fill="currentColor"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg></a>
            <a id="nav-ig" href="#" target="_blank" class="w-16 h-16 rounded-full border-2 border-[#D5C7BC] bg-white flex items-center justify-center shadow-sm hover:-translate-y-1 hover:border-brand-500 transition group" title="Instagram"><svg class="w-7 h-7 text-[#5C4B3C] group-hover:text-brand-500 transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></a>
            <a id="nav-map" href="#" target="_blank" class="w-16 h-16 rounded-full border-2 border-[#D5C7BC] bg-white flex items-center justify-center shadow-sm hover:-translate-y-1 hover:border-brand-500 transition group" title="地圖導航"><svg class="w-7 h-7 text-[#5C4B3C] group-hover:text-brand-500 transition" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></a>
          </div>

          <div class="text-center text-xs text-brand-800 space-y-1.5 mb-5 font-medium">
            <div id="store-address" style="display: none;"></div>
            <div id="store-hours" style="display: none;"></div>
          </div>

          <button type="submit" id="subBtn" class="w-full py-4 bg-[#C2AB97] hover:bg-brand-500 text-white font-bold rounded-2xl shadow-md text-base tracking-widest transition transform active:scale-95">
            送出預約
          </button>
        </div>

      </form>
    </div>
  </main>

  <footer class="text-center py-6 text-[11px] text-brand-400">
    Designed by <a href="https://heysibyl.com" target="_blank" class="text-brand-500 font-bold hover:underline">Sibyl | 數位管家</a>
  </footer>

</div>

<!-- 預約成功畫面 -->
<div id="success-screen" class="fixed inset-0 bg-brand-50 z-50 flex flex-col items-center justify-center p-6 text-center" style="display: none;">
  <div class="w-16 h-16 bg-brand-100 text-brand-500 rounded-full flex items-center justify-center text-2xl mb-4 shadow-sm">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
  </div>
  <h2 class="text-xl font-bold text-brand-900 mb-2">預約申請已送出！</h2>
  <p class="text-xs text-brand-500 mb-4 leading-relaxed">店家確認排程後會立即與您聯繫確認❤️</p>

  <div id="deposit-box" class="w-full max-w-xs bg-white p-4 rounded-2xl border border-brand-200 text-left space-y-3 mb-5 shadow-sm" style="display: none;">
    <div class="text-xs font-bold text-brand-900 border-b border-brand-100 pb-1.5 flex items-center gap-1">
      <span class="text-amber-500 font-bold">⚠️</span> 訂金匯款資訊
    </div>
    <div class="text-xs text-brand-800 whitespace-pre-wrap leading-relaxed" id="deposit-info-text"></div>
    <div class="pt-2 border-t border-brand-100">
      <label class="block text-[11px] font-bold text-brand-800 mb-1">已匯款請回報帳號後五碼：</label>
      <div class="flex gap-2">
        <input type="text" id="deposit-last5-input" maxlength="5" placeholder="例如: 12345" class="w-2/3 p-2 text-xs border border-brand-200 rounded-xl bg-brand-50/50 text-center font-bold">
        <button type="button" onclick="reportDeposit()" class="w-1/3 py-2 bg-brand-400 text-white text-xs font-bold rounded-xl shadow-sm">送出</button>
      </div>
    </div>
  </div>

  <button class="px-8 py-3 bg-brand-400 text-white text-xs font-bold rounded-full shadow-md" onclick="location.reload()">返回首頁</button>
</div>

<script>
  const SUPABASE_URL = "https://kwbxskvnfejfguuwzqfr.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_JnpaLZVnGkW9Jr967LeYuQ_d8bXwfnz";
  const API_URL = "https://script.google.com/macros/s/AKfycbxJlhG1eDEwuyjiJedTtvND-iwIzGXA3sfc_iN_Pq-15LIKWwlHGDX5tFRVdlOzfanONA/exec";
  const urlParams = new URLSearchParams(window.location.search);
  const CURRENT_STORE_ID = urlParams.get('store_id') || '2deb066f-98f2-4283-945b-6ae0d6a89acb';

  let db = { availableDates: [], services: [], portfolio: [], promoImgs: [], weeklyOffDays: [], customOffDates: [], futureBookings: [], staffSchedules: {} };
  let currentSlide = 0;
  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth();
  let lastSubmittedBookingId = "";

  async function directSupabaseFetch(endpoint) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    return await res.json();
  }

  window.onload = async function() {
    const cachedData = localStorage.getItem(`cache_${CURRENT_STORE_ID}`);
    if (cachedData) {
      try { db = JSON.parse(cachedData); renderStoreUI(); } catch (e) {}
    }

    try {
      const nowIso = new Date().toISOString();
      const [stores, settings, services, portfolios, bookings] = await Promise.all([
        directSupabaseFetch(`stores?id=eq.${CURRENT_STORE_ID}&select=*`),
        directSupabaseFetch(`store_settings?store_id=eq.${CURRENT_STORE_ID}&select=*`),
        directSupabaseFetch(`services?store_id=eq.${CURRENT_STORE_ID}&order=sort_order.asc,created_at.asc&select=*`),
        directSupabaseFetch(`portfolios?store_id=eq.${CURRENT_STORE_ID}&order=sort_order.asc,created_at.desc&select=*`),
        directSupabaseFetch(`bookings?store_id=eq.${CURRENT_STORE_ID}&appointment_time=gte.${nowIso}&status=neq.已取消&select=appointment_time,staff_id,service_names`)
      ]);

      const sInfo = Array.isArray(stores) && stores.length > 0 ? stores[0] : { store_name: "線上預約" };
      const sCfg = Array.isArray(settings) && settings.length > 0 ? settings[0] : {};

      const weeklyOffDays = Array.isArray(sCfg.weekly_off_days) ? sCfg.weekly_off_days : [];
      const customOffDates = Array.isArray(sCfg.custom_off_dates) ? sCfg.custom_off_dates : [];
      const availableDates = [];
      const today = new Date();
      for (let i = 0; i < 60; i++) {
        const target = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
        const dStr = `${target.getFullYear()}/${String(target.getMonth()+1).padStart(2,'0')}/${String(target.getDate()).padStart(2,'0')}`;
        if (!weeklyOffDays.includes(target.getDay()) && !customOffDates.includes(dStr)) {
          availableDates.push(dStr);
        }
      }

      db = {
        storeName: sCfg.display_title || sInfo.store_name || "線上預約",
        subtitle: sCfg.display_subtitle || "",
        enableLogo: sCfg.enable_logo === true,
        logoUrl: sCfg.logo_url || "",
        promoText: sCfg.promo_text || "",
        promoImgs: sCfg.promo_imgs || [],
        address: sCfg.address || "",
        businessHours: sCfg.business_hours || "",
        bookingBufferHours: Number(sCfg.booking_buffer_hours ?? 1),
        careText: sCfg.care_text || "",
        ig: sCfg.ig_url || "",
        line: sCfg.line_url || "",
        map: sCfg.map_url || "",
        enableEmailCopy: sCfg.enable_email_copy === true,
        enableAuditBooking: sCfg.enable_audit_booking !== false,
        enableDeposit: sCfg.enable_deposit === true,
        depositInfo: sCfg.deposit_info || "",
        enableStaffSelect: sCfg.enable_staff_select === true,
        enableCarousel: sCfg.enable_carousel !== false,
        enableCustType: sCfg.enable_cust_type !== false,
        enablePortfolio: sCfg.enable_portfolio !== false,
        enableCare: sCfg.enable_care !== false,
        staffList: (sCfg.staff_list || [{ id: "all", name: "不指定" }]).map(s => ({ id: s.id, name: s.name })),
        staffSchedules: sCfg.staff_schedules || {},
        shiftStartTime: sCfg.shift_start_time || "09:00",
        shiftEndTime: sCfg.shift_end_time || "19:00",
        shiftInterval: Number(sCfg.shift_interval || 30),
        services: (services || []).map(s => ({
          id: s.id, name: s.service_name, duration: s.duration_minutes || 60,
          type: s.service_type || "Group_A", price: Number(s.price) || 0,
          isAddon: s.is_addon === true, sortOrder: s.sort_order || 0
        })),
        portfolio: (portfolios || []).map(p => ({
          id: p.id, cat: p.category, title: p.title, link: p.link || '', img: p.img_url
        })),
        availableDates: availableDates,
        futureBookings: bookings || []
      };

      localStorage.setItem(`cache_${CURRENT_STORE_ID}`, JSON.stringify(db));
      renderStoreUI();
    } catch (e) {
      console.error(e);
    }
  };

  function renderStoreUI() {
    document.getElementById('brand-title').innerText = db.storeName || "線上預約";
    document.getElementById('brand-subtitle').innerText = db.subtitle || "專業美業服務";
    
    if (db.enableLogo && db.logoUrl) {
      document.getElementById('store-logo-img').src = db.logoUrl;
      document.getElementById('store-logo-wrapper').style.display = 'block';
    } else {
      document.getElementById('store-logo-wrapper').style.display = 'none';
    }

    if (db.promoText) {
      document.getElementById('promo-text').innerText = db.promoText;
      document.getElementById('promo').style.display = 'block';
    } else {
      document.getElementById('promo').style.display = 'none';
    }

    document.getElementById('nav-ig').href = db.ig || '#';
    document.getElementById('nav-line').href = db.line || '#';
    document.getElementById('nav-map').href = db.map || '#';

    if (db.address) {
      document.getElementById('store-address').innerText = `📍 ${db.address}`;
      document.getElementById('store-address').style.display = 'block';
    }
    if (db.businessHours) {
      document.getElementById('store-hours').innerText = `🕒 ${db.businessHours}`;
      document.getElementById('store-hours').style.display = 'block';
    }

    if (db.enableEmailCopy) {
      document.getElementById('emailSection').style.display = 'block';
    }
    if (!db.enableCustType) {
      document.getElementById('custTypeSection').style.display = 'none';
    }

    if (db.enableStaffSelect && db.staffList && db.staffList.length > 0) {
      const staffGrid = document.getElementById('staffGrid');
      staffGrid.innerHTML = db.staffList.map((s, idx) => `
        <button type="button" class="staff-btn py-2 px-1 rounded-xl border text-xs font-bold truncate transition ${idx === 0 ? 'bg-brand-400 text-white border-brand-400 shadow-sm' : 'bg-brand-50/50 border-brand-200 text-brand-800'}" onclick="selectStaff('${s.id}', '${s.name}', this)">
          ${s.name}
        </button>
      `).join('');
      document.getElementById('staffSection').style.display = 'block';
    }

    if (db.enableCarousel && db.promoImgs && db.promoImgs.length > 0) {
      const track = document.getElementById('carouselTrack');
      const dots = document.getElementById('carouselDots');
      track.innerHTML = ''; dots.innerHTML = '';
      db.promoImgs.forEach((imgUrl, i) => {
        track.innerHTML += `<div class="carousel-slide" style="background-image: url('${imgUrl}')"></div>`;
        dots.innerHTML += `<div class="w-2 h-2 rounded-full transition-all ${i === 0 ? 'bg-brand-500 scale-125' : 'bg-brand-300'}"></div>`;
      });
      document.getElementById('bannerWrapper').style.display = 'block';
    }

    if (db.enableCare && db.careText) {
      document.getElementById('care-content').innerText = db.careText;
      document.getElementById('careSection').style.display = 'block';
    }

    if (db.enablePortfolio && db.portfolio && db.portfolio.length > 0) {
      document.getElementById('portfolioSection').style.display = 'block';
      setupPortfolio();
    }

    renderServices();
    renderFrontCalendar();
  }

  function selectStaff(id, name, el) {
    document.querySelectorAll('.staff-btn').forEach(b => {
      b.className = "staff-btn py-2 px-1 rounded-xl border text-xs font-bold truncate transition bg-brand-50/50 border-brand-200 text-brand-800";
    });
    el.className = "staff-btn py-2 px-1 rounded-xl border text-xs font-bold truncate transition bg-brand-400 text-white border-brand-400 shadow-sm";
    document.getElementById('staffId').value = id;
    document.getElementById('staffName').value = name;
    calculateTimesLocally();
  }

  function renderServices() {
    const svcGrid = document.getElementById('service-grid');
    svcGrid.innerHTML = '';
    const hasMainSelected = Array.from(document.querySelectorAll('#service-grid input[data-isaddon="false"]:checked')).length > 0;

    (db.services || []).forEach(s => {
      const isAddon = s.isAddon === true;
      const disabledClass = isAddon && !hasMainSelected ? 'opacity-40 pointer-events-none' : '';

      svcGrid.innerHTML += `
        <label class="service-card flex items-center justify-between p-3 rounded-xl border border-brand-200 bg-brand-50/50 cursor-pointer transition text-xs ${disabledClass}">
          <div class="flex items-center gap-2 truncate">
            <input type="checkbox" value="${s.name}" data-price="${s.price}" data-isaddon="${isAddon}" data-duration="${s.duration}" onchange="handleServiceChange(this)" class="accent-brand-400 rounded">
            <span class="truncate font-medium">${isAddon ? '✨ ' : ''}${s.name}</span>
          </div>
          <span class="text-brand-500 font-bold ml-1 shrink-0">${s.price}元</span>
        </label>`;
    });
  }

  function handleServiceChange(cb) {
    const selectedMainCount = Array.from(document.querySelectorAll('#service-grid input[data-isaddon="false"]:checked')).length;
    if (selectedMainCount === 0) {
      document.querySelectorAll('#service-grid input[data-isaddon="true"]').forEach(addonCb => {
        addonCb.checked = false;
      });
    }

    let selectedBoxes = Array.from(document.querySelectorAll('#service-grid input:checked'));
    document.getElementById('service').value = selectedBoxes.map(el => el.value).join(', ');
    
    document.querySelectorAll('.service-card').forEach(card => {
      const input = card.querySelector('input');
      if (input.checked) {
        card.classList.add('bg-brand-100', 'border-brand-400', 'font-bold');
      } else {
        card.classList.remove('bg-brand-100', 'border-brand-400', 'font-bold');
      }

      if (input.getAttribute('data-isaddon') === 'true') {
        if (selectedMainCount > 0) {
          card.classList.remove('opacity-40', 'pointer-events-none');
        } else {
          card.classList.add('opacity-40', 'pointer-events-none');
        }
      }
    });

    calculateTimesLocally();
  }

  function moveSlide(direction) {
    const track = document.getElementById('carouselTrack');
    const total = document.querySelectorAll('.carousel-slide').length;
    if (total <= 1) return;
    currentSlide = (currentSlide + direction + total) % total;
    track.style.transform = `translateX(-${currentSlide * 100}%)`;
    document.querySelectorAll('#carouselDots div').forEach((dot, idx) => {
      dot.className = idx === currentSlide ? "w-2 h-2 rounded-full transition-all bg-brand-500 scale-125" : "w-2 h-2 rounded-full transition-all bg-brand-300";
    });
  }

  function renderFrontCalendar() {
    const grid = document.getElementById('cal-grid');
    document.getElementById('cal-month-year').innerText = `${currentYear} 年 ${currentMonth + 1} 月`;
    
    const headers = ['日', '一', '二', '三', '四', '五', '六'];
    let html = headers.map(h => `<div class="bg-brand-50 py-2 text-[11px] font-bold text-brand-400">${h}</div>`).join('');

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    for (let i = 0; i < firstDay; i++) html += `<div class="bg-white py-3"></div>`;
    
    const selectedDate = document.getElementById('date').value;
    for (let i = 1; i <= daysInMonth; i++) {
      let dStr = `${currentYear}/${String(currentMonth + 1).padStart(2, '0')}/${String(i).padStart(2, '0')}`;
      let isAvailable = (db.availableDates || []).includes(dStr);
      let isActive = (dStr === selectedDate);
      
      if (isAvailable) {
        html += `
          <div class="py-2.5 text-xs font-bold cursor-pointer transition ${isActive ? 'bg-brand-900 text-white font-extrabold shadow-inner rounded-xl' : 'bg-white text-gray-900 hover:bg-brand-100 rounded-xl'}" onclick="selectDate('${dStr}')">
            ${i}
          </div>`;
      } else {
        html += `<div class="bg-brand-50/50 py-2.5 text-xs text-gray-300 cursor-not-allowed select-none">${i}</div>`;
      }
    }
    grid.innerHTML = html;
  }

  function changeMonth(dir) {
    currentMonth += dir;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderFrontCalendar();
  }

  function selectDate(dStr) {
    document.getElementById('date').value = dStr;
    renderFrontCalendar();
    calculateTimesLocally();
  }

  function calculateTimesLocally() {
    const sStr = document.getElementById('service').value;
    const dStr = document.getElementById('date').value;
    const staffId = document.getElementById('staffId').value;
    const grid = document.getElementById('timePillGrid');

    if (!sStr || !dStr) {
      grid.innerHTML = '<div class="col-span-3 text-center py-4 text-xs text-brand-400 bg-brand-50/50 rounded-2xl border border-dashed border-brand-200">請先選擇服務項目與日期</div>';
      return;
    }

    let totalDuration = 0;
    let hasGroupB = false;
    document.querySelectorAll('#service-grid input:checked').forEach(cb => {
      totalDuration += Number(cb.getAttribute('data-duration') || 60);
      const svc = (db.services || []).find(s => s.name === cb.value);
      if (svc && svc.type === 'Group_B') hasGroupB = true;
    });
    if (totalDuration === 0) totalDuration = 60;

    const [sH, sM] = (db.shiftStartTime || "09:00").split(':').map(Number);
    const [eH, eM] = (db.shiftEndTime || "19:00").split(':').map(Number);
    const interval = Number(db.shiftInterval || 30);
    const startMin = sH * 60 + sM;
    const endMin = eH * 60 + eM;

    const defaultSlots = [];
    for (let m = startMin; m <= endMin; m += interval) defaultSlots.push(m);

    const d = new Date(dStr.replace(/\//g, '-'));
    const isWeekend = (d.getDay() === 0 || d.getDay() === 6);
    const maxCapacity = isWeekend ? 2 : 1;
    const now = new Date();
    const bufferMs = Number(db.bookingBufferHours || 1) * 60 * 60 * 1000;

    const targetDateFormatted = dStr.replace(/\//g, '-');
    const dayAppts = (db.futureBookings || []).filter(a => {
      return a.appointment_time.startsWith(targetDateFormatted) && (staffId === 'all' || a.staff_id === staffId);
    });

    const staffKey = `${staffId}_${dStr}`;
    const customStaffSlots = db.staffSchedules && db.staffSchedules[staffKey];

    let html = '';
    defaultSlots.forEach(t => {
      const slotHour = Math.floor(t / 60);
      const slotMin = t % 60;
      const timeFormatted = (slotHour < 10 ? "0" + slotHour : slotHour) + ":" + (slotMin === 0 ? "00" : slotMin);
      const slotDateTime = new Date(dStr.replace(/\//g, '-'));
      slotDateTime.setHours(slotHour, slotMin, 0, 0);

      let isAvailable = true;
      if (slotDateTime.getTime() - now.getTime() < bufferMs) isAvailable = false;
      if (customStaffSlots && customStaffSlots[timeFormatted] === false) isAvailable = false;
      if (t + totalDuration > endMin + interval) isAvailable = false;
      
      let concurrent = [];
      dayAppts.forEach(a => {
        const aDate = new Date(a.appointment_time);
        const aStart = aDate.getHours() * 60 + aDate.getMinutes();
        if (t >= aStart && t < aStart + 90) concurrent.push("Group_B");
      });
      if (concurrent.length >= maxCapacity || (hasGroupB && concurrent.length > 0)) isAvailable = false;

      if (isAvailable) {
        html += `
          <div class="time-pill py-2.5 text-center text-xs font-bold rounded-full border border-brand-200 bg-white text-brand-800 cursor-pointer hover:border-brand-400 hover:bg-brand-50 transition shadow-sm" onclick="selectTimePill('${timeFormatted}', this)">
            ${timeFormatted}
          </div>`;
      } else {
        html += `
          <div class="py-2.5 text-center text-xs font-bold rounded-full border border-gray-200 bg-gray-100 text-gray-400 cursor-not-allowed select-none opacity-60">
            ${timeFormatted}
          </div>`;
      }
    });

    grid.innerHTML = html;
  }

  function selectTimePill(timeStr, el) {
    document.querySelectorAll('.time-pill').forEach(p => {
      p.className = "time-pill py-2.5 text-center text-xs font-bold rounded-full border border-brand-200 bg-white text-brand-800 cursor-pointer hover:border-brand-400 hover:bg-brand-50 transition shadow-sm";
    });
    el.className = "time-pill py-2.5 text-center text-xs font-bold rounded-full border border-brand-500 bg-brand-500 text-white shadow-md";
    document.getElementById('time').value = timeStr;
  }

  function checkPhoneLength(el) { if (el.value.trim().length >= 10) checkCustomerByPhone(); }

  async function checkCustomerByPhone() {
    let phone = document.getElementById('phone').value.trim();
    if (phone.length >= 8) {
      document.getElementById('welcome-msg').style.display = 'block';
      document.getElementById('welcome-msg').innerText = '尋找紀錄中...';
      try {
        const res = await directSupabaseFetch(`bookings?store_id=eq.${CURRENT_STORE_ID}&customer_phone=eq.${phone}&order=created_at.desc&limit=1&select=*`);
        if (Array.isArray(res) && res.length > 0) {
          document.getElementById('name').value = res[0].customer_name;
          if (res[0].line_name) document.getElementById('lineName').value = res[0].line_name;
          document.getElementById('welcome-msg').innerHTML = `歡迎回來，<b>${res[0].customer_name}</b>！`;
          setType('old', document.querySelectorAll('.type-btn')[0]);
        } else {
          document.getElementById('welcome-msg').style.display = 'none';
          setType('new', document.querySelectorAll('.type-btn')[1]);
        }
      } catch (err) {
        document.getElementById('welcome-msg').style.display = 'none';
      }
    }
  }

  function setType(t, e) {
    document.querySelectorAll('.type-btn').forEach(b => {
      b.className = "type-btn py-2.5 rounded-xl border border-brand-200 text-xs font-bold transition bg-brand-50/50 text-brand-800";
    });
    e.className = "type-btn py-2.5 rounded-xl border border-brand-400 text-xs font-bold transition bg-brand-400 text-white shadow-sm";
    document.getElementById('custType').value = t;
  }

  function setupPortfolio() {
    const tabs = document.getElementById('portfolio-tabs');
    const categories = [...new Set((db.portfolio || []).map(p => p.cat))];
    if (categories.length === 0) return;
    tabs.innerHTML = categories.map((cat, idx) => `
      <button class="px-3.5 py-1.5 rounded-full text-xs font-bold border transition ${idx === 0 ? 'bg-brand-400 text-white border-brand-400 shadow-sm' : 'bg-white text-brand-800 border-brand-200'}" onclick="filterWork('${cat}', this)">
        ${cat}
      </button>
    `).join('');
    filterWork(categories[0]);
  }

  function filterWork(cat, el) {
    if (el) {
      document.querySelectorAll('#portfolio-tabs button').forEach(t => {
        t.className = "px-3.5 py-1.5 rounded-full text-xs font-bold border transition bg-white text-brand-800 border-brand-200";
      });
      el.className = "px-3.5 py-1.5 rounded-full text-xs font-bold border transition bg-brand-400 text-white border-brand-400 shadow-sm";
    }
    const grid = document.getElementById('portfolio-grid');
    grid.innerHTML = '';
    const filtered = (db.portfolio || []).filter(w => w.cat === cat);
    filtered.forEach(w => {
      grid.innerHTML += `
        <div class="bg-white rounded-2xl overflow-hidden border border-brand-200 shadow-sm cursor-pointer hover:-translate-y-1 transition" onclick="window.open('${w.link}', '_blank')">
          <div class="w-full aspect-[3/4] bg-cover bg-center" style="background-image:url('${w.img}')"></div>
          <div class="p-2.5 text-center text-xs font-bold text-brand-900 truncate">${w.title}</div>
        </div>`;
    });
  }

  document.getElementById('bookForm').onsubmit = async function(e) {
    e.preventDefault();
    if (!document.getElementById('service').value) { alert("請至少選擇一項預約項目！"); return; }
    if (!document.getElementById('date').value) { alert("請點選預約日期！"); return; }
    if (!document.getElementById('time').value) { alert("請選取預約時段！"); return; }

    const btn = document.getElementById('subBtn');
    btn.disabled = true; btn.innerText = "正在傳送預約...";

    let totalPrice = 0;
    document.querySelectorAll('#service-grid input:checked').forEach(cb => {
      totalPrice += Number(cb.getAttribute('data-price') || 0);
    });

    const payload = {
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      lineName: document.getElementById('lineName').value,
      email: document.getElementById('email')?.value || '',
      type: document.getElementById('custType').value,
      staffId: document.getElementById('staffId').value,
      staffName: document.getElementById('staffName').value,
      service: document.getElementById('service').value,
      price: totalPrice,
      date: document.getElementById('date').value,
      time: document.getElementById('time').value
    };

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "submitBooking", store_id: CURRENT_STORE_ID, data: payload })
      });
      const resData = await res.json();
      if (resData.status === "SUCCESS") {
        lastSubmittedBookingId = resData.bookingId;
        document.getElementById('booking-ui').style.display = 'none';
        
        if (resData.needDeposit && resData.depositInfo) {
          document.getElementById('deposit-info-text').innerText = resData.depositInfo;
          document.getElementById('deposit-box').style.display = 'block';
        }
        document.getElementById('success-screen').style.display = 'flex';
      } else {
        alert("預約傳送發生問題，請稍候重試");
        btn.disabled = false;
      }
    } catch (err) {
      btn.disabled = false;
    }
  };

  async function reportDeposit() {
    const last5 = document.getElementById('deposit-last5-input').value.trim();
    if (last5.length !== 5) { Swal.fire('請填寫完整帳號後五碼', '', 'warning'); return; }
    Swal.fire({ title: '回報中...', allowOutsideClick: false }); Swal.showLoading();
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "reportDepositBank", id: lastSubmittedBookingId, last5: last5 })
    });
    Swal.fire('已收到回報', '店家核對無誤後會立即更新您的預約！', 'success').then(() => location.reload());
  }
</script>

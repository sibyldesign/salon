<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>線上預約系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FDFBF7',
              100: '#F7EDE8',
              200: '#EBE5DF',
              300: '#D5C7BC',
              400: '#BCA38F',
              500: '#A08875',
              800: '#5C4B3C',
              900: '#3D3126',
            }
          },
          fontFamily: {
            sans: ['Noto Sans TC', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #FDFBF7; }
    .carousel-slide { min-width: 100%; aspect-ratio: 4 / 5; background-size: cover; background-position: center; }
  </style>
</head>
<body class="text-brand-800 antialiased selection:bg-brand-400 selection:text-white pb-20">

<div id="booking-ui" class="max-w-md mx-auto min-h-screen flex flex-col">
  
  <!-- 頂部品牌 Header -->
  <header class="text-center pt-8 pb-5 px-4 bg-brand-50/90 backdrop-blur-md border-b border-brand-200 sticky top-0 z-30">
    <h1 id="brand-title" class="font-serif text-2xl tracking-wider text-brand-900 font-bold">線上預約</h1>
    <div id="brand-subtitle" class="text-xs text-brand-500 tracking-[0.25em] mt-1 font-medium">專業美業沙龍</div>
  </header>

  <!-- 跑馬燈公告 -->
  <div id="promo" class="bg-brand-400 text-white text-xs font-medium py-2.5 px-4 text-center tracking-wide shadow-sm">
    歡迎線上預約
  </div>

  <!-- 4:5 拍立得卡片輪播 (圖1) -->
  <div class="px-4 mt-4" id="bannerWrapper" style="display: none;">
    <div class="bg-brand-100 p-3.5 rounded-3xl shadow-sm border border-brand-200/60">
      <div class="relative overflow-hidden rounded-2xl bg-white shadow-inner">
        <div class="flex transition-transform duration-300 ease-in-out" id="carouselTrack"></div>
        <button class="absolute left-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-brand-500/80 text-white flex items-center justify-center shadow-md backdrop-blur-sm" onclick="moveSlide(-1)">❮</button>
        <button class="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-brand-500/80 text-white flex items-center justify-center shadow-md backdrop-blur-sm" onclick="moveSlide(1)">❯</button>
      </div>
      <div class="flex justify-center gap-1.5 mt-3" id="carouselDots"></div>
    </div>
  </div>

  <main class="flex-1 px-4 mt-4">
    <!-- 主預約表單卡片 -->
    <div class="bg-white/95 rounded-3xl p-6 shadow-sm border border-white/80 backdrop-blur-md mb-6">
      <form id="bookForm" class="space-y-5">
        
        <!-- 電話 -->
        <div>
          <label class="block text-xs font-bold text-brand-800 mb-1.5">手機號碼</label>
          <input type="tel" id="phone" required placeholder="例如：0912345678" class="w-full px-4 py-3 rounded-xl border border-brand-200 bg-brand-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:bg-white transition" oninput="checkPhoneLength(this)" onblur="checkCustomerByPhone()">
          <div id="welcome-msg" class="text-xs font-bold text-brand-500 mt-2" style="display: none;"></div>
        </div>

        <!-- 姓名 -->
        <div>
          <label class="block text-xs font-bold text-brand-800 mb-1.5">您的姓名</label>
          <input type="text" id="name" required placeholder="請輸入姓名" class="w-full px-4 py-3 rounded-xl border border-brand-200 bg-brand-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:bg-white transition">
        </div>

        <!-- LINE 名稱 -->
        <div>
          <label class="block text-xs font-bold text-brand-800 mb-1.5">LINE 顯示名稱 (方便核對預約)</label>
          <input type="text" id="lineName" placeholder="例如：小美" class="w-full px-4 py-3 rounded-xl border border-brand-200 bg-brand-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:bg-white transition">
        </div>

        <!-- 身份切換 (開關控制) -->
        <div id="custTypeSection">
          <label class="block text-xs font-bold text-brand-800 mb-1.5">顧客身份</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" class="type-btn py-2.5 rounded-xl border border-brand-200 text-xs font-bold transition bg-brand-400 text-white shadow-sm" onclick="setType('old', this)">舊朋友</button>
            <button type="button" class="type-btn py-2.5 rounded-xl border border-brand-200 text-xs font-bold transition bg-brand-50/50 text-brand-800" onclick="setType('new', this)">新朋友</button>
          </div>
          <input type="hidden" id="custType" value="old">
        </div>

        <!-- 指定美容師 (開關控制) -->
        <div id="staffSection" style="display: none;">
          <label class="block text-xs font-bold text-brand-800 mb-1.5">選擇服務專員</label>
          <div class="grid grid-cols-3 gap-2" id="staffGrid"></div>
          <input type="hidden" id="staffId" value="all">
          <input type="hidden" id="staffName" value="不指定">
        </div>

        <!-- 預約項目 (加購綁定機制) -->
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-xs font-bold text-brand-800">選擇項目 (可複選)</label>
            <span class="text-[11px] text-brand-400 font-medium" id="addonHint">※ 加購項目需先選擇主項目</span>
          </div>
          <div class="grid grid-cols-2 gap-2" id="service-grid"></div>
          <input type="hidden" id="service" required>
        </div>

        <!-- 選擇日期 (月曆) -->
        <div>
          <label class="block text-xs font-bold text-brand-800 mb-1.5">預約日期</label>
          <div class="border border-brand-200 rounded-2xl overflow-hidden bg-white shadow-sm">
            <div class="flex justify-between items-center px-4 py-2.5 bg-brand-50 border-b border-brand-200">
              <button type="button" class="text-brand-500 font-bold p-1 hover:text-brand-800" onclick="changeMonth(-1)">❮</button>
              <div id="cal-month-year" class="text-xs font-bold text-brand-800">讀取中...</div>
              <button type="button" class="text-brand-500 font-bold p-1 hover:text-brand-800" onclick="changeMonth(1)">❯</button>
            </div>
            <div class="grid grid-cols-7 gap-px bg-brand-200 text-center" id="cal-grid"></div>
          </div>
          <input type="hidden" id="date" required>
        </div>

        <!-- 進場時段 (三欄藥丸網格，圖3) -->
        <div>
          <label class="block text-xs font-bold text-brand-800 mb-1.5">進場時段</label>
          <div class="grid grid-cols-3 gap-2" id="timePillGrid">
            <div class="col-span-3 text-center py-4 text-xs text-brand-400 bg-brand-50/50 rounded-2xl border border-dashed border-brand-200">請先選擇服務項目與日期</div>
          </div>
          <input type="hidden" id="time" required>
        </div>

        <!-- 社群按鈕與店家資訊 (圖2) -->
        <div class="pt-3 border-t border-brand-100">
          <div class="flex justify-center gap-5 my-4">
            <a id="nav-line" href="#" target="_blank" class="w-14 h-14 rounded-full border-2 border-brand-300 bg-white flex items-center justify-center shadow-sm hover:-translate-y-1 hover:border-brand-500 transition">
              <img src="https://cdn-icons-png.flaticon.com/512/124/124027.png" alt="LINE" class="w-7 h-7 object-contain">
            </a>
            <a id="nav-ig" href="#" target="_blank" class="w-14 h-14 rounded-full border-2 border-brand-300 bg-white flex items-center justify-center shadow-sm hover:-translate-y-1 hover:border-brand-500 transition">
              <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="IG" class="w-7 h-7 object-contain">
            </a>
            <a id="nav-map" href="#" target="_blank" class="w-14 h-14 rounded-full border-2 border-brand-300 bg-white flex items-center justify-center shadow-sm hover:-translate-y-1 hover:border-brand-500 transition">
              <img src="https://cdn-icons-png.flaticon.com/512/854/854878.png" alt="Map" class="w-7 h-7 object-contain">
            </a>
          </div>

          <div class="text-center text-xs text-brand-800 space-y-1 mb-5 font-medium">
            <div id="store-address" style="display: none;"></div>
            <div id="store-hours" style="display: none;"></div>
          </div>

          <button type="submit" id="subBtn" class="w-full py-4 bg-brand-400 hover:bg-brand-500 text-white font-bold rounded-full shadow-lg shadow-brand-400/20 text-base tracking-widest transition transform active:scale-95">
            送出預約申請
          </button>
          
          <button type="button" onclick="openCheckModal()" class="w-full py-3 mt-3 bg-transparent border-2 border-brand-300 text-brand-800 font-bold rounded-full text-xs tracking-wider hover:bg-brand-50 transition">
            🔍 查詢我的預約紀錄
          </button>
        </div>

      </form>
    </div>

    <!-- 保養叮嚀 -->
    <div class="bg-white/90 rounded-2xl overflow-hidden border border-brand-200 mb-6 shadow-sm" id="careSection" style="display: none;">
      <div class="p-4 bg-white flex justify-between items-center cursor-pointer font-bold text-xs text-brand-800" onclick="toggleCare()">
        <span>居家保養小叮嚀</span>
        <span>▼</span>
      </div>
      <div class="p-4 text-xs text-brand-800/80 leading-relaxed bg-brand-50/50 border-t border-brand-100 whitespace-pre-wrap hidden" id="care-content"></div>
    </div>

    <!-- 作品集專區 -->
    <div class="mb-8" id="portfolioSection" style="display: none;">
      <div class="text-center font-serif text-xl tracking-widest text-brand-900 mb-4">PORTFOLIO</div>
      <div class="flex gap-2 justify-center flex-wrap mb-4" id="portfolio-tabs"></div>
      <div class="grid grid-cols-2 gap-3" id="portfolio-grid"></div>
    </div>
  </main>

  <footer class="text-center py-6 text-[11px] text-brand-400">
    Designed by <a href="https://heysibyl.com" target="_blank" class="text-brand-500 font-bold hover:underline">Sibyl | 數位管家</a>
  </footer>

</div>

<!-- 預約成功畫面 -->
<div id="success-screen" class="fixed inset-0 bg-brand-50 z-50 flex flex-col items-center justify-center p-6 text-center" style="display: none;">
  <div class="w-20 h-20 bg-brand-100 rounded-full flex items-center justify-center text-3xl text-brand-500 mb-4 shadow-sm">✔</div>
  <h2 class="text-xl font-bold text-brand-900 mb-2">預約申請已送出！</h2>
  <p class="text-xs text-brand-500 mb-6 leading-relaxed">請留意 LINE 訊息，<br>店家確認排程後會立即回覆您喔❤️</p>
  <button class="px-8 py-3 bg-brand-400 text-white text-xs font-bold rounded-full shadow-md" onclick="location.reload()">返回首頁</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxJlhG1eDEwuyjiJedTtvND-iwIzGXA3sfc_iN_Pq-15LIKWwlHGDX5tFRVdlOzfanONA/exec";
  const urlParams = new URLSearchParams(window.location.search);
  const CURRENT_STORE_ID = urlParams.get('store_id') || '2deb066f-98f2-4283-945b-6ae0d6a89acb';

  let db = { availableDates: [], services: [], portfolio: [], promoImgs: [], weeklyOffDays: [1], customOffDates: [] };
  let currentSlide = 0;
  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth();

  window.onload = async function() {
    try {
      const res = await fetch(`${API_URL}?action=getInitialData&store_id=${CURRENT_STORE_ID}`);
      db = await res.json();

      document.getElementById('brand-title').innerText = db.storeName || "線上預約";
      document.getElementById('brand-subtitle').innerText = db.subtitle || "專業美業服務";
      document.getElementById('promo').innerText = db.promoText || "歡迎線上預約";
      document.getElementById('nav-ig').href = db.ig || '#';
      document.getElementById('nav-line').href = db.line || '#';
      document.getElementById('nav-map').href = db.map || '#';

      if (db.address) {
        document.getElementById('store-address').innerText = `📍 ${db.address}`;
        document.getElementById('store-address').style.display = 'block';
      }
      if (db.businessHours) {
        document.getElementById('store-hours').innerText = `🕒 ${db.businessHours}`;
        document.getElementById('store-hours').style.display = 'block';
      }

      if (!db.enableCustType) {
        document.getElementById('custTypeSection').style.display = 'none';
      }

      // 美容師選擇
      if (db.enableStaffSelect && db.staffList && db.staffList.length > 0) {
        const staffGrid = document.getElementById('staffGrid');
        staffGrid.innerHTML = db.staffList.map((s, idx) => `
          <button type="button" class="staff-btn py-2 px-1 rounded-xl border text-xs font-bold truncate transition ${idx === 0 ? 'bg-brand-400 text-white border-brand-400 shadow-sm' : 'bg-brand-50/50 border-brand-200 text-brand-800'}" onclick="selectStaff('${s.id}', '${s.name}', this)">
            ${s.name}
          </button>
        `).join('');
        document.getElementById('staffSection').style.display = 'block';
      }

      // 說明圖輪播
      if (db.enableCarousel && db.promoImgs && db.promoImgs.length > 0) {
        const track = document.getElementById('carouselTrack');
        const dots = document.getElementById('carouselDots');
        track.innerHTML = ''; dots.innerHTML = '';
        db.promoImgs.forEach((imgUrl, i) => {
          track.innerHTML += `<div class="carousel-slide" style="background-image: url('${imgUrl}')"></div>`;
          dots.innerHTML += `<div class="w-2 h-2 rounded-full transition-all ${i === 0 ? 'bg-brand-500 scale-125' : 'bg-brand-300'}"></div>`;
        });
        document.getElementById('bannerWrapper').style.display = 'block';
      }

      if (db.enableCare) {
        document.getElementById('care-content').innerText = db.careText || "暫無資訊";
        document.getElementById('careSection').style.display = 'block';
      }

      // 作品集
      if (db.enablePortfolio && db.portfolio && db.portfolio.length > 0) {
        document.getElementById('portfolioSection').style.display = 'block';
        setupPortfolio();
      }

      renderServices();
      renderFrontCalendar();
    } catch (e) {
      console.error(e);
    }
  };

  function selectStaff(id, name, el) {
    document.querySelectorAll('.staff-btn').forEach(b => {
      b.className = "staff-btn py-2 px-1 rounded-xl border text-xs font-bold truncate transition bg-brand-50/50 border-brand-200 text-brand-800";
    });
    el.className = "staff-btn py-2 px-1 rounded-xl border text-xs font-bold truncate transition bg-brand-400 text-white border-brand-400 shadow-sm";
    document.getElementById('staffId').value = id;
    document.getElementById('staffName').value = name;
    updateTimes();
  }

  function renderServices() {
    const svcGrid = document.getElementById('service-grid');
    svcGrid.innerHTML = '';
    
    // 檢查是否有主項目被勾選
    const hasMainSelected = Array.from(document.querySelectorAll('#service-grid input[data-isaddon="false"]:checked')).length > 0;

    (db.services || []).forEach(s => {
      const isAddon = s.isAddon === true;
      const disabledClass = isAddon && !hasMainSelected ? 'opacity-40 pointer-events-none' : '';

      svcGrid.innerHTML += `
        <label class="service-card flex items-center justify-between p-3 rounded-xl border border-brand-200 bg-brand-50/50 cursor-pointer transition text-xs ${disabledClass}">
          <div class="flex items-center gap-2 truncate">
            <input type="checkbox" value="${s.name}" data-price="${s.price}" data-isaddon="${isAddon}" onchange="handleServiceChange(this)" class="accent-brand-400 rounded">
            <span class="truncate font-medium">${isAddon ? '✨ ' : ''}${s.name}</span>
          </div>
          <span class="text-brand-500 font-bold ml-1 shrink-0">${s.price}元</span>
        </label>`;
    });
  }

  function handleServiceChange(cb) {
    const isAddon = cb.getAttribute('data-isaddon') === 'true';
    
    // 如果取消了所有主項目，自動取消勾選加購項目
    const selectedMainCount = Array.from(document.querySelectorAll('#service-grid input[data-isaddon="false"]:checked')).length;
    if (selectedMainCount === 0) {
      document.querySelectorAll('#service-grid input[data-isaddon="true"]').forEach(addonCb => {
        addonCb.checked = false;
      });
    }

    // 重新計算被選取的項目
    let selectedBoxes = Array.from(document.querySelectorAll('#service-grid input:checked'));
    document.getElementById('service').value = selectedBoxes.map(el => el.value).join(', ');
    
    // 更新樣式與時段
    document.querySelectorAll('.service-card').forEach(card => {
      const input = card.querySelector('input');
      if (input.checked) {
        card.classList.add('bg-brand-100', 'border-brand-400', 'font-bold');
      } else {
        card.classList.remove('bg-brand-100', 'border-brand-400', 'font-bold');
      }

      // 動態控制加購項目是否鎖定
      if (input.getAttribute('data-isaddon') === 'true') {
        if (selectedMainCount > 0) {
          card.classList.remove('opacity-40', 'pointer-events-none');
        } else {
          card.classList.add('opacity-40', 'pointer-events-none');
        }
      }
    });

    updateTimes();
  }

  function moveSlide(direction) {
    const track = document.getElementById('carouselTrack');
    const total = document.querySelectorAll('.carousel-slide').length;
    if (total <= 1) return;
    currentSlide = (currentSlide + direction + total) % total;
    track.style.transform = `translateX(-${currentSlide * 100}%)`;
    document.querySelectorAll('#carouselDots div').forEach((dot, idx) => {
      dot.className = idx === currentSlide ? "w-2 h-2 rounded-full transition-all bg-brand-500 scale-125" : "w-2 h-2 rounded-full transition-all bg-brand-300";
    });
  }

  function renderFrontCalendar() {
    const grid = document.getElementById('cal-grid');
    document.getElementById('cal-month-year').innerText = `${currentYear} 年 ${currentMonth + 1} 月`;
    
    const headers = ['日', '一', '二', '三', '四', '五', '六'];
    let html = headers.map(h => `<div class="bg-brand-50 py-2 text-[11px] font-bold text-brand-400">${h}</div>`).join('');

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    for (let i = 0; i < firstDay; i++) html += `<div class="bg-white py-3"></div>`;
    
    const selectedDate = document.getElementById('date').value;
    for (let i = 1; i <= daysInMonth; i++) {
      let dStr = `${currentYear}/${String(currentMonth + 1).padStart(2, '0')}/${String(i).padStart(2, '0')}`;
      let isAvailable = (db.availableDates || []).includes(dStr);
      let isActive = (dStr === selectedDate);
      
      if (isAvailable) {
        html += `
          <div class="bg-white py-2.5 text-xs font-bold cursor-pointer transition ${isActive ? 'bg-brand-400 text-white' : 'text-brand-900 hover:bg-brand-100'}" onclick="selectDate('${dStr}')">
            ${i}
          </div>`;
      } else {
        html += `<div class="bg-brand-50/50 py-2.5 text-xs text-brand-300 cursor-not-allowed">${i}</div>`;
      }
    }
    grid.innerHTML = html;
  }

  function changeMonth(dir) {
    currentMonth += dir;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderFrontCalendar();
  }

  function selectDate(dStr) {
    document.getElementById('date').value = dStr;
    renderFrontCalendar();
    updateTimes();
  }

  async function updateTimes() {
    const sStr = document.getElementById('service').value;
    const d = document.getElementById('date').value;
    const staffId = document.getElementById('staffId').value;
    const grid = document.getElementById('timePillGrid');

    if (!sStr || !d) {
      grid.innerHTML = '<div class="col-span-3 text-center py-4 text-xs text-brand-400 bg-brand-50/50 rounded-2xl border border-dashed border-brand-200">請先選擇服務項目與日期</div>';
      return;
    }
    grid.innerHTML = '<div class="col-span-3 text-center py-4 text-xs text-brand-500">計算空檔時段中...</div>';

    try {
      const res = await fetch(`${API_URL}?action=getAvailableTimes&store_id=${CURRENT_STORE_ID}&date=${encodeURIComponent(d)}&services=${encodeURIComponent(sStr)}&staff_id=${staffId}`);
      const times = await res.json();
      grid.innerHTML = '';
      if (times.length === 0) {
        grid.innerHTML = '<div class="col-span-3 text-center py-4 text-xs text-red-500 bg-red-50 rounded-2xl border border-red-100">所選項目總時長在該日已無足夠空檔</div>';
      } else {
        times.forEach(t => {
          grid.innerHTML += `
            <div class="time-pill py-2.5 text-center text-xs font-bold rounded-full border border-brand-200 bg-white text-brand-800 cursor-pointer hover:border-brand-400 hover:bg-brand-50 transition shadow-sm" onclick="selectTimePill('${t}', this)">
              ${t}
            </div>`;
        });
      }
    } catch (e) {
      grid.innerHTML = '<div class="col-span-3 text-center py-3 text-xs text-red-500">時段載入失敗</div>';
    }
  }

  function selectTimePill(timeStr, el) {
    document.querySelectorAll('.time-pill').forEach(p => {
      p.className = "time-pill py-2.5 text-center text-xs font-bold rounded-full border border-brand-200 bg-white text-brand-800 cursor-pointer hover:border-brand-400 hover:bg-brand-50 transition shadow-sm";
    });
    el.className = "time-pill py-2.5 text-center text-xs font-bold rounded-full border border-brand-500 bg-brand-500 text-white shadow-md";
    document.getElementById('time').value = timeStr;
  }

  function checkPhoneLength(el) { if (el.value.trim().length >= 10) checkCustomerByPhone(); }

  async function checkCustomerByPhone() {
    let phone = document.getElementById('phone').value.trim();
    if (phone.length >= 8) {
      document.getElementById('welcome-msg').style.display = 'block';
      document.getElementById('welcome-msg').innerText = '🔍 尋找紀錄中...';
      try {
        const res = await fetch(`${API_URL}?action=getCustomerName&store_id=${CURRENT_STORE_ID}&phone=${phone}`);
        const data = await res.json();
        if (data.found) {
          document.getElementById('name').value = data.name;
          if (data.lineName) document.getElementById('lineName').value = data.lineName;
          document.getElementById('welcome-msg').innerHTML = `✨ 歡迎回來，<b>${data.name}</b>！`;
          setType('old', document.querySelectorAll('.type-btn')[0]);
        } else {
          document.getElementById('welcome-msg').style.display = 'none';
          setType('new', document.querySelectorAll('.type-btn')[1]);
        }
      } catch (err) {
        document.getElementById('welcome-msg').style.display = 'none';
      }
    }
  }

  function setType(t, e) {
    document.querySelectorAll('.type-btn').forEach(b => {
      b.className = "type-btn py-2.5 rounded-xl border border-brand-200 text-xs font-bold transition bg-brand-50/50 text-brand-800";
    });
    e.className = "type-btn py-2.5 rounded-xl border border-brand-400 text-xs font-bold transition bg-brand-400 text-white shadow-sm";
    document.getElementById('custType').value = t;
  }

  function toggleCare() {
    const c = document.getElementById('care-content');
    c.classList.toggle('hidden');
  }

  function setupPortfolio() {
    const tabs = document.getElementById('portfolio-tabs');
    const categories = [...new Set((db.portfolio || []).map(p => p.cat))];
    if (categories.length === 0) return;
    tabs.innerHTML = categories.map((cat, idx) => `
      <button class="px-3.5 py-1.5 rounded-full text-xs font-bold border transition ${idx === 0 ? 'bg-brand-400 text-white border-brand-400 shadow-sm' : 'bg-white text-brand-800 border-brand-200'}" onclick="filterWork('${cat}', this)">
        ${cat}
      </button>
    `).join('');
    filterWork(categories[0]);
  }

  function filterWork(cat, el) {
    if (el) {
      document.querySelectorAll('#portfolio-tabs button').forEach(t => {
        t.className = "px-3.5 py-1.5 rounded-full text-xs font-bold border transition bg-white text-brand-800 border-brand-200";
      });
      el.className = "px-3.5 py-1.5 rounded-full text-xs font-bold border transition bg-brand-400 text-white border-brand-400 shadow-sm";
    }
    const grid = document.getElementById('portfolio-grid');
    grid.innerHTML = '';
    const filtered = (db.portfolio || []).filter(w => w.cat === cat);
    filtered.forEach(w => {
      grid.innerHTML += `
        <div class="bg-white rounded-2xl overflow-hidden border border-brand-200 shadow-sm cursor-pointer hover:-translate-y-1 transition" onclick="window.open('${w.link}', '_blank')">
          <div class="w-full aspect-[3/4] bg-cover bg-center" style="background-image:url('${w.img}')"></div>
          <div class="p-2.5 text-center text-xs font-bold text-brand-900 truncate">${w.title}</div>
        </div>`;
    });
  }

  function openCheckModal() {
    Swal.fire({
      title: '🔍 查詢預約紀錄',
      input: 'tel',
      inputLabel: '請輸入您預約時的手機號碼',
      inputPlaceholder: '例如：0912345678',
      showCancelButton: true,
      confirmButtonText: '查詢',
      cancelButtonText: '返回',
      confirmButtonColor: '#A08875'
    }).then(async (result) => {
      if (result.isConfirmed && result.value) {
        Swal.fire({ title: '查詢中...', allowOutsideClick: false }); Swal.showLoading();
        const res = await fetch(`${API_URL}?action=checkBooking&store_id=${CURRENT_STORE_ID}&phone=${result.value}`);
        const data = await res.json();
        if (!data.records || data.records.length === 0) {
          Swal.fire('查無紀錄', '您目前沒有未來的預約紀錄唷！', 'info');
        } else {
          let html = '<div class="space-y-2 text-left">';
          data.records.forEach(r => {
            html += `
              <div class="p-3 bg-brand-50 rounded-xl border border-brand-200">
                <div class="font-bold text-sm text-brand-900">${r.date} ${r.time}</div>
                <div class="text-xs text-brand-800 mt-0.5">項目：${r.service}</div>
                <div class="text-xs font-bold text-green-600 mt-1">狀態：${r.status}</div>
              </div>`;
          });
          html += '</div>';
          Swal.fire({ title: '您的預約紀錄', html: html, confirmButtonText: '好的', confirmButtonColor: '#A08875' });
        }
      }
    });
  }

  document.getElementById('bookForm').onsubmit = async function(e) {
    e.preventDefault();
    if (!document.getElementById('service').value) { alert("請至少勾選一項預約項目！"); return; }
    if (!document.getElementById('date').value) { alert("請在月曆上點選預約日期！"); return; }
    if (!document.getElementById('time').value) { alert("請選取進場時段！"); return; }

    const btn = document.getElementById('subBtn');
    btn.disabled = true; btn.innerText = "正在傳送申請...";

    let totalPrice = 0;
    document.querySelectorAll('#service-grid input:checked').forEach(cb => {
      totalPrice += Number(cb.getAttribute('data-price') || 0);
    });

    const payload = {
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      lineName: document.getElementById('lineName').value,
      type: document.getElementById('custType').value,
      staffId: document.getElementById('staffId').value,
      staffName: document.getElementById('staffName').value,
      service: document.getElementById('service').value,
      price: totalPrice,
      date: document.getElementById('date').value,
      time: document.getElementById('time').value
    };

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "submitBooking", store_id: CURRENT_STORE_ID, data: payload })
      });
      const status = await res.text();
      if (status.includes("SUCCESS")) {
        document.getElementById('booking-ui').style.display = 'none';
        document.getElementById('success-screen').style.display = 'flex';
      } else {
        alert("預約傳送發生問題，請稍候重試");
        btn.disabled = false;
      }
    } catch (err) {
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
